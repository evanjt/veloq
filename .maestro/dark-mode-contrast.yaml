# Dark Mode Contrast Sweep
# US-DK1: all v0.3.0 surfaces must render with correct contrast in dark mode,
# sparklines, trophy pills, section number badges, chevrons, summary cards.
#
# Fix from previous attempt: don't re-launch the app after toggling the theme
# (that loses the setting). Use deep links and internal navigation instead.

appId: com.veloq.app.dev
tags:
  - tier3
  - pack-settings
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# ====================================================================
# Flip theme to dark via Display Settings
# ====================================================================
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://display-settings"
      TARGET: "display-settings-screen"

- extendedWaitUntil:
    visible:
      id: "theme-button-dark"
    timeout: 15000
    optional: true

# Straight after the demo setup the link can be taken while the app is still
# settling on the feed, which leaves the feed in front. Open it once more.
- runFlow:
    when:
      notVisible:
        id: "theme-button-dark"
    commands:
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://display-settings"
            TARGET: "display-settings-screen"

- extendedWaitUntil:
    visible:
      id: "theme-button-dark"
    timeout: 15000

- tapOn:
    id: "theme-button-dark"

# Give Zustand state + MD3 theme propagation time to settle.
- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "screenshots/dark-mode-settings"

# ====================================================================
# Feed in dark mode
# ====================================================================
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://"
      TARGET: "home-screen"

- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "screenshots/dark-mode-feed"

# ====================================================================
# Activity detail Sections tab, where most v0.3.0 dark-mode fixes apply
# ====================================================================
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/demo-test-0?tab=sections"
      TARGET: "activity-detail-screen"

- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000

- tapOn:
    id: "tab-sections"
    optional: true

- extendedWaitUntil:
    visible:
      id: "activity-sections-list"
    timeout: 10000
- takeScreenshot: "screenshots/dark-mode-sections-tab"

# ====================================================================
# Section detail in dark mode, sparklines + trophy + summary card
# ====================================================================
- back
- runFlow:
    file: helpers/navigate-to-sections.yaml
- extendedWaitUntil:
    visible:
      id: "section-row-.*"
    timeout: 30000
- tapOn:
    id: "section-row-.*"
- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 15000
- takeScreenshot: "screenshots/dark-mode-section-detail"

# ====================================================================
# Regional map heatmap contrast
# ====================================================================
- runFlow:
    file: helpers/navigate-to-map.yaml
- extendedWaitUntil:
    visible:
      id: "map-screen"
    timeout: 30000
- runFlow:
    file: helpers/open-map-layers.yaml
- tapOn:
    id: "map-toggle-heatmap"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "screenshots/dark-mode-map-heatmap"

# ====================================================================
# Restore to light so the next run starts clean.
# ====================================================================
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://display-settings"
      TARGET: "display-settings-screen"
- extendedWaitUntil:
    visible:
      id: "theme-button-light"
    timeout: 10000
- tapOn:
    id: "theme-button-light"
- waitForAnimationToEnd:
    timeout: 2000

- assertNotVisible:
    text: "NaN"
