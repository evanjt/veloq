# Fitness Wellness Trends Test
# Tests: HRV, resting HR, and sleep data visibility on the fitness screen

appId: ${APP_ID}
tags:
  - tier2
  - pack-fitness
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-fitness.yaml

# Wait for fitness screen
- extendedWaitUntil:
    visible:
      id: "fitness-screen"
    timeout: 10000

# Scroll to wellness trends chart
- scrollUntilVisible:
    element:
      id: "wellness-trends-chart"
    direction: DOWN
    timeout: 15000
    speed: 40

- assertVisible:
    id: "wellness-trends-chart"

- takeScreenshot: "screenshots/wellness-dashboard-visible"

# Verify no NaN in wellness values
- assertNotVisible:
    text: "NaN"

- takeScreenshot: "screenshots/fitness-wellness-trends-complete"
