# Regional map section popup. The section is opened the way a user opens it: its
# page's overflow menu, Show on map. No step names a section id, because the
# detector assigns those and moves them with its config and the order activities
# arrive.

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-map
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# The catalogue is cut after the seed lands, which takes minutes on a gate
# runner, so the link is followed once the cut has begun. The popup re-reads the
# section as the cut goes on, and the list order is not fixed while it runs.
# The link opens the sections tab itself: a tap on the tab can land while the
# routes link is still being applied, which puts the routes tab back.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://insights?tab=sections"
      TARGET: "routes-screen"
- extendedWaitUntil:
    visible:
      id: "routes-screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "section-row-.*"
    timeout: 300000

- tapOn:
    id: "section-row-0"
- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 10000
- tapOn:
    id: "section-overflow-menu"
- tapOn:
    text: "Show on map"

- extendedWaitUntil:
    visible:
      id: "section-popup"
    timeout: 300000

# The camera fits the section once the record loads, and the section overlay
# auto-hides below neighbourhood zoom. The popup has to outlast that settle.
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: "section-popup"
- assertVisible:
    id: "section-popup-view-details"
- assertVisible:
    id: "section-popup-close"

- tapOn:
    id: "section-popup-close"
# The popup leaves with an animation, slower under the simulator.
- extendedWaitUntil:
    notVisible:
      id: "section-popup"
    timeout: 10000
