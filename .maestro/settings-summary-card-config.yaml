# Settings Summary Card Configuration Test
# Tests: hero metric selection, sparkline toggle

appId: ${APP_ID}
tags:
  - tier2
  - pack-settings
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Navigate directly to summary card settings page
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://summary-card-settings"
      TARGET: "summary-card-settings-screen"

# Verify the summary card settings section exists
- extendedWaitUntil:
    visible:
      id: "settings-summary-card"
    timeout: 10000
    optional: true

- assertVisible:
    id: "settings-summary-card"
    optional: true

- takeScreenshot: "screenshots/settings-summary-card-config"

# Try toggling sparkline
- tapOn:
    id: "settings-summary-card-sparkline-toggle"
    optional: true

- takeScreenshot: "screenshots/settings-summary-card-sparkline-toggled"

# Navigate to home to verify changes applied
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://"
      TARGET: "home-screen"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "screenshots/settings-summary-card-config-complete"
