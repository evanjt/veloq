# About Screen Links Test
# Tests that all links and sections on the about screen are visible

appId: ${APP_ID}
tags:
  - tier2
  - pack-settings
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Navigate to about screen via deep link
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://about"
      TARGET: "about-screen"

- extendedWaitUntil:
    visible:
      id: "about-screen"
    timeout: 10000

- takeScreenshot: "screenshots/about-screen-top"

# Verify app info section is visible
- assertVisible:
    id: "about-app-info"

# Scroll to each intervals.icu row and assert it as it is reached. The native
# header takes the top of the screen, and with larger text sizes centring the
# last row pushes the first one under it, so no row is asserted after the
# scroll has moved past it.
- scrollUntilVisible:
    element:
      id: "about-link-privacy"
    direction: DOWN
    centerElement: true

- assertVisible:
    id: "about-link-privacy"

- scrollUntilVisible:
    element:
      id: "about-link-terms"
    direction: DOWN
    centerElement: true

- assertVisible:
    id: "about-link-terms"

- scrollUntilVisible:
    element:
      id: "about-link-api-terms"
    direction: DOWN
    centerElement: true

- assertVisible:
    id: "about-link-api-terms"

- takeScreenshot: "screenshots/about-screen-intervals-links"

# Scroll down to Veloq links
- scroll

# Verify Veloq link elements are visible
- assertVisible:
    id: "about-link-veloq-privacy"
    optional: true

- assertVisible:
    id: "about-link-license"
    optional: true

- assertVisible:
    id: "about-link-licenses"
    optional: true

- assertVisible:
    id: "about-link-source"
    optional: true

- takeScreenshot: "screenshots/about-screen-veloq-links"

# Scroll to bottom for data attribution
- scroll

- takeScreenshot: "screenshots/about-screen-bottom"

# Tap third-party licenses to navigate
- tapOn:
    id: "about-link-licenses"

- extendedWaitUntil:
    visible:
      id: "licenses-screen"
    timeout: 10000

- takeScreenshot: "screenshots/licenses-screen"

# Navigate back to about (deep link, back button unreliable on iOS)
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://about"
      TARGET: "about-screen"

- extendedWaitUntil:
    visible:
      id: "about-screen"
    timeout: 10000

- takeScreenshot: "screenshots/about-links-complete"
