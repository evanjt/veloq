# Recording Start/Stop Test
# Tests: start recording, unlock screen, pause, stop, review, discard

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  # Only a demo session is this flow's to clean up. The hook runs after a
  # failure too, including the shared setup refusing a real account, and that
  # session is left as it was found.
  - runFlow:
      when:
        visible:
          id: "demo-mode-banner"
      commands:
        - openLink: "veloq://"
        - runFlow:
            when:
              visible: "(?i)discard"
            commands:
              - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Discard a session an earlier flow left running: `record-fab` hides while one
# is active, and the return pill covers the feed.
- runFlow:
    file: helpers/discard-recording.yaml

# Tap the record FAB on the home screen
- tapOn:
    id: "record-fab"

# Dismiss any "Resume previous recording?" dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Expand Cycling category if Ride isn't directly visible (may be collapsed due to
# Choose Ride and start it from the entry screen
- runFlow:
    file: helpers/start-from-entry.yaml
    env:
      SPORT: Ride
      ARMED: "true"

# Wait for recording screen to load
- extendedWaitUntil:
    visible:
      id: "recording-timer"
    timeout: 10000

- takeScreenshot: "screenshots/recording-active"

# Unlock by sliding the track handle right
- runFlow:
    file: helpers/unlock-recording.yaml

- takeScreenshot: "screenshots/recording-unlocked"

# The bar shows Pause or Resume, never both, and a phone on a desk has usually
# auto-paused itself by now. Tapping Pause only where Pause is on screen leaves
# the ride paused either way, which is what the next step reads.
- runFlow:
    when:
      visible:
        id: "control-pause"
    commands:
      - tapOn:
          id: "control-pause"

- extendedWaitUntil:
    visible:
      id: "control-resume"
    timeout: 5000

- takeScreenshot: "screenshots/recording-paused"

# Resume the recording
- tapOn:
    id: "control-resume"

# Resumed is Resume gone. Reading it as Pause arriving is the same fact, but it
# comes back the moment auto-pause re-engages three seconds later, so the
# assertion would pass or fail on the poll's timing rather than on the tap.
- assertNotVisible:
    id: "control-resume"

- takeScreenshot: "screenshots/recording-resumed"

# Back to paused, then stop and review.
- runFlow:
    file: helpers/end-recording.yaml

- assertVisible:
    id: "review-discard-button"

- takeScreenshot: "screenshots/recording-review-screen"

# Long-press discard to return to home
- longPressOn:
    id: "review-discard-button"

# Verify return to home screen
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "screenshots/recording-start-stop-complete"
