# Insights Panel (v0.3.0)
# Verifies the /routes Insights sub-tab renders the panel, and that the panel
# always resolves to exactly one of its two bodies: the card list or the empty
# state. Neither-branch is the failure this guards, a regression in the
# insights ternary (or a throw inside the card map) leaves the panel blank
# while every screenshot-only check still passes.

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# navigate-to-routes helper forces ?tab=routes; use a direct deep link so we
# land on the Insights sub-tab explicitly.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://insights?tab=insights"
      TARGET: "routes-screen"

- extendedWaitUntil:
    visible:
      id: "insights-panel"
    timeout: 15000

- takeScreenshot: "screenshots/insights-panel-default"

# Exactly one body must render. Assert both directions so neither a missing
# card list nor a missing empty state can slip through.
- runFlow:
    when:
      notVisible:
        id: "insights-card-list"
    commands:
      - assertVisible:
          id: "insights-empty"
      - takeScreenshot: "screenshots/insights-empty-state"

- runFlow:
    when:
      notVisible:
        id: "insights-empty"
    commands:
      - assertVisible:
          id: "insights-card-list"
      - takeScreenshot: "screenshots/insights-cards-visible"
      # A short, slow swipe: a long fast one flings a short card list off the top.
      - swipe:
          start: 50%, 75%
          end: 50%, 55%
          duration: 1000
      - waitForAnimationToEnd:
          timeout: 3000
      - assertVisible:
          id: "insights-card-list"
      - takeScreenshot: "screenshots/insights-cards-scrolled"

- assertNotVisible:
    text: "NaN"
- assertNotVisible:
    text: "undefined"
