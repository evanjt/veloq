# Detection preview, kept: Keep writes the previewed config and starts a
# re-analysis of the whole library. The screen returns only once the engine has
# started that run, and refuses with a notice when it does not.
appId: com.veloq.app.dev
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml
- runFlow:
    file: helpers/open-detection-preview.yaml

# A whole number reads the same in either unit system. Pick one that differs
# from the saved value, so a second run of this flow still moves it.
- runFlow:
    file: helpers/scroll-preview-param-row.yaml
    env:
      KEY: minActivities
      NEXT: divergenceThreshold
- tapOn:
    id: "param-edit-minActivities"
- extendedWaitUntil:
    visible:
      id: "param-editor-input"
    timeout: 10000
- copyTextFrom:
    id: "param-editor-input"
- evalScript: "${output.target = maestro.copiedText.trim() == '4' ? '5' : '4'}"
- tapOn:
    id: "param-editor-input"
- eraseText: 10
- inputText: ${output.target}
# On Android the keyboard covers the sheet's Save. iOS shows Save in the sheet's
# header, above the keyboard.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "param-editor-save"

- extendedWaitUntil:
    visible:
      id: "preview-keep-button"
    timeout: 300000
- assertVisible:
    id: "preview-diff-strip"
- runFlow:
    file: helpers/scroll-preview-param-row.yaml
    env:
      KEY: minActivities
      NEXT: divergenceThreshold
- copyTextFrom:
    id: "param-edit-minActivities"
- evalScript: ${output.keptCaption = maestro.copiedText}
- assertTrue:
    condition: ${output.keptCaption.indexOf(output.target) >= 0}
    label: "The typed value is the one previewed"

- tapOn:
    id: "preview-keep-button"
- assertVisible: "Apply these settings\\?"
# The alert's accept carries the screen button's label. Maestro intersects a
# selector's filters, so a relative filter narrows the matches but does not order
# them, and the first in the tree wins. iOS keeps the screen's Keep in the tree
# under the alert, ahead of it, so take the Keep that sits above the screen's.
# On Android the tap under the alert's title reaches the dialog's Keep.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Keep"
          above:
            id: "preview-keep-button"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Keep"
          below: "Apply these settings\\?"

- extendedWaitUntil:
    visible:
      id: "detection-settings-screen"
    timeout: 30000
- assertNotVisible: "Re-analysis did not start"
- assertNotVisible:
    id: "detection-preview-screen"
- takeScreenshot: "screenshots/detection-preview-kept"

# The re-analysis is adopted by the settings screen and runs to its end there.
- extendedWaitUntil:
    visible:
      text: "Reanalyse sections"
    timeout: 300000
- assertNotVisible:
    id: "detection-rescan-refused"
- assertNotVisible:
    id: "detection-rescan-still-running"

# Reopened, the sliders read the config Keep wrote.
- tapOn:
    id: "detection-preview-row"
- extendedWaitUntil:
    visible:
      id: "detection-preview-screen"
    timeout: 30000
- runFlow:
    file: helpers/scroll-preview-param-row.yaml
    env:
      KEY: minActivities
      NEXT: divergenceThreshold
- copyTextFrom:
    id: "param-edit-minActivities"
- assertTrue:
    condition: ${maestro.copiedText == output.keptCaption}
    label: "Keep wrote the previewed config"
