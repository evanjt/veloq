# Activity Chart Type Selector Test
# Tests toggling through all available chart types on activity detail

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-activity
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Wait for demo data to load before deep linking
- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 15000

# Open activity detail via deep link
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/demo-test-0"
      TARGET: "activity-detail-screen"

- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000

# Wait for chart type selector to appear
- extendedWaitUntil:
    visible:
      id: "chart-type-selector"
    timeout: 10000

- takeScreenshot: "screenshots/activity-chart-default"

# Toggle heart rate chart
- runFlow:
    file: helpers/reveal-chart-type.yaml
    env:
      CHART_TYPE: heartrate
- tapOn:
    id: "chart-type-heartrate"
    optional: true

- takeScreenshot: "screenshots/activity-chart-heartrate"

# Toggle power chart
- runFlow:
    file: helpers/reveal-chart-type.yaml
    env:
      CHART_TYPE: power
- tapOn:
    id: "chart-type-power"
    optional: true

- takeScreenshot: "screenshots/activity-chart-power"

# Toggle elevation chart
- runFlow:
    file: helpers/reveal-chart-type.yaml
    env:
      CHART_TYPE: elevation
- tapOn:
    id: "chart-type-elevation"
    optional: true

- takeScreenshot: "screenshots/activity-chart-elevation"

# Toggle speed chart
- runFlow:
    file: helpers/reveal-chart-type.yaml
    env:
      CHART_TYPE: speed
- tapOn:
    id: "chart-type-speed"
    optional: true

- takeScreenshot: "screenshots/activity-chart-speed"

# Toggle cadence chart
- runFlow:
    file: helpers/reveal-chart-type.yaml
    env:
      CHART_TYPE: cadence
- tapOn:
    id: "chart-type-cadence"
    optional: true

- takeScreenshot: "screenshots/activity-chart-cadence"

# Toggle grade chart
- runFlow:
    file: helpers/reveal-chart-type.yaml
    env:
      CHART_TYPE: grade
- tapOn:
    id: "chart-type-grade"
    optional: true

- takeScreenshot: "screenshots/activity-chart-grade"

# Toggle pace chart (may not be available for cycling activities)
- runFlow:
    file: helpers/reveal-chart-type.yaml
    env:
      CHART_TYPE: pace
- tapOn:
    id: "chart-type-pace"
    optional: true

- takeScreenshot: "screenshots/activity-chart-pace"

- takeScreenshot: "screenshots/activity-chart-types-complete"
