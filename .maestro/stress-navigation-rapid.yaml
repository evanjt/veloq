# Stress Test: Rapid Navigation
# Tests app stability under rapid screen transitions.
#
# Every hop waits on the screen it opened, so a link that lands nowhere fails at
# that hop rather than at the end. No hop checks for the iOS "Open" link prompt:
# an app in front opens its own scheme without one, and a conditional check that
# finds nothing waits out Maestro's whole lookup timeout on every hop.

appId: com.veloq.app.dev
tags:
  - tier3
  - pack-stress
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Rapid tab switching (5 full cycles)
- repeat:
    times: 5
    commands:
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://fitness"
            TARGET: "fitness-screen"
      - extendedWaitUntil:
          visible:
            id: "fitness-screen"
          timeout: 15000
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://map"
            TARGET: "map-screen"
      - extendedWaitUntil:
          visible:
            id: "map-screen"
          timeout: 15000
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://"
            TARGET: "home-screen"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 15000

# Rapid secondary screen access
- repeat:
    times: 3
    commands:
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://settings"
            TARGET: "settings-screen"
      - extendedWaitUntil:
          visible:
            id: "settings-screen"
          timeout: 15000
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://about"
            TARGET: "about-screen"
      - extendedWaitUntil:
          visible:
            id: "about-screen"
          timeout: 15000
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://insights"
            TARGET: "routes-screen"
      - extendedWaitUntil:
          visible:
            id: "routes-screen"
          timeout: 15000
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://"
            TARGET: "home-screen"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 15000

# Rapid activity detail access
- repeat:
    times: 5
    commands:
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-0"
            TARGET: "activity-detail-screen"
      - extendedWaitUntil:
          visible:
            id: "activity-detail-screen"
          timeout: 15000
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-1"
            TARGET: "activity-detail-screen"
      - extendedWaitUntil:
          visible:
            id: "activity-detail-screen"
          timeout: 15000
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-2"
            TARGET: "activity-detail-screen"
      - extendedWaitUntil:
          visible:
            id: "activity-detail-screen"
          timeout: 15000
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://"
            TARGET: "home-screen"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 15000

# Verify home is still responsive after rapid navigation
- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 15000

- takeScreenshot: "screenshots/stress-navigation-rapid-complete"
