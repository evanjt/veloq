# Settings Theme Toggle Tests
# Tests theme switching in display settings

appId: ${APP_ID}
tags:
  - tier2
  - pack-settings
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Navigate directly to display settings page
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://display-settings"
      TARGET: "display-settings-screen"

- extendedWaitUntil:
    visible:
      id: "settings-theme-toggle"
    timeout: 5000

# Switch to dark theme
- tapOn: "Dark"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "screenshots/settings-theme-dark"

# Switch to light theme
- tapOn: "Light"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "screenshots/settings-theme-light"

# Switch back to system
- tapOn: "System"
- takeScreenshot: "screenshots/settings-theme-system"
