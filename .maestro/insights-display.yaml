# Insights Tab Display Test
# Verifies insights panel loads, card tapping shows detail sheet with methodology

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Navigate to routes/insights tab
- openLink: "veloq://insights"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "routes-screen"
    timeout: 10000

# Insights panel should always be present in demo mode
- extendedWaitUntil:
    visible:
      id: "insights-panel"
    timeout: 15000

- takeScreenshot: "screenshots/insights-panel-loaded"

# Open the first card from its title. The card's graphic opens the screen its
# data came from, so a tap at the card's centre leaves the tab instead.
- copyTextFrom:
    id: "insight-title"
    index: 0
- evalScript: ${output.cardTitle = maestro.copiedText}
- tapOn:
    id: "insight-title"
    index: 0

# The sheet draws the tapped card, not only its frame.
- extendedWaitUntil:
    visible:
      id: "insight-detail-sheet"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "insight-detail-title"
    timeout: 5000
- copyTextFrom:
    id: "insight-detail-title"
- assertTrue:
    condition: ${maestro.copiedText == output.cardTitle}
    label: "The sheet's title is the tapped card's"

- takeScreenshot: "screenshots/insights-detail-sheet"

# Swipe inside the sheet: the first swipe lifts it to full height, the rest
# scroll its body. A scroll from the screen's centre would start above a sheet
# at half height.
- repeat:
    while:
      notVisible:
        id: "methodology-section"
    times: 8
    commands:
      - swipe:
          start: "50%,85%"
          end: "50%,45%"
      - waitForAnimationToEnd
- assertVisible:
    id: "methodology-section"

- takeScreenshot: "screenshots/insights-display-complete"
