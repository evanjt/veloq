# Insights Tab Display Test
# Verifies insights panel loads, card tapping shows detail sheet with methodology

appId: ${APP_ID}
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Navigate to routes/insights tab
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://insights"
      TARGET: "routes-screen"
- extendedWaitUntil:
    visible:
      id: "routes-screen"
    timeout: 10000

# Insights panel should always be present in demo mode
- extendedWaitUntil:
    visible:
      id: "insights-panel"
    timeout: 15000

- takeScreenshot: "screenshots/insights-panel-loaded"

# Open the first row from its sentence. The whole row opens the sheet.
- tapOn:
    id: "insight-line"
    index: 0

# The sheet draws the tapped card, not only its frame.
- extendedWaitUntil:
    visible:
      id: "insight-detail-sheet"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "insight-detail-title"
    timeout: 5000

- takeScreenshot: "screenshots/insights-detail-sheet"

# Swipe inside the sheet: the first swipe lifts it to full height, the rest
# scroll its body. A scroll from the screen's centre would start above a sheet
# at half height.
- repeat:
    while:
      notVisible:
        id: "methodology-section"
    times: 8
    commands:
      - swipe:
          start: "50%,85%"
          end: "50%,45%"
      - waitForAnimationToEnd
- assertVisible:
    id: "methodology-section"

- takeScreenshot: "screenshots/insights-display-complete"
