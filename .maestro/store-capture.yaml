appId: ${APP_ID}
name: Store capture
tags:
  - tier4
# Raw captures for the store screenshot compositor. Run by path via
# scripts/store-capture.sh, never by tag from CI cron. Output lands in
# screenshots/store-capture/ (the script creates it and moves files into
# artifacts/store/raw/<platform>/<locale>/). Status bar cleanup happens outside
# Maestro, in the wrapper script. Each capture is followed by a check for a
# dev build's warning toast, so a shot carrying one fails the run before the
# wrapper moves it. The wrapper runs the flow once per store language, passing
# the app's code for it as STORE_LANGUAGE (scripts/store-locales.ts), which
# every run has to pass.
# The theme is STORE_THEME, light or dark, which every run passes too: the
# store sets are light, and the website locale is captured again in dark.
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# The store set is captured in the light theme and framed on the day palette.
# The website's dark set is the same shots in the dark theme.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://display-settings"
      TARGET: "display-settings-screen"
- extendedWaitUntil:
    visible:
      id: "theme-button-light"
    timeout: 10000
- runFlow:
    when:
      true: ${STORE_THEME == 'light'}
    commands:
      - tapOn:
          id: "theme-button-light"
- runFlow:
    when:
      true: ${STORE_THEME == 'dark'}
    commands:
      - tapOn:
          id: "theme-button-dark"

# The language this run captures, picked by its code.
- scrollUntilVisible:
    element:
      id: "language-${STORE_LANGUAGE}"
    direction: DOWN
- tapOn:
    id: "language-${STORE_LANGUAGE}"
- waitForAnimationToEnd:
    timeout: 3000

# Hide the demo banner for clean captures. The switch is gated on demo mode
# and persists in AuthStore, so one tap covers the whole run.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://account"
      TARGET: "account-screen"
- scrollUntilVisible:
    element:
      id: "hide-demo-banner-switch"
    direction: DOWN
- tapOn:
    id: "hide-demo-banner-switch"

# Debug mode is stored in the engine's database, which an iOS run's data reset
# does not reach, so a run that died with it on leaves it on for the next one.
# It is switched off before the first shot, and the switch must read off.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq:///settings"
      TARGET: "settings-screen"
- scrollUntilVisible:
    element:
      id: "settings-version-text"
    direction: DOWN
- scroll
- tapOn:
    id: "settings-version-text"
    repeat: 5
    delay: 100
- scrollUntilVisible:
    element:
      id: "settings-debug-switch"
    direction: DOWN
- swipe:
    start: 50%, 75%
    end: 50%, 25%
    duration: 300
- runFlow:
    when:
      visible:
        id: "settings-debug-switch"
        checked: true
    commands:
      - tapOn:
          id: "settings-debug-switch"
- assertVisible:
    id: "settings-debug-switch"
    checked: false

# 01 activity feed, at its top with the summary card in view. The feed keeps the
# scroll position it was left at, so it is scrolled back before the shot.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://"
      TARGET: "home-screen"
- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "summary-card-sparkline"
    direction: UP
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "routes-sync-banner"
- runFlow:
    file: helpers/assert-debug-ui-absent.yaml
- takeScreenshot: "screenshots/store-capture/01-feed"
- assertNotVisible: "Open debugger to view warnings"

# 02 regional map: satellite style, 3D terrain and the heatmap, framed on a
# demo ride in the Valais. The style and terrain are the athlete's own map
# settings, the heatmap is the layer toggle in the map's layers menu, and the
# camera is the deep link's activity, which the map fits.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq:///settings"
      TARGET: "settings-screen"
- scrollUntilVisible:
    element:
      id: "settings-nav-maps"
    direction: DOWN
- tapOn:
    id: "settings-nav-maps"
- extendedWaitUntil:
    visible:
      id: "map-style-satellite"
    timeout: 10000
- tapOn:
    id: "map-style-satellite"
- runFlow:
    when:
      visible:
        id: "terrain-3d-off"
    commands:
      - tapOn:
          id: "terrain-3d-off"
- runFlow:
    when:
      visible:
        id: "terrain-3d-smart"
    commands:
      - tapOn:
          id: "terrain-3d-smart"
- assertVisible:
    id: "terrain-3d-always"
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://map?activity=demo-test-0"
      TARGET: "map-screen"
- extendedWaitUntil:
    visible:
      id: "regional-map-ready"
    timeout: 30000
- runFlow:
    file: helpers/open-map-layers.yaml
- runFlow:
    when:
      visible:
        id: "map-toggle-heatmap"
        checked: false
    commands:
      - tapOn:
          id: "map-toggle-heatmap"
# The layers panel is shut before the shot: the store set shows the map, the
# heatmap and the ride popup, and the panel is not shown over them.
- runFlow:
    file: helpers/close-map-layers.yaml
# MapLibre tile loading has no deterministic hook, so the satellite imagery and
# the terrain get a settle window after the ready marker.
- waitForAnimationToEnd:
    timeout: 15000
- assertNotVisible:
    id: "map-layers-menu"
- assertNotVisible:
    id: "routes-sync-banner"
- runFlow:
    file: helpers/assert-debug-ui-absent.yaml
- takeScreenshot: "screenshots/store-capture/02-map"
- assertNotVisible: "Open debugger to view warnings"

# 03 activity detail
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/demo-test-0"
      TARGET: "activity-detail-screen"
- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "routes-sync-banner"
- runFlow:
    file: helpers/assert-debug-ui-absent.yaml
- takeScreenshot: "screenshots/store-capture/03-activity"
- assertNotVisible: "Open debugger to view warnings"

# 04 section page, with the notification the engine writes for the ride up on
# screen. Debug mode adds the repost button to the activity page, so it is
# switched on only here and off again once the shot is taken.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq:///settings"
      TARGET: "settings-screen"
- scrollUntilVisible:
    element:
      id: "settings-version-text"
    direction: DOWN
- scroll
- tapOn:
    id: "settings-version-text"
    repeat: 5
    delay: 100
# The switch sits below the fold once revealed, and a run that died after turning
# it on leaves it on, so it is only tapped when it is off. A scroll stops with
# the row ten percent in view, behind the tab bar, so the page is taken to its
# end before the tap.
- scrollUntilVisible:
    element:
      id: "settings-debug-switch"
    direction: DOWN
- swipe:
    start: 50%, 75%
    end: 50%, 25%
    duration: 300
- runFlow:
    when:
      visible:
        id: "settings-debug-switch"
        checked: false
    commands:
      - tapOn:
          id: "settings-debug-switch"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    file: helpers/navigate-to-routes.yaml
- extendedWaitUntil:
    notVisible:
      id: "routes-sync-banner"
    timeout: 120000
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/demo-test-3"
      TARGET: "activity-detail-screen"
- extendedWaitUntil:
    visible:
      id: "activity-regenerate-notification-delayed"
    timeout: 15000
# The post is held back 40 seconds. A banner leaves the screen after a few, so
# a post made here would be gone by the time the section page is up.
- evalScript: ${output.postedAt = Date.now()}
- tapOn:
    id: "activity-regenerate-notification-delayed"
# The first post asks for notification permission, and a simulator build has
# not been answered it.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn:
          text: "Allow"
          optional: true
# A ride that is no personal best gets no sentence, and the repost says so in a dialog.
- runFlow:
    when:
      visible: "Nothing to post"
    commands:
      - tapOn: "OK"
- runFlow:
    file: helpers/navigate-to-sections.yaml
- extendedWaitUntil:
    visible:
      id: "sections-list"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "routes-sync-banner"
    timeout: 60000
- tapOn:
    id: "section-row-0"
- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "routes-sync-banner"
# The banner is on screen from about 40 to 48 seconds after the tap and
# Maestro cannot see it, so the shot waits out the clock. An optional wait on a
# text that is never there takes a second or so each time round.
- repeat:
    while:
      true: ${Date.now() - output.postedAt < 42000}
    commands:
      - extendedWaitUntil:
          visible: "never on screen"
          timeout: 1000
          optional: true
- assertNotVisible:
    id: "routes-sync-banner"
- runFlow:
    file: helpers/assert-debug-ui-absent.yaml
- takeScreenshot: "screenshots/store-capture/04-section"
- assertNotVisible: "Open debugger to view warnings"
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq:///settings"
      TARGET: "settings-screen"
- scrollUntilVisible:
    element:
      id: "settings-debug-switch"
    direction: DOWN
- swipe:
    start: 50%, 75%
    end: 50%, 25%
    duration: 300
- runFlow:
    when:
      visible:
        id: "settings-debug-switch"
        checked: true
    commands:
      - tapOn:
          id: "settings-debug-switch"
# The switch must read off here. A miss above is not silent: the run stops, rather
# than carrying debug mode into the shots that follow.
- assertVisible:
    id: "settings-debug-switch"
    checked: false

# 05 insights. A listed library can still carry the regroup its load owed, and
# the shot would carry its "Computing routes" line.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://insights?tab=insights"
      TARGET: "routes-screen"
- extendedWaitUntil:
    visible:
      id: "insights-panel"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "routes-sync-banner"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "routes-sync-banner"
- runFlow:
    file: helpers/assert-debug-ui-absent.yaml
- takeScreenshot: "screenshots/store-capture/05-insights"
- assertNotVisible: "Open debugger to view warnings"

# 06 fitness
- runFlow:
    file: helpers/navigate-to-fitness.yaml
- extendedWaitUntil:
    visible:
      id: "fitness-ctl-value"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "routes-sync-banner"
- runFlow:
    file: helpers/assert-debug-ui-absent.yaml
- takeScreenshot: "screenshots/store-capture/06-fitness"
- assertNotVisible: "Open debugger to view warnings"

# 07 strength, the body diagram with a muscle selected. The point is inside the
# front body's abs, which the demo's sets reach (.maestro/strength-inline-panel.yaml).
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://insights?tab=strength"
      TARGET: "routes-screen"
- extendedWaitUntil:
    visible:
      id: "strength-body-diagram"
    timeout: 30000
- tapOn:
    id: "strength-body-diagram"
    point: "26%,45%"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "routes-sync-banner"
- runFlow:
    file: helpers/assert-debug-ui-absent.yaml
- takeScreenshot: "screenshots/store-capture/07-strength"
- assertNotVisible: "Open debugger to view warnings"

# 08 recording, a ride in progress. The session is taken to review and
# discarded, so the app is left as the next run's setup expects it.
- runFlow:
    file: helpers/discard-recording.yaml
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://"
      TARGET: "home-screen"
- tapOn:
    id: "record-fab"
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"
- runFlow:
    file: helpers/start-from-entry.yaml
    env:
      SPORT: Ride
      ARMED: "true"
- extendedWaitUntil:
    visible:
      id: "recording-timer"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "routes-sync-banner"
- runFlow:
    file: helpers/assert-debug-ui-absent.yaml
- takeScreenshot: "screenshots/store-capture/08-recording"
- assertNotVisible: "Open debugger to view warnings"
- runFlow:
    file: helpers/unlock-recording.yaml
- runFlow:
    file: helpers/end-recording.yaml
- runFlow:
    file: helpers/confirm-review-discard.yaml
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# Leave the app following the phone's language, so the next run's setup reads
# the screens it expects.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://display-settings"
      TARGET: "display-settings-screen"
- scrollUntilVisible:
    element:
      id: "language-system"
    direction: UP
- tapOn:
    id: "language-system"
