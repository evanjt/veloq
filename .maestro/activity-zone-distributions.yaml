# Activity Zone Distributions Test
# Tests: HR/power zone bar charts and interval table on activity detail

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-activity
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Navigate to activity detail
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/demo-test-0"
      TARGET: "activity-detail-screen"

- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000

# Scroll down past charts to find zone distribution
- scroll
- scroll

# Check for zone chart
- assertVisible:
    id: "activity-zone-chart"
    optional: true

- takeScreenshot: "screenshots/activity-zone-distributions"

# Check for interval table
- scroll

- assertVisible:
    id: "activity-interval-table"
    optional: true

- takeScreenshot: "screenshots/activity-interval-table"

# Verify no NaN
- assertNotVisible:
    text: "NaN"
    optional: true

- takeScreenshot: "screenshots/activity-zone-distributions-complete"
