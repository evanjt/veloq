# A clipped encounter card must still reveal and perform its Hide action when
# it returns to view.
appId: com.veloq.app.dev
tags:
  - tier2
  - pack-activity
---
- runFlow:
    file: helpers/setup-demo-mode.yaml
- openLink: "veloq://activity/demo-test-0?tab=sections"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000
- tapOn:
    id: "tab-sections"
    optional: true
- assertVisible:
    id: "activity-sections-list"
# A fresh demo library is still detecting its sections when the tab opens, and
# the cards arrive when detection ends.
- extendedWaitUntil:
    visible:
      id: "section-inline-plot-0"
    timeout: 300000
- assertVisible:
    id: "section-inline-plot-1"
- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 55%
          duration: 500
- assertNotVisible:
    id: "section-inline-plot-0"
- assertNotVisible:
    id: "section-inline-plot-1"
# The list sits in the map sheet, and a drag down past the list's top lowers
# the sheet and takes the cards below the fold, so the drags stop as soon as
# the first card is back. Each starts low, inside the list rather than on the
# tabs above it.
- repeat:
    while:
      notVisible:
        id: "section-inline-plot-0"
    times: 12
    commands:
      - swipe:
          start: 50%, 75%
          end: 50%, 95%
          duration: 500
- assertVisible:
    id: "section-inline-plot-0"
- assertVisible:
    id: "section-inline-plot-1"
# Swipe each card from its own centre, since a fixed height lands on the tab
# bar on a taller screen.
- swipe:
    from:
      id: "section-inline-plot-0"
    direction: LEFT
    duration: 800
- assertVisible:
    id: "section-swipe-remove"
- swipe:
    from:
      id: "section-inline-plot-1"
    direction: LEFT
    duration: 800
- assertVisible:
    id: "section-swipe-remove"
- assertNotVisible:
    id: "section-swipe-remove"
    index: 1
- tapOn:
    id: "section-swipe-remove"
- assertNotVisible:
    id: "section-swipe-remove"
- assertVisible:
    id: "activity-sections-list"
