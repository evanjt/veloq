# Recording Lock Test
# Tests: locked state display, slide to unlock, re-lock, timer visibility while locked

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  - openLink: "veloq://"
  - runFlow:
      when:
        visible: "(?i)discard"
      commands:
        - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Discard a session an earlier flow left running: `record-fab` hides while one
# is active, and the return pill covers the feed.
- runFlow:
    file: helpers/discard-recording.yaml

# Start recording
- tapOn:
    id: "record-fab"

# Dismiss any resume dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Expand Cycling if needed
- runFlow:
    when:
      notVisible:
        id: "record-type-Ride"
    commands:
      - scrollUntilVisible:
          element:
            id: "record-category-cycling"
          direction: DOWN
          timeout: 5000
          speed: 40
      - tapOn:
          id: "record-category-cycling"

- scrollUntilVisible:
    element:
      id: "record-type-Ride"
    direction: DOWN
    timeout: 5000
    speed: 40
    centerElement: true

- tapOn:
    id: "record-type-Ride"

# Wait for recording screen
- extendedWaitUntil:
    visible:
      id: "recording-timer"
    timeout: 10000

# The slide-to-unlock track replaces the controls while locked
- assertVisible:
    id: "unlock-track"

# The timer stays visible while locked
- assertVisible:
    id: "recording-timer"

- takeScreenshot: "screenshots/recording-locked"

# Unlock by sliding the handle right
- runFlow:
    file: helpers/unlock-recording.yaml

# Controls should now be visible. Which ones depends on the recording state:
# auto-pause engages after three seconds under 2 km/h, so a bench-tested phone
# shows Resume rather than Pause. Stop is in both bars and in neither while
# locked, so it is what proves the controls came back.
- extendedWaitUntil:
    visible:
      id: "control-stop"
    timeout: 5000

- takeScreenshot: "screenshots/recording-unlocked"

# Re-lock from the header chip
- tapOn:
    id: "recording-lock-toggle"

# The slide track should come back
- extendedWaitUntil:
    visible:
      id: "unlock-track"
    timeout: 5000

- takeScreenshot: "screenshots/recording-relocked"

# Clean up: unlock, pause, stop, discard
- runFlow:
    file: helpers/unlock-recording.yaml

- extendedWaitUntil:
    visible:
      id: "control-stop"
    timeout: 5000

# Stop wants a paused recording. Pause only if auto-pause has not already.
- runFlow:
    file: helpers/end-recording.yaml

- longPressOn:
    id: "review-discard-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "screenshots/recording-lock-complete"
