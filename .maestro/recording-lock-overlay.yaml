# Recording Lock Test
# Tests: locked state display, slide to unlock, re-lock, timer visibility while locked

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  - openLink: "veloq://"
  - runFlow:
      when:
        visible: "DISCARD"
      commands:
        - tapOn: "DISCARD"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Start recording
- tapOn:
    id: "record-fab"

# Dismiss any resume dialog
- runFlow:
    when:
      visible: "DISCARD"
    commands:
      - tapOn: "DISCARD"

# Expand Cycling if needed
- runFlow:
    when:
      notVisible:
        id: "record-type-Ride"
    commands:
      - scrollUntilVisible:
          element:
            id: "record-category-cycling"
          direction: DOWN
          timeout: 5000
          speed: 40
      - tapOn:
          id: "record-category-cycling"

- scrollUntilVisible:
    element:
      id: "record-type-Ride"
    direction: DOWN
    timeout: 5000
    speed: 40
    centerElement: true

- tapOn:
    id: "record-type-Ride"

# Wait for recording screen
- extendedWaitUntil:
    visible:
      id: "recording-timer"
    timeout: 10000

# The slide-to-unlock track replaces the controls while locked
- assertVisible:
    id: "unlock-track"

# The timer stays visible while locked
- assertVisible:
    id: "recording-timer"

- takeScreenshot: "recording-locked"

# Unlock by sliding the handle right
- swipe:
    from:
      id: "unlock-track-handle"
    direction: RIGHT
    duration: 800

# Controls should now be visible
- extendedWaitUntil:
    visible:
      id: "control-pause"
    timeout: 5000

- takeScreenshot: "recording-unlocked"

# Re-lock from the header chip
- tapOn:
    id: "recording-lock-toggle"

# The slide track should come back
- extendedWaitUntil:
    visible:
      id: "unlock-track"
    timeout: 5000

- takeScreenshot: "recording-relocked"

# Clean up: unlock, pause, stop, discard
- swipe:
    from:
      id: "unlock-track-handle"
    direction: RIGHT
    duration: 800

- extendedWaitUntil:
    visible:
      id: "control-pause"
    timeout: 5000

- tapOn:
    id: "control-pause"

- extendedWaitUntil:
    visible:
      id: "control-resume"
    timeout: 5000

- longPressOn:
    id: "control-stop"

- extendedWaitUntil:
    visible:
      id: "review-save-button"
    timeout: 10000

- longPressOn:
    id: "review-discard-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "recording-lock-complete"
