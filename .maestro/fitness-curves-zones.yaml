# Fitness Curves and Zones Test
# Tests: power/pace curves, zone distribution, season bests, FTP trend, decoupling

appId: ${APP_ID}
tags:
  - tier2
  - pack-fitness
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-fitness.yaml

- extendedWaitUntil:
    visible:
      id: "fitness-screen"
    timeout: 10000

# The curves and season bests are on the performance page.
- tapOn:
    id: "tab-performance"

# Bring the performance section into view and verify it exists (don't expand, keeps page short)
- scrollUntilVisible:
    element:
      id: "fitness-section-performance"
    direction: DOWN
    timeout: 15000
    speed: 40

- takeScreenshot: "screenshots/fitness-performance-header"

# Scroll to season bests section
- scrollUntilVisible:
    element:
      id: "fitness-section-bests"
    direction: DOWN
    timeout: 15000
    speed: 40

- takeScreenshot: "screenshots/fitness-bests-header"

# Zones section, just verify presence, don't try to expand.
# CollapsibleSection headers stay in the accessibility tree even when off-screen,
# which causes `runFlow when visible` + `tapOn` to fire on an untappable element.
- takeScreenshot: "screenshots/fitness-after-bests"

# Zones, the eFTP trend, thresholds and decoupling are on the trends page.
- tapOn:
    id: "tab-trends"

# Bring the trends section into view
- scrollUntilVisible:
    element:
      id: "fitness-section-trends"
    direction: DOWN
    timeout: 15000
    speed: 40
    optional: true

- takeScreenshot: "screenshots/fitness-trends-header"

# Scroll to threshold section (FTP trend)
- scrollUntilVisible:
    element:
      id: "fitness-section-threshold"
    direction: DOWN
    timeout: 15000
    speed: 40
    optional: true

- takeScreenshot: "screenshots/fitness-threshold-header"

# Scroll to efficiency section (decoupling)
- scrollUntilVisible:
    element:
      id: "fitness-section-efficiency"
    direction: DOWN
    timeout: 15000
    speed: 40
    optional: true

- takeScreenshot: "screenshots/fitness-efficiency-header"

# Verify no NaN anywhere
- assertNotVisible:
    text: "NaN"

- takeScreenshot: "screenshots/fitness-curves-zones-complete"
