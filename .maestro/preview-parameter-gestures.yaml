# At phone-sized resolution, every slider in the preview card must take a drag
# inside the card's vertical scroll, before a run, with a run in flight, and
# once a result adds the diff and action rows and the card has to scroll to
# reach the lower rows. Each drag ends at the far end of its track, and the
# second pass drags the other way, so every caption moves both times.
appId: com.veloq.app.dev
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml
- openLink: "veloq://detection-preview"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "detection-preview-screen"
    timeout: 30000
- assertVisible:
    id: "preview-param-panel"
# Each release regenerates on its own, so from the second drag on a run is in
# flight. The first pass moves every value off its default.
- runFlow:
    file: helpers/drag-preview-slider.yaml
    env:
      KEY: proximityThreshold
      NEXT: minSectionLength
      DIRECTION: RIGHT
- runFlow:
    file: helpers/drag-preview-slider.yaml
    env:
      KEY: minSectionLength
      NEXT: maxSectionLength
      DIRECTION: LEFT
- runFlow:
    file: helpers/drag-preview-slider.yaml
    env:
      KEY: maxSectionLength
      NEXT: minActivities
      DIRECTION: LEFT
- runFlow:
    file: helpers/drag-preview-slider.yaml
    env:
      KEY: minActivities
      NEXT: divergenceThreshold
      DIRECTION: RIGHT
- runFlow:
    file: helpers/drag-preview-slider.yaml
    env:
      KEY: divergenceThreshold
      NEXT: presets
      DIRECTION: RIGHT
- extendedWaitUntil:
    visible:
      id: "preview-keep-button"
    timeout: 300000
- assertVisible:
    id: "preview-param-panel"
- takeScreenshot: "screenshots/preview-parameters-result"
# The second pass starts from the bottom of the card with a result on screen,
# so the first row has to scroll back into view.
- runFlow:
    file: helpers/drag-preview-slider.yaml
    env:
      KEY: proximityThreshold
      NEXT: minSectionLength
      DIRECTION: LEFT
- runFlow:
    file: helpers/drag-preview-slider.yaml
    env:
      KEY: minSectionLength
      NEXT: maxSectionLength
      DIRECTION: RIGHT
- runFlow:
    file: helpers/drag-preview-slider.yaml
    env:
      KEY: maxSectionLength
      NEXT: minActivities
      DIRECTION: RIGHT
- runFlow:
    file: helpers/drag-preview-slider.yaml
    env:
      KEY: minActivities
      NEXT: divergenceThreshold
      DIRECTION: LEFT
- runFlow:
    file: helpers/drag-preview-slider.yaml
    env:
      KEY: divergenceThreshold
      NEXT: presets
      DIRECTION: LEFT
- takeScreenshot: "screenshots/preview-parameters-scrolled"
- extendedWaitUntil:
    visible:
      id: "preview-discard-button"
    timeout: 300000
- tapOn:
    id: "preview-discard-button"
