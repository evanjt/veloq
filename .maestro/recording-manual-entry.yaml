# Recording Manual Entry Test
# Tests the manual entry flow: select WeightTraining via All Activities, verify form, discard

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  # Only a demo session is this flow's to clean up. The hook runs after a
  # failure too, including the shared setup refusing a real account, and that
  # session is left as it was found.
  - runFlow:
      when:
        visible:
          id: "demo-mode-banner"
      commands:
        - openLink: "veloq://"
        - runFlow:
            when:
              visible: "(?i)discard"
            commands:
              - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Discard a session an earlier flow left running: `record-fab` hides while one
# is active, and the return pill covers the feed.
- runFlow:
    file: helpers/discard-recording.yaml

# Tap the record FAB on the home screen
- tapOn:
    id: "record-fab"

# Dismiss any "Resume previous recording?" dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Weight training is a manual sport: Start opens its form rather than a clock.
- runFlow:
    file: helpers/start-from-entry.yaml
    env:
      SPORT: WeightTraining
      ARMED: "false"

# Wait for manual entry form to load, verify key form fields
- extendedWaitUntil:
    visible:
      id: "manual-entry-name"
    timeout: 10000

- assertVisible:
    id: "manual-entry-duration"

- assertVisible:
    id: "manual-entry-distance"

# Verify the continue button is visible
- assertVisible:
    id: "manual-entry-continue"

- takeScreenshot: "screenshots/recording-manual-entry-form"

# Navigate back to record type picker then to home
- back

# Back again from record picker to home
- back

# Verify return to home screen
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "screenshots/recording-manual-entry-complete"
