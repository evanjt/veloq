# Power Curve Chart Tests
# Tests the power curve display on fitness screen
# (Power curves migrated from stats to fitness tab)

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-fitness
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-fitness.yaml

# The power curve is the cycling chart, inside the performance section, which
# starts collapsed. The demo athlete rides, so the curve has data to draw.
# The screen above the chips is still drawing its charts on a cold launch, and
# the scroll stops as soon as they show, so the long budget costs nothing.
- scrollUntilVisible:
    element:
      id: "fitness-sport-toggle-Cycling"
    direction: DOWN
    timeout: 30000
    speed: 40

- tapOn:
    id: "fitness-sport-toggle-Cycling"

# Centred, because the tab bar draws over the bottom of the screen and a header
# stopped at the edge takes the tap meant for it.
- scrollUntilVisible:
    element:
      id: "fitness-section-performance"
    direction: DOWN
    timeout: 10000
    speed: 40
    centerElement: true

# The tab stays mounted between flows, so an earlier one may have left it open,
# and an open section may still be drawing its placeholder.
- runFlow:
    when:
      notVisible:
        id: "power-curve-chart"
    commands:
      - runFlow:
          when:
            notVisible:
              id: "power-curve-loading"
          commands:
            - tapOn:
                id: "fitness-section-performance"

# The curve draws a placeholder until its stored body is read, and a scroll
# that starts before then runs past the chart it is looking for.
- extendedWaitUntil:
    notVisible:
      id: "power-curve-loading"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "power-curve-chart"
    direction: DOWN
    timeout: 10000
    speed: 40

- takeScreenshot: "screenshots/stats-power-curve-chart-loaded"

- assertVisible:
    id: "power-curve-duration"

- assertVisible:
    id: "power-curve-watts"

- takeScreenshot: "screenshots/power-curve-complete"
