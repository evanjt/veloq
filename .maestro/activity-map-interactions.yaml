# Activity Map Interactions Test
# Tests: activity map rendering, chart scrub gesture, 3D toggle (optional)

appId: ${APP_ID}
tags:
  - tier2
  - pack-map
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Navigate to activity detail
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/demo-test-0"
      TARGET: "activity-detail-screen"

- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 30000

# Verify map is rendered (terrain preview ready indicates map loaded)
- extendedWaitUntil:
    visible:
      id: "activity-map-preview-ready-demo-test-0"
    timeout: 15000
    optional: true

- takeScreenshot: "screenshots/activity-map-loaded"

# 3D toggle (optional, crashes on emulator with WebGL)
- tapOn:
    id: "map-toggle-3d"
    optional: true

- takeScreenshot: "screenshots/activity-map-3d-attempt"

# Scroll to charts area
- scroll
- scroll

# Perform a horizontal swipe on the chart area to trigger scrub
- swipe:
    start: 30%, 50%
    end: 70%, 50%
    duration: 1000

- takeScreenshot: "screenshots/activity-chart-scrubbed"

# Verify no crash after interactions
- assertVisible:
    id: "activity-detail-screen"

- takeScreenshot: "screenshots/activity-map-interactions-complete"
