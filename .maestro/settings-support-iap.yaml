# IAP regression test: validates the App Store rejection fix.
#
# The Apple reviewer screenshotted "Small Tip" / "Medium Tip" / "Large Tip"
# buttons without prices, those were fake fallback Product objects that
# rendered translation keys as displayPrice when fetchProducts() returned
# empty in their sandbox. Tapping them did nothing because StoreKit had
# no real products to sell. Apple flagged this as "buttons greyed out and
# not clickable".
#
# This flow covers BOTH places the same tips appear:
#   1. Settings → Support card (always visible, inline on the settings screen)
#   2. Home feed → "Enjoying Veloq?" SupportCard (time-gated; we use the
#      developer dashboard to set lastActionDate to 31 days ago to force
#      it to appear).
#
# The fake fallback labels MUST NOT appear in either place. Either real
# tip prices or, off iOS, the GitHub Sponsors fallback is acceptable; iOS
# with no store tips offers no tip control at all.

appId: ${APP_ID}
tags:
  # In the blocking gate core. It guards a shipped App Store rejection, so it
  # has to be able to fail the gate. The gate retries a failed flow on its own
  # from a clean launch, which covers the intermittent settings scroll and
  # debug-dashboard nav that had it quarantined.
  - tier1
  - pack-settings

# The 31d preset persists, so without this every later flow opens the feed on
# "Enjoying Veloq?" and scrolls one card low. It runs on failure too, where the
# flow may never have reached it.
onFlowComplete:
  # Only a demo session is this flow's to clean up. The hook runs after a
  # failure too, including the shared setup refusing a real account, and that
  # session is left as it was found.
  - runFlow:
      when:
        visible:
          id: "demo-mode-banner"
      commands:
        - runFlow:
            file: helpers/unlock-developer-links.yaml
        - runFlow:
            file: helpers/open-link.yaml
            env:
              LINK: "veloq://debug"
              TARGET: "debug-screen"
        - runFlow:
            when:
              visible:
                id: "debug-screen"
            commands:
              # Same edge swipes as the body: the FFI table eats centred ones.
              - repeat:
                  times: 10
                  commands:
                    - swipe:
                        start: 90%, 80%
                        end: 90%, 25%
                        duration: 400
                    - runFlow:
                        when:
                          visible:
                            id: "debug-section-support-card"
                        commands:
                          - assertVisible:
                              id: "debug-section-support-card"
              - runFlow:
                  when:
                    visible:
                      id: "debug-section-support-card"
                  commands:
                    # Opened only when closed, as in the body.
                    - runFlow:
                        when:
                          notVisible:
                            id: "debug-support-legacy-toggle"
                        commands:
                          - tapOn:
                              id: "debug-section-support-card"
                    - scrollUntilVisible:
                        element:
                          id: "debug-support-preset-0d"
                        direction: DOWN
                        timeout: 20000
                    - swipe:
                        start: 90%, 75%
                        end: 90%, 45%
                        duration: 800
                    # Last shown today, so shouldShow() is false again.
                    - tapOn:
                        id: "debug-support-preset-0d"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# ---- Surface 1: Support card on the settings screen ----

- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://settings"
      TARGET: "settings-screen"

- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000

# Prime the scroll container before scrollUntilVisible, as the version-text
# scroll further down does.
- scroll

- scrollUntilVisible:
    element:
      id: "support-section"
    direction: DOWN
    timeout: 30000
    speed: 40

- assertVisible:
    id: "support-section"
    optional: true

- takeScreenshot: "screenshots/settings-support-section"

# These exact strings are what the App Store reviewer screenshotted.
# They must NEVER appear in the Support section after the fallback removal.
- assertNotVisible:
    text: "Small Tip"
- assertNotVisible:
    text: "Medium Tip"
- assertNotVisible:
    text: "Large Tip"

# Real tip buttons, the GitHub Sponsors fallback off iOS, or neither on iOS,
# all checked optionally so neither failing causes flow abort. The takeScreenshot
# above captured whichever variant rendered.
- assertVisible:
    id: "support-tip-buttons"
    optional: true
- assertVisible:
    id: "support-sponsor-button"
    optional: true

# ---- Open the developer dashboard ----

# The dashboard opens by its link once the developer screens are unlocked for
# the session, which needs no tap on the footer switch that ends the settings
# page. The unlock is in memory only, so there is no setting to put back.
- runFlow:
    file: helpers/unlock-developer-links.yaml
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://debug"
      TARGET: "debug-screen"

# The debug dashboard mounts engine/FFI stats, which is slow under software GPU.
- extendedWaitUntil:
    visible:
      id: "debug-screen"
    timeout: 30000

# ---- Find Support Card section in dev dashboard, expand, set 31d ago ----

# The Support Card collapsible is collapsed on a fresh dashboard, but one the
# stack kept from earlier keeps it as it was left, so the header is tapped only
# when the section is closed. Use explicit edge swipes since the FFI metrics
# table can intercept centered swipes.
- repeat:
    times: 10
    commands:
      - swipe:
          start: 90%, 80%
          end: 90%, 25%
          duration: 400
      - runFlow:
          when:
            visible:
              id: "debug-section-support-card"
          commands:
            - assertVisible:
                id: "debug-section-support-card"

- assertVisible:
    id: "debug-section-support-card"

# Scrolled to the end of the page, an open section shows its last row of
# controls, the legacy toggle among them.
- runFlow:
    when:
      notVisible:
        id: "debug-support-legacy-toggle"
    commands:
      - tapOn:
          id: "debug-section-support-card"

# The Support Card section ends the dashboard, so its controls sit near the
# bottom of a page that cannot scroll them to the centre, and a centring scroll
# times out with the control in plain view. Scroll it into view, then swipe at
# the edge (the FFI table eats centred swipes) to lift it as far as the page goes.
- scrollUntilVisible:
    element:
      id: "debug-support-legacy-toggle"
    direction: DOWN
    timeout: 20000
- swipe:
    start: 90%, 75%
    end: 90%, 45%
    duration: 800

# Earlier flows seed demo activities and the app then marks the profile a
# legacy purchaser, which short-circuits the support card ahead of the date
# check. The preset does not clear that flag, so unset it first.
- runFlow:
    when:
      visible: "Unset legacy"
    commands:
      - tapOn:
          id: "debug-support-legacy-toggle"

- scrollUntilVisible:
    element:
      id: "debug-support-preset-31d"
    direction: UP
    timeout: 20000

- evalScript: |
    ${var d = new Date(); d.setDate(d.getDate() - 31); output.supportExpectedDate = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);}

- tapOn:
    id: "debug-support-preset-31d"

# Prove the preset was applied before attributing a missing card to the app.
- assertVisible:
    id: "debug-screen"
- assertVisible:
    text: "${output.supportExpectedDate}"

- takeScreenshot: "screenshots/support-debug-set-31d-ago"

# ---- Surface 2: Home feed → SupportCard ----

# Navigate back to home feed; SupportCard should now appear since
# first use and lastActionDate are 31 days ago with enough days of use, and dismissCount=0.
# The preset also hands the card the session's one ask, which demo mode's quiet
# period or another card would otherwise hold.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://"
      TARGET: "home-screen"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: "support-card"
    timeout: 10000

- assertVisible:
    id: "support-card"

- takeScreenshot: "screenshots/support-card-collapsed"

# Expand the "Support development" section to reveal tip buttons. iOS offers no
# toggle while the store has no tips, since it may send no tip outside the store.
- runFlow:
    when:
      visible:
        id: "support-card-tip-toggle"
    commands:
      - tapOn:
          id: "support-card-tip-toggle"

# Wait for the expand animation
- extendedWaitUntil:
    visible:
      id: "support-card-tip-buttons"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    visible:
      id: "support-card-sponsor-button"
    timeout: 3000
    optional: true

- takeScreenshot: "screenshots/support-card-expanded"

# Same regression check on this surface, fake labels must not appear
- assertNotVisible:
    text: "Small Tip"
- assertNotVisible:
    text: "Medium Tip"
- assertNotVisible:
    text: "Large Tip"

- assertVisible:
    id: "support-card-tip-buttons"
    optional: true
- assertVisible:
    id: "support-card-sponsor-button"
    optional: true

- takeScreenshot: "screenshots/support-iap-complete"
