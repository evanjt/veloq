# A row detached by Android clipping must still open its swipe action after
# scrolling back into view. The second row must close the first action.
appId: com.veloq.app.dev
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-sections.yaml

- extendedWaitUntil:
    visible:
      id: "sections-list"
    timeout: 15000

- assertVisible:
    id: "section-row-0"

- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 20%
          duration: 500

- assertNotVisible:
    id: "section-row-0"

- repeat:
    times: 20
    commands:
      - swipe:
          start: 50%, 55%
          end: 50%, 85%
          duration: 500

- assertVisible:
    id: "section-row-0"

# Swipe each row by its id: the list's header wraps to a height that depends on
# the screen and the language, so a fixed screen height can land on it.
- swipe:
    from:
      id: "section-row-0"
    direction: LEFT
    duration: 800

- assertVisible:
    id: "section-swipe-remove"

- swipe:
    from:
      id: "section-row-1"
    direction: LEFT
    duration: 800

- assertVisible:
    id: "section-swipe-remove"
- assertNotVisible:
    id: "section-swipe-remove"
    index: 1

# Removal keeps the section, so it runs at once and offers Undo in a notice.
- tapOn:
    id: "section-swipe-remove"
- extendedWaitUntil:
    visible:
      id: "notice-snackbar"
    timeout: 5000
- assertVisible:
    id: "sections-list"
