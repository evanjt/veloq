# Activity Sections. Long-press Scrub Smoke
# Long-press on each section row triggers the scrub Pan gesture
# (activateAfterLongPress). This flow is a crash-smoke + screenshot record,
# the per-row correctness of the hit test (right row highlights, no dual
# highlight when two rows share a sectionId) is unit-tested in
# src/__tests__/components/activity/scrubHitTest.test.ts. Maestro releases
# the press before we can assert visible highlight state, so visual
# validation is left to the screenshots.

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-activity
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- openLink: "veloq://activity/demo-test-0?tab=sections"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000

- tapOn:
    id: "tab-sections"
    optional: true

- extendedWaitUntil:
    visible:
      id: "activity-sections-list"
    timeout: 20000

# A fresh demo library is still detecting its sections when the tab opens, and
# the rows arrive when detection ends.
- extendedWaitUntil:
    visible:
      id: "section-inline-plot-0"
    timeout: 300000

- takeScreenshot: "screenshots/sections-scrub-before"

- runFlow:
    when:
      visible:
        text: "No matched sections"
    commands:
      - takeScreenshot: "screenshots/sections-scrub-no-sections"

# The sheet opens at its middle stop, where the third row sits under the
# system gesture bar and a long-press there reaches the system rather than the
# row. Drag the sheet up by its header so every pressed row is clear of it.
- swipe:
    start: 50%, 54%
    end: 50%, 8%
    duration: 600
- waitForAnimationToEnd:
    timeout: 2000

# Long-press each rendered row. activateAfterLongPress fires the Pan gesture
# at LONG_PRESS_DURATION (500ms), and the Rust-side haptic + row highlight
# confirm the scrub started. If the gesture failed to activate on any row,
# the app would either freeze or throw, both would fail this flow.
- runFlow:
    when:
      visible:
        id: "section-inline-plot-0"
    commands:
      - longPressOn:
          id: "section-inline-plot-0"
      - waitForAnimationToEnd:
          timeout: 1500
      - takeScreenshot: "screenshots/sections-scrub-row-0"

- runFlow:
    when:
      visible:
        id: "section-inline-plot-1"
    commands:
      - longPressOn:
          id: "section-inline-plot-1"
      - waitForAnimationToEnd:
          timeout: 1500
      - takeScreenshot: "screenshots/sections-scrub-row-1"

- runFlow:
    when:
      visible:
        id: "section-inline-plot-2"
    commands:
      - longPressOn:
          id: "section-inline-plot-2"
      - waitForAnimationToEnd:
          timeout: 1500
      - takeScreenshot: "screenshots/sections-scrub-row-2"

# Tap the tab already open to release any open state, then verify the list is
# still rendered and hasn't corrupted values. A tap on the list itself lands on
# a row and opens that section.
- tapOn:
    id: "tab-sections"
- waitForAnimationToEnd:
    timeout: 1000

- assertVisible:
    id: "activity-sections-list"
- assertNotVisible:
    text: "NaN"
