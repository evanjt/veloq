# Routes List Tests
# Tests the routes list display and route rows

appId: ${APP_ID}
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-routes.yaml

# Verify routes list container
- extendedWaitUntil:
    visible:
      id: "routes-list"
    timeout: 15000

- takeScreenshot: "screenshots/routes-list-loaded"

- takeScreenshot: "screenshots/routes-list-complete"
