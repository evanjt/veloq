# Local Backup. Backup Now
# US-X2: "Backup Now" succeeds with local backend (writes .veloqdb, updates
#        "Last backup" timestamp, shows success message)
# US-X3: "not encrypted" warning is always reachable from the export row
#
# Companion script: scripts/verify-backup-export.sh pulls the file from the
# emulator and asserts it's a valid SQLite DB with the expected tables.

appId: com.veloq.app.dev
tags:
  - tier3
  - pack-settings
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://backup-settings"
      TARGET: "backup-settings-screen"

- extendedWaitUntil:
    visible:
      id: "backup-now-button"
    timeout: 15000

- takeScreenshot: "screenshots/backup-screen-initial"

- assertVisible:
    id: "backup-last-run-text"

- assertVisible:
    id: "backup-now-button"

# US-X2: tap the button and wait for success. The button sits below the fold
# since the export privacy map joined the section, and the tab bar draws over
# the bottom of the stack screen, so an unscrolled tap lands on Health.
- scrollUntilVisible:
    element:
      id: "backup-now-button"
    direction: DOWN
    centerElement: true

- tapOn:
    id: "backup-now-button"

- extendedWaitUntil:
    visible:
      id: "backup-success-message"
    timeout: 30000

- takeScreenshot: "screenshots/backup-after-success"

# A failure message must NOT appear.
- assertNotVisible:
    id: "backup-error-message"

# Export as well, since that's a distinct code path. Its row sits below the
# fold, under the translucent tab bar.
- scrollUntilVisible:
    element:
      id: "backup-export-button"
    direction: DOWN
    timeout: 20000

# US-X3: the warning is held behind the export row's info button rather than
# drawn inline, so open it there and read it on the explainer sheet.
- swipe:
    start: 50%, 75%
    end: 50%, 45%
    duration: 800
- tapOn:
    id: "backup-info-export"
- extendedWaitUntil:
    visible:
      id: "explainer-sheet"
    timeout: 10000
- assertVisible:
    text: "Backups are not encrypted.*"
- takeScreenshot: "screenshots/backup-not-encrypted-warning"
# The close button is iOS's. An Android sheet draws none, system back closes it.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "explainer-sheet-close"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: "explainer-sheet"
    timeout: 10000

- assertNotVisible:
    text: "NaN"
