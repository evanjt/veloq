# Pull-to-Refresh Test
# Tests pull-to-refresh gesture on the home and fitness screens

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-nav
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Wait for home screen activity list
- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 15000

# Pull to refresh on home screen (swipe down from near top)
- swipe:
    start: 50%, 25%
    end: 50%, 75%
    duration: 500

# Wait for list to still be visible after refresh
- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 10000

# Verify activity data is actually present after refresh. Newer demo rides
# list above this one, so it can start below the fold.
- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "activity-card-demo-test-0"

- takeScreenshot: "screenshots/pull-to-refresh-home"

# Navigate to fitness screen
- runFlow:
    file: helpers/navigate-to-fitness.yaml

# Pull to refresh on fitness screen
- swipe:
    start: 50%, 25%
    end: 50%, 75%
    duration: 500

# Wait for fitness screen to remain visible
- extendedWaitUntil:
    visible:
      id: "fitness-screen"
    timeout: 10000

- takeScreenshot: "screenshots/pull-to-refresh-fitness"

- takeScreenshot: "screenshots/pull-to-refresh-complete"
