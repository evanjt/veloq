# Recordings Library Test
# Tests: open the recordings library from the record screen, verify list/empty state

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  # Only a demo session is this flow's to clean up. The hook runs after a
  # failure too, including the shared setup refusing a real account, and that
  # session is left as it was found.
  - runFlow:
      when:
        visible:
          id: "demo-mode-banner"
      commands:
        - openLink: "veloq://"
        - runFlow:
            when:
              visible: "(?i)discard"
            commands:
              - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Discard a session an earlier flow left running: `record-fab` hides while one
# is active, and the return pill covers the feed.
- runFlow:
    file: helpers/discard-recording.yaml

# Tap the record FAB on the home screen
- tapOn:
    id: "record-fab"

# Dismiss any "Resume previous recording?" dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Wait for record screen
- extendedWaitUntil:
    visible:
      id: "record-start"
    timeout: 10000

# Open the recordings library from the header
- tapOn:
    id: "record-library"

# Library renders, either the list or the empty state
- extendedWaitUntil:
    visible:
      id: "recordings-list"
    timeout: 10000

- takeScreenshot: "screenshots/recordings-library"

# Back to the record screen
# The header is the platform's now, so leaving is the OS back button.
- back

- extendedWaitUntil:
    visible:
      id: "record-start"
    timeout: 10000
