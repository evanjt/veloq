# Section record mark
# Tests: the sections list marks a section whose latest traversal holds the
# record. demo-test-7 is the newest and fastest ride on its route, so its
# sections carry the mark.

appId: com.veloq.app.dev
tags:
  - tier1
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-sections.yaml

# The catalogue is cut from scratch on every cold launch, so the wait is the
# runner's budget and not the workstation's.
- extendedWaitUntil:
    visible:
      id: "section-row-.*"
    timeout: 300000

# The search, filter and sort rows above the list stay put and can reach past
# the middle of a phone screen, so a scroll from the screen's centre moves
# nothing. Swipe inside the list.
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            notVisible:
              id: "section-row-record-.*"
          commands:
            - swipe:
                start: 50%, 82%
                end: 50%, 62%
                duration: 400
- assertVisible:
    id: "section-row-record-.*"
