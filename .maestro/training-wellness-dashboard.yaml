# Training Wellness Dashboard Test
# Tests wellness indicators on the training screen

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-training
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-training.yaml

# Verify training screen loads (WellnessDashboard component is not rendered here;
# wellness data is shown via WellnessTrendsChart and WeeklySummary)
- extendedWaitUntil:
    visible:
      id: "training-screen"
    timeout: 10000
- takeScreenshot: "screenshots/training-wellness-dashboard-loaded"

# Scroll down to verify weekly summary loads (deferred below fold)
- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "weekly-summary"

- takeScreenshot: "screenshots/training-wellness-dashboard-complete"
