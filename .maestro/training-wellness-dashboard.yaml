# Training Wellness Dashboard Test
# Tests wellness indicators on the fitness screen

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-training
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-fitness.yaml

# Wellness data is shown via WellnessTrendsChart and WeeklySummary
- extendedWaitUntil:
    visible:
      id: "fitness-screen"
    timeout: 10000
- takeScreenshot: "screenshots/training-wellness-dashboard-loaded"

# The week, the calendar and the year comparison are on the calendar page.
- tapOn:
    id: "tab-calendar"

# Verify the weekly summary loads
- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "weekly-summary"

- takeScreenshot: "screenshots/training-wellness-dashboard-complete"
