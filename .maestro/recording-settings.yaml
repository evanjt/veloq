# Recording Settings Screen Test
# Tests auto-pause toggle, threshold adjustment, and data field visibility

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  # Only a demo session is this flow's to clean up. The hook runs after a
  # failure too, including the shared setup refusing a real account, and that
  # session is left as it was found.
  - runFlow:
      when:
        visible:
          id: "demo-mode-banner"
      commands:
        - openLink: "veloq://"
        - runFlow:
            when:
              visible: "(?i)discard"
            commands:
              - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Discard a session an earlier flow left running: `record-fab` hides while one
# is active, and the return pill covers the feed.
- runFlow:
    file: helpers/discard-recording.yaml

# Tap the record FAB on the home screen
- tapOn:
    id: "record-fab"

# Dismiss any "Resume previous recording?" dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Wait for the record entry screen
- extendedWaitUntil:
    visible:
      id: "record-start"
    timeout: 10000

# Tap settings button to navigate to recording settings
- tapOn:
    id: "record-settings"

# Wait for recording settings screen
- extendedWaitUntil:
    visible:
      id: "recording-settings-screen"
    timeout: 10000

- takeScreenshot: "screenshots/recording-settings-loaded"

# The auto-pause card starts under the tab bar, where a tap lands on a tab.
- swipe:
    start: 50%, 75%
    end: 50%, 45%
    duration: 800

- assertVisible:
    id: "settings-auto-pause"

- takeScreenshot: "screenshots/recording-settings-auto-pause"

# Tap auto-pause toggle to disable
- tapOn:
    id: "settings-auto-pause"

# Tap auto-pause toggle to re-enable
- tapOn:
    id: "settings-auto-pause"

# Verify threshold controls are visible (cycling threshold row)
- assertVisible:
    id: "settings-threshold-cycling"

# Tap threshold plus button to increase cycling threshold
- tapOn:
    id: "settings-threshold-cycling-plus"

- takeScreenshot: "screenshots/recording-settings-threshold-adjusted"

# Scroll down to see data fields
- scroll

- takeScreenshot: "screenshots/recording-settings-data-fields"

# Navigate back using back button
- back

- takeScreenshot: "screenshots/recording-settings-complete"
