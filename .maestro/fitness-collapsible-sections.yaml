# Fitness Collapsible Sections Test
# Tests expanding and collapsing sections on fitness screen

appId: ${APP_ID}
tags:
  - tier2
  - pack-fitness
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-fitness.yaml

# The curves and season bests are on the performance page.
- tapOn:
    id: "tab-performance"

# Bring the performance section into view. Centre it: the tab bar draws over
# the bottom of the screen, so a header that stops at the edge is visible to
# the accessibility tree and covered on screen, and the tap lands on whichever
# tab is under it.
- scrollUntilVisible:
    element:
      id: "fitness-section-performance"
    direction: DOWN
    timeout: 10000
    speed: 40
    centerElement: true

# Tap to collapse performance section
- tapOn:
    id: "fitness-section-performance"

# Tap to expand it again
- tapOn:
    id: "fitness-section-performance"
- takeScreenshot: "screenshots/fitness-collapsible-sections-performance-expanded"

# Zones, the eFTP trend, thresholds and decoupling are on the trends page.
- tapOn:
    id: "tab-trends"
- extendedWaitUntil:
    visible:
      id: "fitness-section-zones"
    timeout: 10000

# Toggle zones section
- tapOn:
    id: "fitness-section-zones"

- tapOn:
    id: "fitness-section-zones"
- takeScreenshot: "screenshots/fitness-collapsible-sections-zones-expanded"

- takeScreenshot: "screenshots/fitness-collapsible-sections-complete"
