# Settings Persistence Test
# Verifies theme setting persists across navigation

appId: ${APP_ID}
tags:
  - tier2
  - pack-settings
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Navigate directly to display settings page
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://display-settings"
      TARGET: "display-settings-screen"

- extendedWaitUntil:
    visible:
      id: "theme-button-dark"
    timeout: 10000
    optional: true

# Switch to dark theme
- tapOn:
    id: "theme-button-dark"

- takeScreenshot: "screenshots/settings-persistence-dark-set"

# Navigate away to fitness
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://fitness"
      TARGET: "fitness-screen"
- extendedWaitUntil:
    visible:
      id: "fitness-screen"
    timeout: 10000

- takeScreenshot: "screenshots/settings-persistence-navigated-away"

# Navigate back to display settings
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://display-settings"
      TARGET: "display-settings-screen"

- extendedWaitUntil:
    visible:
      id: "theme-button-dark"
    timeout: 10000
    optional: true

# Verify dark theme button is still visible (settings persisted)
- assertVisible:
    id: "theme-button-dark"
    optional: true

- takeScreenshot: "screenshots/settings-persistence-returned"

# Reset to system theme
- tapOn:
    id: "theme-button-system"

- takeScreenshot: "screenshots/settings-persistence-complete"
