# Launch app, enter demo mode if needed, wait for home screen
# Works on emulators, simulators, and physical devices
# Handles: login, system alerts, Activity Notifications, WhatsNewModal
appId: com.veloq.app.dev
---
# A flow that needs the notification prompt still to answer passes
# NOTIFICATIONS_PERMISSION: unset. Every other flow launches with all granted.
# Maestro evaluates no script inside `permissions`, so the choice is made in
# the conditions and each launch passes literals.
- runFlow:
    when:
      true: ${typeof NOTIFICATIONS_PERMISSION !== 'undefined' && NOTIFICATIONS_PERMISSION === 'unset'}
    commands:
      - launchApp:
          clearState: false
          permissions:
            all: allow
            notifications: unset
- runFlow:
    when:
      true: ${typeof NOTIFICATIONS_PERMISSION === 'undefined' || NOTIFICATIONS_PERMISSION !== 'unset'}
    commands:
      - launchApp:
          clearState: false
          permissions:
            all: allow

# Dismiss iOS "Open in Veloq?" deep link confirmation
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

# Wait for either login screen or home screen
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 30000
    optional: true

# If login screen is visible, enter demo mode
- runFlow:
    when:
      visible:
        id: "login-screen"
    commands:
      - tapOn:
          id: "login-demo-button"

# After demo login, multiple dialogs may appear in sequence.
# Wait for SOMETHING to show up (home screen, a dialog, or WhatsNewModal)
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
    optional: true

# Dismiss any system alerts (e.g. "Not Now" for notifications)
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"

# Dismiss Activity Notifications dialog if present
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"

# Dismiss WhatsNewModal if present (auto-triggers on new app version)
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

# Dismiss the in-app tour overlay ("Back to Tour / Close X") that can appear
# after clearing app state on v0.3.0+.
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"

# A stopped ride that was never saved or discarded reopens on the review screen
# at every launch, so a flow that died there would hold every later flow off
# home. Only a demo session's ride is cleared; a real account's is left as found.
- runFlow:
    when:
      visible:
        id: "demo-mode-banner"
    file: discard-recording.yaml

# Final wait for home screen (should be visible now after all dialogs dismissed)
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
    optional: true

# Recovery: stop the app entirely, relaunch, and re-enter demo mode from scratch.
# This handles state pollution from a preceding flow (stuck on section detail,
# settings sub-screen, alert dialog, or any non-home screen).
- runFlow:
    when:
      notVisible:
        id: "home-screen"
    commands:
      - stopApp
      - launchApp:
          clearState: false
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          visible:
            id: "login-screen"
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: "login-screen"
          commands:
            - tapOn:
                id: "login-demo-button"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      - runFlow:
          when:
            visible: "Done"
          commands:
            - tapOn: "Done"
      - runFlow:
          when:
            visible: "Skip"
          commands:
            - tapOn: "Skip"
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - runFlow:
          when:
            visible:
              id: "demo-mode-banner"
          file: discard-recording.yaml
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 30000

# A home screen can also belong to a real account. Never silently run fixture
# flows against that session; leave its credentials and data untouched.
- assertVisible:
    id: "demo-mode-banner"

# Demo fixtures never require a live account sync.
- assertNotVisible:
    id: "sync-error-banner"
