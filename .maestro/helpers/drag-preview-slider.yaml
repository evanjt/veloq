# Scroll one row of the preview parameter card into view, drag its slider and
# check the caption moved. KEY names the parameter, NEXT the row below it or
# `presets` for the last row, DIRECTION the way to drag.
appId: com.veloq.app.dev
---
- runFlow:
    file: scroll-preview-param-row.yaml
# A UISlider tracks only a touch that starts on its thumb, and the swipe starts
# at the slider's centre, so the value is typed at the middle of the slider's
# range first. Each entry is that middle in the unit the editor shows, read off
# the caption: feet and miles on an imperial device, metres and kilometres
# otherwise. The divergence has no step at its middle, so its thumb sits half a
# step off it.
- copyTextFrom:
    id: "param-edit-${KEY}"
- evalScript: ${output.row = ['proximityThreshold', 'minSectionLength', 'maxSectionLength', 'minActivities', 'divergenceThreshold'].indexOf(KEY)}
- evalScript: ${output.imperial = /\d\s*(ft|mi)\b/.test(maestro.copiedText)}
- evalScript: '${output.middle = (output.imperial ? ["656", "3363", "62.76", "6", "0.3"] : ["200", "1025", "101", "6", "0.3"])[output.row]}'
- tapOn:
    id: "param-edit-${KEY}"
- extendedWaitUntil:
    visible:
      id: "param-editor-input"
    timeout: 10000
- tapOn:
    id: "param-editor-input"
- eraseText: 12
- inputText: ${output.middle}
# On Android the keyboard covers the sheet's Save. iOS shows Save in the sheet's
# header, above the keyboard.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "param-editor-save"
- extendedWaitUntil:
    notVisible:
      id: "param-editor-input"
    timeout: 10000
- runFlow:
    file: scroll-preview-param-row.yaml
- copyTextFrom:
    id: "param-edit-${KEY}"
- evalScript: ${output.captionBefore = maestro.copiedText}
# A swipe direction is parsed before any script runs, so each way is literal.
- runFlow:
    when:
      true: ${DIRECTION === 'RIGHT'}
    commands:
      - swipe:
          from:
            id: "param-slider-${KEY}"
          direction: RIGHT
          duration: 700
- runFlow:
    when:
      true: ${DIRECTION === 'LEFT'}
    commands:
      - swipe:
          from:
            id: "param-slider-${KEY}"
          direction: LEFT
          duration: 700
- copyTextFrom:
    id: "param-edit-${KEY}"
- assertTrue:
    condition: ${maestro.copiedText != output.captionBefore}
    label: "Dragging the ${KEY} slider changes its caption"
