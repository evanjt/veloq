# Close a card's hold menu left open over the screen. A slow swipe that starts
# on a card can read as a hold on a loaded emulator, and the next tap then only
# dismisses the menu. The menu does not take Back, which leaves the app, so the
# tap lands on its backdrop in the blank middle of the header instead.
appId: com.veloq.app.dev
---
- runFlow:
    when:
      visible:
        id: "context-menu-scroll"
    commands:
      - tapOn:
          point: "60%, 13%"
      - assertNotVisible:
          id: "context-menu-scroll"
