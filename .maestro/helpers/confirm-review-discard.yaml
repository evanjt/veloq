# Discard the ride on the review screen. Discard is a button that raises a
# confirmation, and the ride goes only on the alert's destructive accept.

appId: com.veloq.app.dev
---
# The button sits below the fold on a short screen, and under a map hero.
- runFlow:
    file: scroll-review-to.yaml
    env:
      TARGET: review-discard-button

# The alert's title is in the app's language, so iOS reads the label off the
# screen's own button, which the alert's accept repeats, and taps the copy of it
# that sits above that button on a phone, and on a tablet the second one.
- runFlow:
    when:
      platform: iOS
    commands:
      - copyTextFrom:
          id: "review-discard-button"
      - tapOn:
          id: "review-discard-button"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "${maestro.copiedText}"
          above:
            id: "review-discard-button"
          optional: true
      - tapOn:
          text: "${maestro.copiedText}"
          index: 1
          optional: true

# The alert's words follow the app's language, so on Android its accept is
# reached by the dialog's own positive button, which every language shares.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "review-discard-button"
      - extendedWaitUntil:
          visible:
            id: "android:id/button1"
          timeout: 5000
      - tapOn:
          id: "android:id/button1"
