# Unlock the live recording screen and wait for the control bar.
#
# The lock auto-engages on recording start, and the whole bar is swapped for
# the slide track while it holds (`src/app/recording/[type].tsx`), so nothing
# is tappable until this runs.

appId: ${APP_ID}
---
# Anchor on the handle by test ID so the swipe starts on the track whatever
# the screen height or bottom inset. From an element, Maestro carries a RIGHT
# swipe to 90% of the screen width on the element's own row, past the 80%
# release threshold.
- swipe:
    from:
      id: "unlock-track-handle"
    direction: RIGHT
    duration: 800

# Which buttons come back depends on the recording state: auto-pause engages
# after three seconds under 2 km/h, so a phone on a desk shows Resume rather
# than Pause. Stop is in both bars and in neither while locked, so it is what
# proves the controls are back.
- extendedWaitUntil:
    visible:
      id: "control-stop"
    timeout: 5000
