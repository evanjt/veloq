# Choose SPORT on the record entry screen: its chip when the chip row shows
# it, otherwise from the full list behind More, which then shows it as a chip.
appId: com.veloq.app.dev
---
- extendedWaitUntil:
    visible:
      id: "record-start"
    timeout: 10000

- runFlow:
    when:
      notVisible:
        id: "record-type-${SPORT}"
    commands:
      - tapOn:
          id: "record-sport-more"
      # The list holds about sixty rows, and on iOS each swipe and the read
      # after it take about four seconds, so a sport near the end needs most
      # of a minute to reach.
      - scrollUntilVisible:
          element:
            id: "activity-type-option-${SPORT}"
          direction: DOWN
          timeout: 60000
          speed: 40
      - tapOn:
          id: "activity-type-option-${SPORT}"

- tapOn:
    id: "record-type-${SPORT}"
