# Choose SPORT on the record entry screen: its chip when the chip row shows
# it, otherwise from the full list behind More, which then shows it as a chip.
appId: com.veloq.app.dev
---
- extendedWaitUntil:
    visible:
      id: "record-start"
    timeout: 10000

- runFlow:
    when:
      notVisible:
        id: "record-type-${SPORT}"
    commands:
      # More sits at the clipped end of the row, where a tap on its centre can
      # land on the row's edge and open nothing, so the row is scrolled to its
      # end first. A swipe from the row's middle is long enough to get there.
      - swipe:
          from:
            id: "record-sport-row"
          direction: LEFT
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "record-sport-more"
      # The chip sits at the clipped end of the row, and on iOS a tap that lands
      # while the map is still drawing can be lost, so the sheet is confirmed
      # and the tap made once more if it did not open. The title is the sheet's
      # marker because Android draws no Cancel in a sheet that has no confirm.
      - runFlow:
          when:
            notVisible:
              id: "activity-type-sheet-title"
          commands:
            - tapOn:
                id: "record-sport-more"
      - extendedWaitUntil:
          visible:
            id: "activity-type-sheet-title"
          timeout: 10000
      # The list holds about sixty rows, and on iOS each swipe and the read
      # after it take about four seconds, so a sport near the end needs most
      # of a minute to reach.
      - scrollUntilVisible:
          element:
            id: "activity-type-option-${SPORT}"
          direction: DOWN
          timeout: 60000
          speed: 40
      - tapOn:
          id: "activity-type-option-${SPORT}"

- tapOn:
    id: "record-type-${SPORT}"
