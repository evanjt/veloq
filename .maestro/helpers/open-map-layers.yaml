# Open the Map tab's layers menu, which holds the layer toggles and fit-all.
# A tap on an open menu's control closes it, so this taps only when it is shut.
appId: com.veloq.app.dev
---
- extendedWaitUntil:
    visible:
      id: "map-layers"
    timeout: 30000
- runFlow:
    when:
      notVisible:
        id: "map-layers-menu"
    commands:
      - tapOn:
          id: "map-layers"
      # A tap lost while the map draws leaves the menu shut and the next step
      # looking for a toggle that is not there, so the menu is waited for and
      # the tap made again if it did not open.
      - runFlow:
          when:
            notVisible:
              id: "map-layers-menu"
          commands:
            - tapOn:
                id: "map-layers"
- extendedWaitUntil:
    visible:
      id: "map-layers-menu"
    timeout: 10000
