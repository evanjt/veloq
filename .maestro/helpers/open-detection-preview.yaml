# Open the detection preview the way an athlete does: settings, the routes and
# sections row, then the preview row. Waits for the current catalogue to load.
appId: ${APP_ID}
---
- runFlow:
    file: navigate-to-settings.yaml
# `scrollUntilVisible` counts a row under the tab bar as visible and stops without
# moving, and the tap then lands on a tab. One swipe lifts the row clear of it.
- swipe:
    start: 50%, 75%
    end: 50%, 30%
    duration: 800
- tapOn:
    id: "settings-nav-detection"
- extendedWaitUntil:
    visible:
      id: "detection-settings-screen"
    timeout: 10000
- tapOn:
    id: "detection-preview-row"
- extendedWaitUntil:
    visible:
      id: "detection-preview-screen"
    timeout: 30000
- assertVisible:
    id: "preview-param-panel"
