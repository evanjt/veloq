# Navigate to fitness tab via deep link
appId: com.veloq.app.dev
---
- openLink: "veloq://fitness"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
# The first open after a cold launch mounts the whole tab and can pass ten
# seconds on a simulator.
- extendedWaitUntil:
    visible:
      id: "fitness-screen"
    timeout: 30000
