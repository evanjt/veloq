# Navigate to fitness tab via deep link, on its fitness page whichever page
# a flow left it on
appId: ${APP_ID}
---
- runFlow:
    file: open-link.yaml
    env:
      LINK: "veloq://fitness?tab=fitness"
      TARGET: "fitness-screen"
# The first open after a cold launch mounts the whole tab and can pass ten
# seconds on a simulator.
- extendedWaitUntil:
    visible:
      id: "fitness-screen"
    timeout: 30000
