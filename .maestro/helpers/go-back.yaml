# Leave the current screen through the platform's back.
#
# Maestro's `back` presses the Android system back and does nothing on iOS,
# so there the flow taps the native stack header's back button, which UIKit
# identifies as `BackButton`.

appId: com.veloq.app.dev
---
- runFlow:
    when:
      platform: Android
    commands:
      - back

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
