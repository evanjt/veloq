# Leave a pushed screen for the one under it. Android takes the system back.
# iOS has no system back, and `back` does nothing there, so tap the navigation
# bar's own back control, which the platform names BackButton.

appId: com.veloq.app.dev
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
