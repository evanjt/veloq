# Scroll the activity chart's chip row to the end that holds the chip CHART_TYPE.
# The chips sit on one line that scrolls sideways, and the full-screen button
# sits beside the row's trailing edge. iOS reports a chip past the row's end as
# visible once its frame reaches the screen, and that frame lies under the
# full-screen button, so a visibility check passes while a tap on the chip's
# centre opens the full-screen plot. The row is therefore scrolled to a known
# end instead of being checked: power, heart rate, cadence, speed and pace sit
# at the start, elevation and grade at the end. Each swipe starts on the row,
# which scrolls the row rather than paging the tabs, and a swipe at the row's
# limit moves nothing. A stream the activity did not record has no chip, and
# the row is left where it ends up.
appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${CHART_TYPE == 'elevation' || CHART_TYPE == 'grade'}
    commands:
      - repeat:
          times: 2
          commands:
            - swipe:
                from:
                  id: "chart-type-selector"
                direction: LEFT
                duration: 400
- runFlow:
    when:
      true: ${CHART_TYPE != 'elevation' && CHART_TYPE != 'grade'}
    commands:
      - repeat:
          times: 2
          commands:
            - swipe:
                from:
                  id: "chart-type-selector"
                direction: RIGHT
                duration: 400
