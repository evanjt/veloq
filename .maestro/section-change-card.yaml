# Section change card
# Tests: the release notes reach their last slide, and on a library that has
# never run the detector cutover no sections-changed card is offered.
#
# The card reads only the cutover, which runs once on an upgrade and never on a
# fresh library such as demo mode's. Its counts, progress and failure rows are
# covered in Jest.

appId: ${APP_ID}
tags:
  - tier1
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-settings.yaml

# The release notes row sits in the footer, below the fold. Demo mode never offers
# the What's New card, so this row is the way in.
# The helper lifts the row clear of the tab bar, which the row scrolls under at
# the foot of the list, so the tap lands on it and not on a tab.
- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "settings-release-notes"
      LIST: "settings-scrollview"

- tapOn:
    id: "settings-release-notes"

# Next becomes Done on the last release slide, so the walk stops there.
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            notVisible:
              id: "whats-new-done"
          commands:
            - tapOn:
                id: "whats-new-next"

- extendedWaitUntil:
    visible:
      id: "whats-new-done"
    timeout: 10000

- assertVisible:
    id: "tour-changes-picture"
- assertNotVisible:
    id: "sections-changed-card"

- takeScreenshot: "screenshots/section-change-card"

- tapOn:
    id: "whats-new-done"
- assertNotVisible:
    id: "whats-new-card"
