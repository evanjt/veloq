# Section change card
# Tests: the release notes reach the sections slide, and on a library that has
# never run the detector cutover the slide's card reports no run.
#
# The card reads only the cutover, which runs once on an upgrade and never on a
# fresh library such as demo mode's, so here it draws nothing at all. Its
# counts, progress and failure rows are covered in Jest.

appId: com.veloq.app.dev
tags:
  - tier1
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-settings.yaml

# The release notes row sits in the footer, below the fold. Demo mode never offers
# the What's New card, so this row is the way in.
# The helper lifts the row clear of the tab bar, which the row scrolls under at
# the foot of the list, so the tap lands on it and not on a tab.
- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "settings-release-notes"
      LIST: "settings-scrollview"

- tapOn:
    id: "settings-release-notes"

# The sections slide is the last of the release slides, where Next becomes Done.
# The card itself has no height when it reports nothing, so the walk stops on Done.
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            notVisible:
              id: "whats-new-done"
          commands:
            - tapOn:
                id: "whats-new-next"

- extendedWaitUntil:
    visible:
      id: "whats-new-done"
    timeout: 10000

- assertVisible: "Sections that follow your runs"
- assertNotVisible:
    id: "change-card-progress"
- assertNotVisible:
    id: "change-card-failed"
- assertNotVisible:
    id: "change-card-counts"
- assertNotVisible:
    id: "change-card-settings-reset"

- takeScreenshot: "screenshots/section-change-card"

- tapOn:
    id: "whats-new-done"
- assertNotVisible:
    id: "whats-new-card"
