# Recording Review Screen Test
# Tests the review screen: verify fields, enter activity name, save

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  - openLink: "veloq://"
  - runFlow:
      when:
        visible: "(?i)discard"
      commands:
        - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Discard a session an earlier flow left running: `record-fab` hides while one
# is active, and the return pill covers the feed.
- runFlow:
    file: helpers/discard-recording.yaml

# Start a recording
- tapOn:
    id: "record-fab"

# Dismiss any "Resume previous recording?" dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

- tapOn:
    id: "record-type-Ride"

# Wait for recording screen
- extendedWaitUntil:
    visible:
      id: "recording-timer"
    timeout: 10000

# Unlock the screen (the lock auto-engages on recording start)
- runFlow:
    file: helpers/unlock-recording.yaml

- runFlow:
    file: helpers/end-recording.yaml

# Verify all review fields are visible
- assertVisible:
    id: "review-activity-name"

- assertVisible:
    id: "review-activity-type"

- assertVisible:
    id: "review-discard-button"

- takeScreenshot: "screenshots/recording-review-fields"

# Verify RPE rating section is visible
- assertVisible:
    id: "review-rpe"

# Verify trim section is visible
- assertVisible:
    id: "review-trim"

- takeScreenshot: "screenshots/recording-review-rpe-and-trim"

# Clear the default name and enter a custom one with special characters
- tapOn:
    id: "review-activity-name"

- eraseText:
    charactersToErase: 50

- inputText: "Test Ride 2025"

- takeScreenshot: "screenshots/recording-review-name-entered"

# Tap save, in demo mode this succeeds and navigates home
- tapOn:
    id: "review-save-button"

# Verify return to home screen (no crash)
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "screenshots/recording-review-complete"
