# Recording Review Screen Test
# Tests the review screen: verify fields, enter activity name, save, and see
# the saved ride on the feed

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  # Only a demo session is this flow's to clean up. The hook runs after a
  # failure too, including the shared setup refusing a real account, and that
  # session is left as it was found.
  - runFlow:
      when:
        visible:
          id: "demo-mode-banner"
      commands:
        - openLink: "veloq://"
        - runFlow:
            when:
              visible: "(?i)discard"
            commands:
              - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Discard a session an earlier flow left running: `record-fab` hides while one
# is active, and the return pill covers the feed.
- runFlow:
    file: helpers/discard-recording.yaml

# Start a recording
- tapOn:
    id: "record-fab"

# Dismiss any "Resume previous recording?" dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Choose Ride and start it from the entry screen
- runFlow:
    file: helpers/start-from-entry.yaml
    env:
      SPORT: Ride
      ARMED: "true"

# Wait for recording screen
- extendedWaitUntil:
    visible:
      id: "recording-timer"
    timeout: 10000

# The review draws its map and trim only for a ride with a track. An Android
# emulator reports fixes of its own, and an iOS simulator reports none until it
# is given a route, so there the ride is driven along a short one.
- runFlow:
    when:
      platform: iOS
    commands:
      - travel:
          points:
            - 51.4769,-0.0005
            - 51.4775,-0.0015
            - 51.4781,-0.0025
            - 51.4787,-0.0035
          speed: 10

# Unlock the screen (the lock auto-engages on recording start)
- runFlow:
    file: helpers/unlock-recording.yaml

- runFlow:
    file: helpers/end-recording.yaml

# The map hero and its trim open the screen, and with them the fields below
# the name sit below the fold.
- assertVisible:
    id: "review-trim"

- takeScreenshot: "screenshots/recording-review-trim"

# Clear the default name and enter a custom one with special characters
- tapOn:
    id: "review-activity-name"

- eraseText:
    charactersToErase: 50

- inputText: "Test Ride 2025"

- takeScreenshot: "screenshots/recording-review-name-entered"

- runFlow:
    file: helpers/dismiss-keyboard.yaml

# Verify the rest of the review fields
- runFlow:
    file: helpers/scroll-review-to.yaml
    env:
      TARGET: review-activity-type

- runFlow:
    file: helpers/scroll-review-to.yaml
    env:
      TARGET: review-discard-button

- takeScreenshot: "screenshots/recording-review-fields"

# Tap save, in demo mode this succeeds and navigates home
- runFlow:
    file: helpers/scroll-review-to.yaml
    env:
      TARGET: review-save-button

- tapOn:
    id: "review-save-button"

# Verify return to home screen (no crash)
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# The saved ride is on the feed under the name it was given. The provisional
# row is written at save time, so no sync is needed for it to appear.
- extendedWaitUntil:
    visible: "Test Ride 2025"
    timeout: 10000

- takeScreenshot: "screenshots/recording-review-complete"
