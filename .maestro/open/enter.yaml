# Entry for timing an activity open: enters demo mode from the login screen,
# walks the first-run dialogs and ends on the feed. Demo mode does not survive
# a relaunch, so every round enters again. The caller starts the app; maestro's
# own launch reports "Unable to launch app" against a freshly installed build.
appId: com.veloq.app.dev
---
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "login-screen"
    commands:
      - tapOn:
          id: "login-demo-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "demo-mode-banner"
