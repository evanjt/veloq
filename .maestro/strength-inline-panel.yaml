# Strength, inline muscle panel (US-T1, US-T2)
# Opens the Strength tab seeded from demo-test-6 (a WeightTraining fixture
# with bench/squat/deadlift sets bulk-inserted via engine.bulkInsertExerciseSets).
# Verifies the body diagram renders, tapping a muscle produces the inline
# panel next to the diagram (not below the fold), and the methodology
# disclaimer is present.

appId: ${APP_ID}
tags:
  - tier2
  - pack-activity
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# The Strength tab lives inside the Insights screen; ?tab=strength selects
# it on mount (handled by the screen's useLocalSearchParams).
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://insights?tab=strength"
      TARGET: "routes-screen"

# hasStrength must resolve true before the Strength tab appears. In demo
# mode that requires exercise_sets to be seeded via bulkInsertExerciseSets
# on first hasStrengthData() check. If it's still false, tap the tab label
# as a fallback after a short wait.
- extendedWaitUntil:
    visible:
      id: "strength-tab"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "strength-tab"
    commands:
      - tapOn: "Strength"
      - extendedWaitUntil:
          visible:
            id: "strength-tab"
          timeout: 10000

- takeScreenshot: "screenshots/strength-tab-initial"

# The body diagram is the primary affordance, must be on screen.
- assertVisible:
    id: "strength-body-diagram"

# Period selector present. The ids are `strength-period-${p.id}` over
# STRENGTH_PERIODS, which is `['7d', '1m', '3m', '6m']`, and the tab opens on
# DEFAULT_PERIOD, which is `6m`. The old `4weeks` vocabulary was renamed on
# 2026-09-05 and no flow was touched, so this assertion failed before the two
# things the flow exists to check.
- assertVisible:
    id: "strength-period-6m"

# Tap inside the front body's abs, which the demo's sets reach. The point is
# relative to the body card and was measured on a 1080x2340 handset: the abs
# span 22 to 31 % across and 38 to 51 % down, so the centre of the card would
# land between the two bodies and select nothing.
- tapOn:
    id: "strength-body-diagram"
    point: "26%,45%"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "screenshots/strength-muscle-panel"
- assertVisible:
    id: "strength-selected-summary"
# The selected muscle's row is one control labelled with its name, and on iOS
# that label hides the name's own text, so the control's label is matched.
- assertVisible:
    text: "Clear Abs.*"
- assertVisible:
    id: "strength-progression-card"

# Methodology disclaimer (US-T2). Match on the distinctive "approximations"
# wording. Fast swipes reach the end of the tab: a slow scrollUntilVisible ran
# out of time with the card still under the tab bar.
- repeat:
    times: 3
    commands:
      - swipe:
          start: "50%,80%"
          end: "50%,30%"
          duration: 400
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    text: ".*approximations.*"

- assertNotVisible:
    text: "NaN"
