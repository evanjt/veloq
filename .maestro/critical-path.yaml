# Critical Path E2E Test
#
# Covers the core user journey in a single flow:
# Auth > Home feed > Activity detail > Charts > Fitness > Training > Map > Routes > Settings

appId: com.veloq.app.dev
tags:
  - tier1
  - pack-nav
  # Quarantined from the blocking gate core: this end-to-end sweep touches the
  # map/charts and is the most sensitive to CI software-GPU flakiness. Runs in
  # the gate's non-blocking flaky lane.
  - flaky
---
# ── Launch & Auth ───────────────────────────────────────
- runFlow:
    file: helpers/setup-demo-mode.yaml

# ── Home Feed ───────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 15000

# A preceding support-card flow can leave this fixed card open above the list.
# Dismiss it through the UI so scrolling reaches the activity viewport.
- runFlow:
    when:
      visible:
        id: "support-card"
    commands:
      - tapOn: "Remind me later"
      - assertNotVisible:
          id: "support-card"

- takeScreenshot: "screenshots/critical-home"

# ── Activity Detail ─────────────────────────────────────
# Newer demo rides list above this fixture, so it can start below the fold.
# The reveal lifts it clear of the tab bar so the tap lands on the card.
- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "activity-card-demo-test-0"
      LIST: "home-activity-list"

# Tap the card overlay specifically (a regex like activity-card-demo-.* also
# matches child chips/pills that deep-link to a sub-tab). The tap occasionally
# fails to register under the CI software GPU, so retry the tap + screen wait.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "activity-card-demo-test-0"
      - extendedWaitUntil:
          visible:
            id: "activity-detail-screen"
          timeout: 15000

- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000

- runFlow:
    when:
      visible:
        id: "chart-type-selector"
    commands:
      - runFlow:
          file: helpers/reveal-chart-type.yaml
          env:
            CHART_TYPE: heartrate
      - tapOn:
          id: "chart-type-heartrate"
          optional: true
      - runFlow:
          file: helpers/reveal-chart-type.yaml
          env:
            CHART_TYPE: power
      - tapOn:
          id: "chart-type-power"
          optional: true
      - runFlow:
          file: helpers/reveal-chart-type.yaml
          env:
            CHART_TYPE: elevation
      - tapOn:
          id: "chart-type-elevation"
          optional: true

- back

# ── Fitness Tab ─────────────────────────────────────────
- runFlow:
    file: helpers/navigate-to-fitness.yaml

- assertVisible:
    id: "fitness-ctl-value"
    optional: true

- assertVisible:
    id: "fitness-atl-value"
    optional: true

- takeScreenshot: "screenshots/critical-fitness"

# ── Fitness Tab, weekly summary ─────────────────────────
- runFlow:
    file: helpers/navigate-to-fitness.yaml

# The week, the calendar and the year comparison are on the calendar page.
- tapOn:
    id: "tab-calendar"

- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "weekly-summary"
      LIST: "fitness-page-calendar"

- takeScreenshot: "screenshots/critical-training"

# ── Map Tab ─────────────────────────────────────────────
- runFlow:
    file: helpers/navigate-to-map.yaml

- assertVisible:
    id: "map-layers"
    optional: true

- takeScreenshot: "screenshots/critical-map"

# ── Routes Tab ──────────────────────────────────────────
- runFlow:
    file: helpers/navigate-to-routes.yaml

- takeScreenshot: "screenshots/critical-routes"

# ── Settings ────────────────────────────────────────────
- runFlow:
    file: helpers/navigate-to-settings.yaml

- takeScreenshot: "screenshots/critical-settings"

# ── Return to Home ──────────────────────────────────────
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://"
      TARGET: "home-screen"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- assertVisible:
    id: "home-activity-list"

- takeScreenshot: "screenshots/critical-home-return"
