# Recording Live Metrics Test
# Tests: data field grid visibility, GPS indicator during recording

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  - openLink: "veloq://"
  - runFlow:
      when:
        visible: "(?i)discard"
      commands:
        - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Start recording
- tapOn:
    id: "record-fab"

# Dismiss any resume dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Verify GPS readiness indicator on record screen
- assertVisible:
    id: "record-gps-status"

- takeScreenshot: "recording-gps-readiness"

# Expand Cycling category if needed
- runFlow:
    when:
      notVisible:
        id: "record-type-Ride"
    commands:
      - scrollUntilVisible:
          element:
            id: "record-category-cycling"
          direction: DOWN
          timeout: 5000
          speed: 40
      - tapOn:
          id: "record-category-cycling"

# Select Ride
- scrollUntilVisible:
    element:
      id: "record-type-Ride"
    direction: DOWN
    timeout: 5000
    speed: 40
    centerElement: true

- tapOn:
    id: "record-type-Ride"

# Wait for recording screen
- extendedWaitUntil:
    visible:
      id: "recording-timer"
    timeout: 10000

# Verify data fields are visible
- assertVisible:
    id: "data-field-speed"
    optional: true

- assertVisible:
    id: "data-field-distance"
    optional: true

- takeScreenshot: "recording-live-metrics"

# Clean up: unlock, pause, stop, discard
# Swipe the full width of the track. A direction swipe anchored to the handle
# only travels the handle's own width, far short of the unlock threshold, so
# the sweep is explicit. The track sits above the bottom inset, which differs
# per platform: measured centre is 82% on Android and 85% on iOS.
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: 12%, 82%
          end: 90%, 82%
          duration: 800
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 12%, 85%
          end: 90%, 85%
          duration: 800

- extendedWaitUntil:
    visible:
      id: "control-pause"
    timeout: 5000

- tapOn:
    id: "control-pause"

- extendedWaitUntil:
    visible:
      id: "control-resume"
    timeout: 5000

- longPressOn:
    id: "control-stop"

- extendedWaitUntil:
    visible:
      id: "review-save-button"
    timeout: 10000

- longPressOn:
    id: "review-discard-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "recording-live-metrics-complete"
