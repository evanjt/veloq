# Recording Live Metrics Test
# Tests: data field grid visibility, GPS indicator during recording

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  - openLink: "veloq://"
  - runFlow:
      when:
        visible: "(?i)discard"
      commands:
        - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Discard a session an earlier flow left running: `record-fab` hides while one
# is active, and the return pill covers the feed.
- runFlow:
    file: helpers/discard-recording.yaml

# Start recording
- tapOn:
    id: "record-fab"

# Dismiss any resume dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Verify GPS readiness indicator on record screen
- assertVisible:
    id: "record-gps-status"

- takeScreenshot: "screenshots/recording-gps-readiness"

# Expand Cycling category if needed
- runFlow:
    when:
      notVisible:
        id: "record-type-Ride"
    commands:
      - scrollUntilVisible:
          element:
            id: "record-category-cycling"
          direction: DOWN
          timeout: 5000
          speed: 40
      - tapOn:
          id: "record-category-cycling"

# Select Ride
- scrollUntilVisible:
    element:
      id: "record-type-Ride"
    direction: DOWN
    timeout: 5000
    speed: 40
    centerElement: true

- tapOn:
    id: "record-type-Ride"

# Wait for recording screen
- extendedWaitUntil:
    visible:
      id: "recording-timer"
    timeout: 10000

# Verify data fields are visible
- assertVisible:
    id: "data-field-speed"
    optional: true

- assertVisible:
    id: "data-field-distance"
    optional: true

- takeScreenshot: "screenshots/recording-live-metrics"

# Clean up: unlock, pause, stop, discard
- runFlow:
    file: helpers/unlock-recording.yaml

- runFlow:
    file: helpers/end-recording.yaml

- longPressOn:
    id: "review-discard-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "screenshots/recording-live-metrics-complete"
