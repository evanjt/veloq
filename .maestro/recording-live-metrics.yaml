# Recording Live Metrics Test
# Tests: data field grid visibility, GPS indicator during recording

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  # Only a demo session is this flow's to clean up. The hook runs after a
  # failure too, including the shared setup refusing a real account, and that
  # session is left as it was found.
  - runFlow:
      when:
        visible:
          id: "demo-mode-banner"
      commands:
        - openLink: "veloq://"
        - runFlow:
            when:
              visible: "(?i)discard"
            commands:
              - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Discard a session an earlier flow left running: `record-fab` hides while one
# is active, and the return pill covers the feed.
- runFlow:
    file: helpers/discard-recording.yaml

# Start recording
- tapOn:
    id: "record-fab"

# Dismiss any resume dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Ride is a GPS sport, so the entry screen shows its readiness over the map
- runFlow:
    file: helpers/choose-sport.yaml
    env:
      SPORT: Ride

- assertVisible:
    id: "record-gps-status"

- takeScreenshot: "screenshots/recording-gps-readiness"

# Choose Ride and start it from the entry screen
- runFlow:
    file: helpers/start-from-entry.yaml
    env:
      SPORT: Ride
      ARMED: "true"

# Wait for recording screen
- extendedWaitUntil:
    visible:
      id: "recording-timer"
    timeout: 10000

# Verify data fields are visible
- assertVisible:
    id: "data-field-speed"
    optional: true

- assertVisible:
    id: "data-field-distance"
    optional: true

- takeScreenshot: "screenshots/recording-live-metrics"

# Clean up: unlock, pause, stop, discard
- runFlow:
    file: helpers/unlock-recording.yaml

- runFlow:
    file: helpers/end-recording.yaml

- longPressOn:
    id: "review-discard-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "screenshots/recording-live-metrics-complete"
