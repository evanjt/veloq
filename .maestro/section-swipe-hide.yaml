# Section Swipe-to-Hide (US-S5)
# Swiping left on a section card reveals the remove action. Tapping it
# should remove the section from the visible list. The row and the action are
# found by id, since a fixed screen height and the action's copy both drift.
#
# Implementation: Swipeable from react-native-gesture-handler in
# ActivitySectionsSection.tsx; the remove action calls handleDisable
# which flips sections.disabled = 1 in the Rust engine.

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- openLink: "veloq://activity/demo-test-0?tab=sections"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000

- tapOn:
    text: "Sections"
    optional: true

- extendedWaitUntil:
    visible:
      id: "activity-sections-list"
    timeout: 10000
    optional: true

# Only run swipe-to-hide if there are section cards to interact with
- runFlow:
    when:
      visible:
        id: "section-inline-plot-0"
    commands:
      - takeScreenshot: "screenshots/section-swipe-before"
      - swipe:
          from:
            id: "section-inline-plot-0"
          direction: LEFT
          duration: 800
      - waitForAnimationToEnd:
          timeout: 1500
      - takeScreenshot: "screenshots/section-swipe-revealed"
      - tapOn:
          id: "section-swipe-remove"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-swipe-after-hide"
      - assertVisible:
          id: "activity-sections-list"

- assertNotVisible:
    text: "NaN"
- assertNotVisible:
    text: "Error"
