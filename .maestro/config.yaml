# Maestro E2E Test Configuration
# Shared settings for all test flows

# The app a flow drives is not named here. Each flow header reads
# `appId: ${APP_ID}`, and the runners pass `-e APP_ID=...`: the E2E gate drives
# the build that ships (com.veloq.app), and scripts/with-maestro.sh and
# .maestro/run-suite.sh default to the development build (com.veloq.app.dev).

# Execution order: continue running remaining flows after a failure
executionOrder:
  continueOnFailure: true

# Deep link scheme for navigation
# Uses veloq:// scheme defined in app.json
env:
  SCHEME: veloq
  # Demo activity IDs for testing
  DEMO_ACTIVITY_0: demo-test-0
  DEMO_ACTIVITY_1: demo-test-1
