# Settings Cache Test
# Tests cache clear button exists and is interactive

appId: ${APP_ID}
tags:
  - tier2
  - pack-settings
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-settings.yaml

# Navigate to cache settings sub-screen
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://cache-settings"
      TARGET: "cache-settings-screen"

# Scroll down to find clear cache button
- scrollUntilVisible:
    element:
      id: "settings-clear-cache"
    direction: DOWN
    timeout: 10000
    speed: 40

- takeScreenshot: "screenshots/settings-cache-section"

- takeScreenshot: "screenshots/settings-cache-complete"
