# Recording Manual Entry Submit Test
# Tests: fill manual entry form and submit to review screen

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  - openLink: "veloq://"
  - runFlow:
      when:
        visible: "(?i)discard"
      commands:
        - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Start recording
- tapOn:
    id: "record-fab"

# Dismiss any resume dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Weight training sits under the collapsed activity list, and an indoor
# type opens the manual entry form.
- extendedWaitUntil:
    visible:
      id: "record-all-activities"
    timeout: 10000
- tapOn:
    id: "record-all-activities"
- swipe:
    start: 50%, 80%
    end: 50%, 30%
    duration: 200
- extendedWaitUntil:
    visible:
      id: "record-category-gym"
    timeout: 5000
- tapOn:
    id: "record-category-gym"
- swipe:
    start: 50%, 70%
    end: 50%, 50%
    duration: 300
- extendedWaitUntil:
    visible:
      id: "record-type-WeightTraining"
    timeout: 5000
- tapOn:
    id: "record-type-WeightTraining"

- extendedWaitUntil:
    visible:
      id: "manual-entry-name"
    timeout: 10000

- tapOn:
    id: "manual-entry-name"
- inputText: "Test Manual Entry"

- tapOn:
    id: "manual-entry-duration"
- eraseText:
    charactersToErase: 10
- inputText: "01:00:00"

- takeScreenshot: "manual-entry-filled"

# Submit to review screen. The button sits under the keyboard and the
# tab bar until the form is scrolled.
- hideKeyboard
- swipe:
    start: 50%, 75%
    end: 50%, 45%
    duration: 800
- extendedWaitUntil:
    visible:
      id: "manual-entry-continue"
    timeout: 5000
- tapOn:
    id: "manual-entry-continue"

# Verify review screen loaded
- extendedWaitUntil:
    visible:
      id: "review-save-button"
    timeout: 10000

- takeScreenshot: "manual-entry-review"

# Discard and return home
- longPressOn:
    id: "review-discard-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "manual-entry-complete"
