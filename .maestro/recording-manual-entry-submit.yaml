# Recording Manual Entry Submit Test
# Tests: fill manual entry form and submit to review screen

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  # Only a demo session is this flow's to clean up. The hook runs after a
  # failure too, including the shared setup refusing a real account, and that
  # session is left as it was found.
  - runFlow:
      when:
        visible:
          id: "demo-mode-banner"
      commands:
        - openLink: "veloq://"
        - runFlow:
            when:
              visible: "(?i)discard"
            commands:
              - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Discard a session an earlier flow left running: `record-fab` hides while one
# is active, and the return pill covers the feed.
- runFlow:
    file: helpers/discard-recording.yaml

# Start recording
- tapOn:
    id: "record-fab"

# Dismiss any resume dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Weight training is a manual sport: Start opens its form rather than a clock.
- runFlow:
    file: helpers/start-from-entry.yaml
    env:
      SPORT: WeightTraining
      ARMED: "false"

- extendedWaitUntil:
    visible:
      id: "manual-entry-name"
    timeout: 10000

- tapOn:
    id: "manual-entry-name"
- inputText: "Test Manual Entry"

- tapOn:
    id: "manual-entry-duration"
- eraseText:
    charactersToErase: 10
- inputText: "01:00:00"

- takeScreenshot: "screenshots/manual-entry-filled"

# Submit to review screen. The button sits under the keyboard and the
# tab bar until the form is scrolled.
- hideKeyboard
- swipe:
    start: 50%, 75%
    end: 50%, 45%
    duration: 800
- extendedWaitUntil:
    visible:
      id: "manual-entry-continue"
    timeout: 5000
- tapOn:
    id: "manual-entry-continue"

# Verify review screen loaded
- extendedWaitUntil:
    visible:
      id: "review-save-button"
    timeout: 10000

- takeScreenshot: "screenshots/manual-entry-review"

# Discard and return home
- longPressOn:
    id: "review-discard-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "screenshots/manual-entry-complete"
