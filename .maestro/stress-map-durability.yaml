# Stress Test: Map Durability Under Heavy Data Load
# Enters demo mode, dismisses tour, opens debug dashboard, loads stress
# activities on top of existing demo data, then exercises the map with
# aggressive zoom/pan/cluster/style interactions.

appId: com.veloq.app.dev
tags:
  - tier3
  - pack-map
---

# Phase 0: Setup demo mode
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Dismiss tour overlay if present (clearState may trigger it)
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"

# Phase 1: Navigate to debug dashboard and load stress data
- openLink: "veloq://debug"
- extendedWaitUntil:
    visible:
      id: "debug-screen"
    timeout: 15000

# Dismiss tour if it follows to debug screen
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

# Scroll directly to a stress preset button (section opens automatically)
- scrollUntilVisible:
    element:
      id: "debug-stress-100"
    direction: DOWN
    timeout: 15000

- takeScreenshot: "stress-01-before-load"

# Load 100 stress activities on top of demo data
- tapOn:
    id: "debug-stress-100"

# Wait for result text (optional — engine stats verify success)
- extendedWaitUntil:
    visible:
      id: "debug-stress-result"
    timeout: 30000
    optional: true

- takeScreenshot: "stress-02-loaded"

# Phase 2: Navigate to map — relaunch app with map deep link
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
    optional: true
- runFlow:
    file: helpers/navigate-to-map.yaml

# Dismiss tour on map if present
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

- waitForAnimationToEnd:
    timeout: 5000

# Fit all to see clusters
- tapOn:
    id: "map-fit-all"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "stress-03-map-clusters"

# Phase 3: Rapid pan across regions
- repeat:
    times: 10
    commands:
      - swipe:
          start: 80%, 50%
          end: 20%, 50%
          duration: 250
      - waitForAnimationToEnd:
          timeout: 400
- takeScreenshot: "stress-04-after-pan"

# Phase 4: Cluster tap and zoom
- tapOn:
    id: "map-fit-all"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- repeat:
    times: 5
    commands:
      - tapOn:
          point: 50%, 50%
      - waitForAnimationToEnd:
          timeout: 800
      - tapOn:
          id: "activity-popup-close"
          optional: true
      - waitForAnimationToEnd:
          timeout: 300

# Phase 5: Style switching under load
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "map-style-toggle"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- takeScreenshot: "stress-05-style-switch"

# Phase 6: Layer toggle rapid cycling
- repeat:
    times: 8
    commands:
      - tapOn:
          id: "map-toggle-activities"
          optional: true
      - waitForAnimationToEnd:
          timeout: 200
      - tapOn:
          id: "map-toggle-sections"
          optional: true
      - waitForAnimationToEnd:
          timeout: 200
      - tapOn:
          id: "map-toggle-heatmap"
          optional: true
      - waitForAnimationToEnd:
          timeout: 200

# Re-enable activities
- tapOn:
    id: "map-toggle-activities"
    optional: true
- waitForAnimationToEnd:
    timeout: 500

# Phase 7: Sustained mixed interaction
- repeat:
    times: 5
    commands:
      - swipe:
          start: 70%, 50%
          end: 30%, 50%
          duration: 300
      - waitForAnimationToEnd:
          timeout: 400
      - swipe:
          start: 50%, 70%
          end: 50%, 30%
          duration: 300
      - waitForAnimationToEnd:
          timeout: 400
      - swipe:
          start: 40%, 40%
          end: 60%, 60%
          duration: 200
      - waitForAnimationToEnd:
          timeout: 400
      - tapOn:
          id: "map-toggle-activities"
          optional: true
      - waitForAnimationToEnd:
          timeout: 200
      - tapOn:
          id: "map-toggle-activities"
          optional: true
      - waitForAnimationToEnd:
          timeout: 400

# Phase 8: Final stability check
- tapOn:
    id: "map-fit-all"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "map-screen"

- assertNotVisible:
    text: "NaN"

- takeScreenshot: "stress-06-final-map"

# Phase 9: Memory check
- openLink: "veloq://debug"
- extendedWaitUntil:
    visible:
      id: "debug-screen"
    timeout: 10000
- takeScreenshot: "stress-07-final-stats"
