# v0.3.0 Feature Tour
# Walks every major surface affected by the 0.2.2 → 0.3.0 work and takes a
# screenshot at each checkpoint. Intended as a fast visual-regression baseline.
#
# Assertions are intentionally light, each screenshot is the primary artifact.
# This flow is the ground-truth "does the app even render the new surfaces"
# check; narrower flows verify specific user stories.

appId: ${APP_ID}
tags:
  - tier2
  - pack-nav
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# ====================================================================
# FEED
# ====================================================================
- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 15000
- takeScreenshot: "screenshots/tour-01-feed-top"

# The filter chips head the list and the feed re-hides them once a pull-to-refresh
# ends, which is at once in demo mode, so a pull cannot hold them for an assertion.
# They stay on screen while a query is typed in the header's search field.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Search"
- runFlow:
    when:
      platform: iOS
    commands:
      # The placeholder ends in an ellipsis character, not three full stops.
      - tapOn: "Search activities…"
- inputText: "Ride"
- extendedWaitUntil:
    visible:
      id: "home-filter-ride"
    timeout: 10000
- assertVisible:
    id: "home-filter-run"
- takeScreenshot: "screenshots/tour-01-feed-filters"
- eraseText: 4
- runFlow:
    file: helpers/dismiss-keyboard.yaml

# Scroll feed to see multiple cards
- swipe:
    start: 50%, 75%
    end: 50%, 25%
    duration: 500
- takeScreenshot: "screenshots/tour-02-feed-scrolled"

# ====================================================================
# ACTIVITY DETAIL. Charts tab (default)
# ====================================================================
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/demo-test-0"
      TARGET: "activity-detail-screen"
- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000
- takeScreenshot: "screenshots/tour-03-activity-charts-default"

# ====================================================================
# ACTIVITY DETAIL. Sections tab (encounters refactor)
# ====================================================================
- tapOn:
    id: "tab-sections"
    optional: true
- extendedWaitUntil:
    visible:
      id: "activity-sections-list"
    timeout: 10000
    optional: true
- takeScreenshot: "screenshots/tour-04-activity-sections-tab"
- assertNotVisible:
    text: "NaN"

# ====================================================================
# ACTIVITY DETAIL. Routes tab
# ====================================================================
- tapOn:
    text: "Route"
    optional: true
- takeScreenshot: "screenshots/tour-05-activity-routes-tab"

# ====================================================================
# SECTION DETAIL (tap first section in list)
# ====================================================================
- tapOn:
    id: "tab-sections"
    optional: true
- tapOn:
    id: "section-inline-plot-0"
    optional: true
- takeScreenshot: "screenshots/tour-06-section-detail"

# Time-range pills (in chart header per US-D1). Labels: 1M, 3M, 6M, 1Y, All.
- tapOn:
    text: "3M"
    optional: true
- takeScreenshot: "screenshots/tour-07-section-detail-3M"

- tapOn:
    text: "All"
    optional: true
- takeScreenshot: "screenshots/tour-08-section-detail-all"

# The section is a card over the activity's own sheet, so a link to the activity that
# is already open leaves the card where it is. Pop the card instead.
- runFlow:
    file: helpers/go-back.yaml
- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000

# ====================================================================
# REGIONAL MAP
# ====================================================================
- runFlow:
    file: helpers/navigate-to-map.yaml
- extendedWaitUntil:
    visible:
      id: "map-screen"
    timeout: 30000
- takeScreenshot: "screenshots/tour-09-regional-map-default"

- runFlow:
    file: helpers/open-map-layers.yaml

- assertVisible:
    id: "map-toggle-heatmap"
- assertVisible:
    id: "map-toggle-activities"
- assertVisible:
    id: "map-toggle-3d"

- tapOn:
    id: "map-toggle-heatmap"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "screenshots/tour-10-regional-map-heatmap"

- tapOn:
    id: "map-toggle-heatmap"
- waitForAnimationToEnd:
    timeout: 2000

# ====================================================================
# INSIGHTS (Routes tab, but called "Insights" in nav)
# ====================================================================
- runFlow:
    file: helpers/navigate-to-routes.yaml
- takeScreenshot: "screenshots/tour-11-insights-top"

# Switch to Routes sub-tab
- tapOn:
    id: "tab-routes"
    optional: true
- takeScreenshot: "screenshots/tour-12-routes-list"

# Switch to Sections sub-tab
- runFlow:
    file: helpers/navigate-to-sections.yaml
- takeScreenshot: "screenshots/tour-13-sections-list"

# ====================================================================
# FITNESS (CTL/ATL/TSB)
# ====================================================================
- runFlow:
    file: helpers/navigate-to-fitness.yaml
- takeScreenshot: "screenshots/tour-14-fitness"

# ====================================================================
# WELLNESS, on the fitness tab below the fitness chart
# ====================================================================
- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "wellness-trends-chart"
      LIST: "fitness-page-fitness"
- takeScreenshot: "screenshots/tour-15-health"

# ====================================================================
# SETTINGS. Storage stats and backup
# ====================================================================
- runFlow:
    file: helpers/navigate-to-settings.yaml
- takeScreenshot: "screenshots/tour-16-settings-top"

# Storage panel is on the cache-settings sub-screen
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://cache-settings"
      TARGET: "cache-settings-screen"
- extendedWaitUntil:
    visible:
      id: "settings-storage-stats"
    timeout: 10000
    optional: true
- takeScreenshot: "screenshots/tour-17-cache-settings-storage"
- assertVisible:
    id: "settings-storage-stats"
    optional: true

# Back to main settings via deep-link (Maestro's `back` is unreliable on iOS)
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://settings"
      TARGET: "settings-screen"
- repeat:
    times: 10
    commands:
      - swipe:
          start: 90%, 80%
          end: 90%, 25%
          duration: 400
- extendedWaitUntil:
    visible:
      id: "settings-version-text"
    timeout: 5000
- takeScreenshot: "screenshots/tour-18-settings-bottom"
- assertVisible:
    id: "settings-version-text"

# ====================================================================
# END
# ====================================================================
- assertNotVisible:
    text: "NaN"
- assertNotVisible:
    text: "undefined"
- takeScreenshot: "screenshots/tour-19-complete"
