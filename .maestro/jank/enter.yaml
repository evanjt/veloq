# Entry without launchApp: maestro's launch reports "Unable to launch app"
# against this install while `adb shell am start` works, so the caller starts
# the app and this only walks the dialogs. A login screen is walked into demo
# mode, and a handset already signed in stays on its own library.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "login-screen"
    commands:
      - tapOn:
          id: "login-demo-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
