# Sensor Settings Test
# Tests: open sensor settings from recording settings, verify paired list and scan UI

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-recording
onFlowComplete:
  - openLink: "veloq://"
  - runFlow:
      when:
        visible: "(?i)discard"
      commands:
        - tapOn: "(?i)discard"
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Tap the record FAB on the home screen
- tapOn:
    id: "record-fab"

# Dismiss any "Resume previous recording?" dialog
- runFlow:
    when:
      visible: "(?i)discard"
    commands:
      - tapOn: "(?i)discard"

# Wait for record screen
- extendedWaitUntil:
    visible:
      id: "record-type-Ride"
    timeout: 10000

# Into recording settings
- tapOn:
    id: "record-settings"

- extendedWaitUntil:
    visible:
      id: "recording-settings-screen"
    timeout: 10000

# Open sensor settings
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 100
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 100
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 100
- extendedWaitUntil:
    visible:
      id: "settings-sensors-link"
    timeout: 5000

- tapOn:
    id: "settings-sensors-link"

- extendedWaitUntil:
    visible:
      id: "sensor-settings-screen"
    timeout: 10000

- takeScreenshot: "sensor-settings"

# Back out
- tapOn:
    id: "sensor-settings-back"

- extendedWaitUntil:
    visible:
      id: "recording-settings-screen"
    timeout: 10000
