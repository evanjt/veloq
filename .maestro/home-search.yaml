# Home Screen Search Test
# Tests search input, filtering, and clearing on the home feed

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-home
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Wait for activity list to load
- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 15000

- takeScreenshot: "screenshots/home-search-before"

# The search field is the native header's: under the title on iOS, behind the
# search icon in the top app bar on Android.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Search"
- runFlow:
    when:
      platform: iOS
    commands:
      # The placeholder ends in an ellipsis character, not three full stops.
      - tapOn: "Search activities…"

# Type search query
- inputText: "Ride"

# Wait briefly for filtering
- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 5000

- takeScreenshot: "screenshots/home-search-filtered"

# Clear the search by erasing text, the field still focused
- eraseText: 4

- takeScreenshot: "screenshots/home-search-cleared"

# Verify the activity list is still visible (no crash from search)
- assertVisible:
    id: "home-activity-list"

- takeScreenshot: "screenshots/home-search-complete"
