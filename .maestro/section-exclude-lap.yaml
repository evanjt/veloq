# Section lap exclusion
# Tests: the demo run that laps a shared loop three times lists its laps on the
# section's lap screen, one lap can be excluded, the section screen then says
# it is partly excluded, and undoing the exclusion clears that again.

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# The lapped run crosses every section on its loop once per lap, so its first
# section has laps to list whichever one the engine ranks first.
- openLink: "veloq://activity/demo-test-8?tab=sections"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

- extendedWaitUntil:
    visible:
      id: "activity-detail-content"
    timeout: 15000

- tapOn:
    text: "Sections"
    optional: true

# The engine cuts the demo catalogue after the seed lands.
- extendedWaitUntil:
    visible:
      id: "section-inline-plot-0"
    timeout: 90000

- tapOn:
    id: "section-inline-plot-0"

- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "section-open-laps"
    direction: DOWN
    timeout: 20000

- assertNotVisible:
    id: "section-partly-excluded"

- tapOn:
    id: "section-open-laps"

- extendedWaitUntil:
    visible:
      id: "section-lap-list"
    timeout: 15000

# Every lapped activity on the section is listed oldest first, so the recent
# lapped run sits below a hundred others.
- scrollUntilVisible:
    element:
      id: "section-lap-exclude-demo-test-8-.*"
    direction: DOWN
    speed: 90
    timeout: 180000

- tapOn:
    id: "section-lap-exclude-demo-test-8-.*"
    index: 0

- extendedWaitUntil:
    visible:
      id: "section-lap-undo-demo-test-8-.*"
    timeout: 10000

- takeScreenshot: "screenshots/section-lap-excluded"

- runFlow:
    file: helpers/go-back.yaml

- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "section-partly-excluded"
    direction: UP
    timeout: 20000

- scrollUntilVisible:
    element:
      id: "section-open-laps"
    direction: DOWN
    timeout: 20000

- tapOn:
    id: "section-open-laps"

- extendedWaitUntil:
    visible:
      id: "section-lap-list"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "section-lap-undo-demo-test-8-.*"
    direction: DOWN
    speed: 90
    timeout: 180000

- tapOn:
    id: "section-lap-undo-demo-test-8-.*"
    index: 0

- extendedWaitUntil:
    notVisible:
      id: "section-lap-undo-demo-test-8-.*"
    timeout: 10000

- runFlow:
    file: helpers/go-back.yaml

- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 10000

# The kept state sits at the foot of the summary, above the links.
- scrollUntilVisible:
    element:
      id: "section-summary"
    direction: UP
    timeout: 20000

- assertNotVisible:
    id: "section-partly-excluded"

- takeScreenshot: "screenshots/section-exclude-lap"
