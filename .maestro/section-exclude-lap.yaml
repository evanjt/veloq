# Section lap exclusion
# Tests: the demo run that laps a shared loop three times lists its laps on the
# section's lap screen, one lap can be excluded, the section screen then says
# it is partly excluded, and undoing the exclusion clears that again.

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-routes-long
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# The lapped run crosses every section on its loop once per lap, so its first
# section has laps to list whichever one the engine ranks first.
- openLink: "veloq://activity/demo-test-8?tab=sections"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000

- tapOn:
    id: "tab-sections"
    optional: true

# The engine cuts the demo catalogue after the seed lands.
- extendedWaitUntil:
    visible:
      id: "section-inline-plot-0"
    timeout: 90000

- tapOn:
    id: "section-inline-plot-0"

- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 10000

- runFlow:
    file: helpers/sheet-scroll-to.yaml
    env:
      TARGET: "section-open-laps"
      DIRECTION: DOWN

- assertNotVisible:
    id: "section-partly-excluded"

- tapOn:
    id: "section-open-laps"

- extendedWaitUntil:
    visible:
      id: "section-lap-list"
    timeout: 15000

# The laps open as a card over the section's in the same sheet. Every lapped
# activity on the section is listed oldest first, so the recent lapped run sits
# below a hundred others.
- runFlow:
    file: helpers/sheet-scroll-to.yaml
    env:
      TARGET: "section-lap-exclude-demo-test-8-.*"
      DIRECTION: DOWN

- tapOn:
    id: "section-lap-exclude-demo-test-8-.*"
    index: 0

- extendedWaitUntil:
    visible:
      id: "section-lap-undo-demo-test-8-.*"
    timeout: 10000

- takeScreenshot: "screenshots/section-lap-excluded"

- runFlow:
    file: helpers/go-back.yaml

- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 10000

- runFlow:
    file: helpers/sheet-scroll-to.yaml
    env:
      TARGET: "section-partly-excluded"
      DIRECTION: UP

- runFlow:
    file: helpers/sheet-scroll-to.yaml
    env:
      TARGET: "section-open-laps"
      DIRECTION: DOWN

- tapOn:
    id: "section-open-laps"

- extendedWaitUntil:
    visible:
      id: "section-lap-list"
    timeout: 15000

- runFlow:
    file: helpers/sheet-scroll-to.yaml
    env:
      TARGET: "section-lap-undo-demo-test-8-.*"
      DIRECTION: DOWN

- tapOn:
    id: "section-lap-undo-demo-test-8-.*"
    index: 0

- extendedWaitUntil:
    notVisible:
      id: "section-lap-undo-demo-test-8-.*"
    timeout: 10000

- runFlow:
    file: helpers/go-back.yaml

- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 10000

# The kept state sits at the foot of the summary, above the links.
- runFlow:
    file: helpers/sheet-scroll-to.yaml
    env:
      TARGET: "section-summary"
      DIRECTION: UP

- assertNotVisible:
    id: "section-partly-excluded"

- takeScreenshot: "screenshots/section-exclude-lap"
