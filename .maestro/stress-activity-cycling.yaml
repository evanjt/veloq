# Stress Test: Activity Cycling
# Rapidly cycles through different demo activities to test loading and rendering

appId: com.veloq.app.dev
tags:
  - tier3
  - pack-stress
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Cycle through demo activities rapidly
- repeat:
    times: 3
    commands:
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-0"
            TARGET: "activity-detail-screen"
      - extendedWaitUntil:
          visible:
            id: "activity-detail-screen"
          timeout: 5000
          optional: true

      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-1"
            TARGET: "activity-detail-screen"
      - extendedWaitUntil:
          visible:
            id: "activity-detail-screen"
          timeout: 5000
          optional: true

      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-2"
            TARGET: "activity-detail-screen"
      - extendedWaitUntil:
          visible:
            id: "activity-detail-screen"
          timeout: 5000
          optional: true

      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-3"
            TARGET: "activity-detail-screen"
      - extendedWaitUntil:
          visible:
            id: "activity-detail-screen"
          timeout: 5000
          optional: true

      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-4"
            TARGET: "activity-detail-screen"
      - extendedWaitUntil:
          visible:
            id: "activity-detail-screen"
          timeout: 5000
          optional: true

# Very rapid switching (no waiting)
- repeat:
    times: 5
    commands:
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-0"
            TARGET: "activity-detail-screen"
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-1"
            TARGET: "activity-detail-screen"
      - runFlow:
          file: helpers/open-link.yaml
          env:
            LINK: "veloq://activity/demo-test-2"
            TARGET: "activity-detail-screen"

# Return to home and verify app is still responsive
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://"
      TARGET: "home-screen"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- assertVisible:
    id: "home-activity-list"

- takeScreenshot: "screenshots/stress-activity-cycling-complete"
