# Settings Units Toggle Test
# Tests: switching between metric and imperial units

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-settings
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Navigate directly to display settings page
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://display-settings"
      TARGET: "display-settings-screen"

# Find and tap the unit toggle
- scrollUntilVisible:
    element:
      id: "settings-unit-toggle"
    direction: DOWN
    timeout: 10000
    speed: 40
    optional: true

- tapOn:
    id: "settings-unit-toggle"
    optional: true

- takeScreenshot: "screenshots/settings-units-toggled"

# Navigate to home to verify units applied
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://"
      TARGET: "home-screen"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "screenshots/settings-units-applied"

# Return to display settings and toggle back
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://display-settings"
      TARGET: "display-settings-screen"

- scrollUntilVisible:
    element:
      id: "settings-unit-toggle"
    direction: DOWN
    timeout: 10000
    speed: 40
    optional: true

- tapOn:
    id: "settings-unit-toggle"
    optional: true

- takeScreenshot: "screenshots/settings-units-toggle-complete"
