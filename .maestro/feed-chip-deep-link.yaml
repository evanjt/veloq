# Feed Card Chip Deep Links
# US-F3: section chip tap opens Sections tab
# US-F4: route chip tap opens Routes tab
# Verifies the `?tab=sections` / `?tab=routes` search-param routing on the
# activity detail screen.

appId: ${APP_ID}
tags:
  - tier1
  - pack-home
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 15000

# Section chip path, deep-linked to verify the routing contract directly.
# Visual-chip tap is a separate test; here we prove the query param is honored.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/demo-test-0?tab=sections"
      TARGET: "activity-detail-screen"

- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: "activity-sections-list"
    timeout: 10000
    optional: true

- takeScreenshot: "screenshots/feed-chip-deep-link-sections-tab"

# Navigate back via deep-link (Maestro's `back` command is unreliable on iOS)
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://"
      TARGET: "home-screen"

- extendedWaitUntil:
    visible:
      id: "home-activity-list"
    timeout: 10000

# Route chip path
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/demo-test-0?tab=routes"
      TARGET: "activity-detail-screen"

- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000

- takeScreenshot: "screenshots/feed-chip-deep-link-routes-tab"
