# API Key Validation Test
# Tests that invalid API keys show an error

appId: com.veloq.app.dev
tags:
  - tier1
  - pack-auth
---
- launchApp

# Demo mode does not survive a relaunch, so after one the app is on the login
# screen whatever an earlier flow left behind. A home screen here can only be a
# real account, and this flow stops rather than sign it out: the wait is
# required, and the flow fails against a real session with its credential
# untouched.
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 30000

# Now on login screen, expand API key section
- tapOn:
    id: "login-apikey-section"

- extendedWaitUntil:
    visible:
      id: "login-apikey-input"
    timeout: 5000

# Enter invalid API key
- tapOn:
    id: "login-apikey-input"
- inputText: "invalid-test-key"

# Dismiss keyboard, then scroll the connect button into view before tapping
# (with the keyboard up it sits below the fold on the login card).
# iOS: hideKeyboard is unreliable on the simulator (Maestro's own error text
# says to tap a non-interactive element instead), so tap the screen title.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Connect to Intervals.icu"
          optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: "login-apikey-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "login-apikey-button"

# Wait for error to appear (network-dependent: real API call to intervals.icu)
- extendedWaitUntil:
    visible:
      id: "login-error-text"
    timeout: 25000
    optional: true

- takeScreenshot: "screenshots/auth-api-key-error"

# Re-enter demo mode so other tests can run
- tapOn:
    id: "login-demo-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
