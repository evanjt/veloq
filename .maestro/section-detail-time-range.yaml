# Section Detail. Time Range Menu
# US-D1: the time range is one menu control in the chart header
# US-D2: traversal count + chart data reflect the selected range
#
# The Forward/Reverse counts shown per range are the strongest proof that
# the range filter is actually filtering data. The top section in the list
# has the most traversals; narrowing to 1M reduces the count meaningfully.
# We open it by list index for stability across demo data changes.

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Deep-link directly to sections tab (tapOn: text: "Sections" is unreliable
# on iOS where the Material Top Tab text isn't individually accessible)
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://insights?tab=sections"
      TARGET: "routes-screen"

- extendedWaitUntil:
    visible:
      id: "routes-screen"
    timeout: 15000

# Tap the first section in the list, the highest-visit section floats to
# the top by default sort, giving a meaningful delta between 1M and All.
# If no sections have been detected yet, the list won't appear.
- extendedWaitUntil:
    visible:
      id: "sections-list"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "sections-list"
    commands:
      - takeScreenshot: "screenshots/section-detail-no-sections"
- runFlow:
    when:
      visible:
        id: "sections-list"
    commands:
      - tapOn:
          id: "section-row-.*"

# Remaining assertions only run if we navigated to the section detail
- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 15000
    optional: true

- runFlow:
    when:
      visible:
        id: "section-detail-screen"
    commands:
      - takeScreenshot: "screenshots/section-detail-default-range"
      - assertVisible:
          id: "section-time-range"
      - tapOn:
          id: "section-time-range"
      # The menu's own testID never reaches the Android hierarchy, so a row is
      # found by its label alone.
      - tapOn:
          text: "1 month"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-detail-1M"
      - tapOn:
          id: "section-time-range"
      - tapOn:
          text: "3 months"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-detail-3M"
      - tapOn:
          id: "section-time-range"
      - tapOn:
          text: "6 months"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-detail-6M"
      - tapOn:
          id: "section-time-range"
      - tapOn:
          text: "1 year"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-detail-1Y"
      - tapOn:
          id: "section-time-range"
      - tapOn:
          text: "All"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-detail-all"
      - assertNotVisible:
          text: "NaN"
      - assertNotVisible:
          text: "undefined"
      - scroll
      - takeScreenshot: "screenshots/section-detail-summary-history"
      - assertNotVisible:
          text: "NaN"
      # The sheet hands a drag to its content: at the highest stop, a body scrolled to its bottom
      # scrolls back to its top, rather than each drag down moving the sheet down to its lowest
      # stop, where the numbers under the name are out of sight.
      - swipe:
          start: 50%, 60%
          end: 50%, 5%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 2000
      - scrollUntilVisible:
          element:
            id: "section-export-gpx"
          direction: DOWN
          timeout: 20000
      - takeScreenshot: "screenshots/section-detail-scrolled-to-end"
      - scrollUntilVisible:
          element:
            id: "section-detail-stats"
          direction: UP
          timeout: 20000
      - assertVisible:
          id: "section-card-peek"
      - assertNotVisible:
          id: "section-export-gpx"
      - takeScreenshot: "screenshots/section-detail-scrolled-back"
