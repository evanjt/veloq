# Section Detail. Time Range Menu
# US-D1: the time range is one menu control in the chart header
# US-D2: traversal count + chart data reflect the selected range
#
# The Forward/Reverse counts shown per range are the strongest proof that
# the range filter is actually filtering data. The top section in the list
# has the most traversals; narrowing to 1M reduces the count meaningfully.
# We open it by list index for stability across demo data changes.

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Deep-link directly to sections tab (tapOn: text: "Sections" is unreliable
# on iOS where the Material Top Tab text isn't individually accessible)
- openLink: "veloq://insights?tab=sections"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

- extendedWaitUntil:
    visible:
      id: "routes-screen"
    timeout: 15000

# Tap the first section in the list, the highest-visit section floats to
# the top by default sort, giving a meaningful delta between 1M and All.
# If no sections have been detected yet, the list won't appear.
- extendedWaitUntil:
    visible:
      id: "sections-list"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "sections-list"
    commands:
      - takeScreenshot: "screenshots/section-detail-no-sections"
- runFlow:
    when:
      visible:
        id: "sections-list"
    commands:
      - tapOn:
          id: "section-row-.*"

# Remaining assertions only run if we navigated to the section detail
- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 15000
    optional: true

- runFlow:
    when:
      visible:
        id: "section-detail-screen"
    commands:
      - takeScreenshot: "screenshots/section-detail-default-range"
      - assertVisible:
          id: "section-time-range"
      - tapOn:
          id: "section-time-range"
      - tapOn:
          text: "1 month"
          childOf:
            id: "context-menu"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-detail-1M"
      - tapOn:
          id: "section-time-range"
      - tapOn:
          text: "3 months"
          childOf:
            id: "context-menu"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-detail-3M"
      - tapOn:
          id: "section-time-range"
      - tapOn:
          text: "6 months"
          childOf:
            id: "context-menu"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-detail-6M"
      - tapOn:
          id: "section-time-range"
      - tapOn:
          text: "1 year"
          childOf:
            id: "context-menu"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-detail-1Y"
      - tapOn:
          id: "section-time-range"
      - tapOn:
          text: "All"
          childOf:
            id: "context-menu"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "screenshots/section-detail-all"
      - assertNotVisible:
          text: "NaN"
      - assertNotVisible:
          text: "undefined"
      - scroll
      - takeScreenshot: "screenshots/section-detail-summary-history"
      - assertNotVisible:
          text: "NaN"
