# Section history
# Tests: a section's ledger opens from its screen, and a stored version can
# be shown on the map.

appId: com.veloq.app.dev
tags:
  - tier1
  - pack-routes
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-routes.yaml

- extendedWaitUntil:
    visible:
      id: "routes-screen"
    timeout: 10000

- tapOn:
    text: "Sections"

# The engine cuts the demo catalogue after the seed lands, and the catalogue
# is cut from scratch on every cold launch. That is ~69 s on a workstation
# emulator against the 306-activity demo library, and the gate runner is about
# 2.5x slower on this suite, so 90 s missed it by roughly a minute on every
# push. The budget is the runner's, not the workstation's.
- extendedWaitUntil:
    visible:
      id: "section-row-.*"
    timeout: 300000

- tapOn:
    id: "section-row-.*"

- extendedWaitUntil:
    visible:
      id: "section-detail-screen"
    timeout: 10000

# The ledger has its own screen, opened from the button below the year list.
# The year list is long, and scrollUntilVisible either times out on it or
# overshoots into the tab bar and leaves the screen. Walk down in fixed swipes
# that stay clear of the bar.
- repeat:
    times: 30
    commands:
      - runFlow:
          when:
            notVisible:
              id: "section-open-history"
          commands:
            - swipe:
                start: 50%, 70%
                end: 50%, 25%
                duration: 250

- tapOn:
    id: "section-open-history"

- extendedWaitUntil:
    visible:
      id: "section-history-panel"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "section-history-event-formed"
    direction: DOWN
    timeout: 30000

# A second stored version exists only after a re-cut or an edit, so the
# overlay step runs when one is listed.
- runFlow:
    when:
      visible:
        id: "section-version-1-show"
    commands:
      - tapOn:
          id: "section-version-1-show"
      - takeScreenshot: "screenshots/section-history-version-overlay"

- takeScreenshot: "screenshots/section-history"
