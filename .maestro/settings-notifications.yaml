# Settings Notifications Test
# Tests: notification toggle disabled in demo mode, OAuth gate display

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-settings
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Navigate directly to notification settings page
- openLink: "veloq://notification-settings"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

- extendedWaitUntil:
    visible:
      id: "settings-notifications-toggle"
    timeout: 10000

# A demo session is not an OAuth one, so notifications cannot be turned on: the
# switch is there and disabled, and the hint under it says why.
- assertVisible:
    id: "settings-notifications-toggle"
    enabled: false

- assertVisible:
    id: "settings-notifications-oauth-hint"

- takeScreenshot: "screenshots/settings-notifications"
