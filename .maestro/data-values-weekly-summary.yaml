# Weekly Summary Data Validation
# Verifies weekly summary shows real values, not NaN/blank

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-data
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

- runFlow:
    file: helpers/navigate-to-fitness.yaml

# The week, the calendar and the year comparison are on the calendar page.
- tapOn:
    id: "tab-calendar"

# Bring the weekly summary into view, then its range buttons clear of the tab bar
- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "weekly-summary"
- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "weekly-summary-range-year"

# Switch to year range where demo data is guaranteed to exist
- tapOn:
    id: "weekly-summary-range-year"

- waitForAnimationToEnd:
    timeout: 3000

# Re-reveal the weekly summary (range change may re-render and shift layout)
- runFlow:
    file: helpers/reveal.yaml
    env:
      ELEMENT: "weekly-summary"

# Verify component rendered (stats or empty state, both are valid)
# Longer timeout for the year range to compute from demo data
- extendedWaitUntil:
    visible:
      id: "weekly-summary-count"
    timeout: 30000
    optional: true

# If empty state rendered instead, that's also valid
- extendedWaitUntil:
    visible:
      id: "weekly-summary-empty"
    timeout: 5000
    optional: true

# Assert no invalid values
- assertNotVisible:
    text: "NaN"
- assertNotVisible:
    text: "undefined"
- takeScreenshot: "screenshots/data-values-weekly-summary-complete"
