# Deep Link Navigation Regression
# Tests all deep links work and don't crash the app

appId: com.veloq.app.dev
tags:
  - tier2
  - pack-nav
---
- runFlow:
    file: helpers/setup-demo-mode.yaml

# Test fitness deep link
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://fitness"
      TARGET: "fitness-screen"
- extendedWaitUntil:
    visible:
      id: "fitness-screen"
    timeout: 10000
- takeScreenshot: "screenshots/navigation-deep-links-fitness"

# A link naming a chart opens fitness on the page and the card that draw it
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://fitness?chart=week"
      TARGET: "fitness-screen"
- extendedWaitUntil:
    visible:
      id: "weekly-summary"
    timeout: 15000
- assertVisible:
    id: "tab-page-calendar"
- takeScreenshot: "screenshots/navigation-deep-links-fitness-week"

# Test map deep link
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://map"
      TARGET: "map-screen"
- extendedWaitUntil:
    visible:
      id: "map-screen"
    timeout: 10000
- takeScreenshot: "screenshots/navigation-deep-links-map"

# Test insights deep link
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://insights"
      TARGET: "routes-screen"
- extendedWaitUntil:
    visible:
      id: "routes-screen"
    timeout: 10000
- takeScreenshot: "screenshots/navigation-deep-links-insights"

# The pre-rename path still lands on the tab, notifications scheduled before
# the rename carry it.
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://routes"
      TARGET: "routes-screen"
- extendedWaitUntil:
    visible:
      id: "routes-screen"
    timeout: 10000
- takeScreenshot: "screenshots/navigation-deep-links-routes-legacy"

# Test settings deep link
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://settings"
      TARGET: "settings-screen"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- takeScreenshot: "screenshots/navigation-deep-links-settings"

# Test activity deep link
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/demo-test-0"
      TARGET: "activity-detail-screen"
- extendedWaitUntil:
    visible:
      id: "activity-detail-screen"
    timeout: 15000
- takeScreenshot: "screenshots/navigation-deep-links-activity"

# Test nonexistent activity deep link (verify no crash)
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://activity/nonexistent-id"
      TARGET: "home-screen"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 5000
    optional: true

# Verify app is still responsive by navigating home
- runFlow:
    file: helpers/open-link.yaml
    env:
      LINK: "veloq://"
      TARGET: "home-screen"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- takeScreenshot: "screenshots/navigation-deep-links-complete"
