# Soak: the routes list and a route's map, opened and left CYCLES times.
appId: ${APP_ID}
tags:
  - soak
---
- runFlow: launch.yaml
- repeat:
    times: ${CYCLES}
    commands:
      - runFlow:
          file: ../helpers/open-link.yaml
          env:
            LINK: "veloq://insights?tab=routes"
            TARGET: "routes-screen"
      - extendedWaitUntil:
          visible:
            id: "routes-list"
          timeout: 30000
      - tapOn:
          id: "route-row-.*-touch"
          index: 0
      - waitForAnimationToEnd:
          timeout: 4000
      - assertNotVisible:
          id: "map-unavailable"
      - runFlow:
          file: ../helpers/open-link.yaml
          env:
            LINK: "veloq://"
            TARGET: "home-screen"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 15000
