# Open the app on the home screen. A session left signed in is kept as found,
# and a signed-out app enters demo mode, which does not survive a relaunch.
appId: com.veloq.app.dev
---
- launchApp:
    stopApp: false
    clearState: false
    permissions:
      all: allow
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "login-screen"
    commands:
      - tapOn:
          id: "login-demo-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
