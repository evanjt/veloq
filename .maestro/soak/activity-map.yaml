# Soak: the activity detail map. Open ACTIVITY, pan and zoom, go back, CYCLES times.
appId: ${APP_ID}
tags:
  - soak
---
- runFlow: launch.yaml
- repeat:
    times: ${CYCLES}
    commands:
      - runFlow:
          file: ../helpers/open-link.yaml
          env:
            LINK: "veloq://activity/${ACTIVITY}"
            TARGET: "activity-detail-screen"
      - extendedWaitUntil:
          visible:
            id: "activity-detail-screen"
          timeout: 30000
      - swipe:
          start: 70%, 25%
          end: 30%, 25%
          duration: 400
      - doubleTapOn:
          point: 50%, 25%
      - swipe:
          start: 30%, 25%
          end: 70%, 25%
          duration: 400
      - assertNotVisible:
          id: "map-unavailable"
      - runFlow: ../helpers/go-back.yaml
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 15000
