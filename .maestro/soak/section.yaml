# Soak: the section popup on the map and its detail, opened and closed CYCLES times.
# Each cycle opens two sections, since the map opens a linked section once and a repeat of
# the id it last opened does nothing.
appId: com.veloq.app.dev
tags:
  - soak
---
- runFlow: launch.yaml
- repeat:
    times: ${CYCLES}
    commands:
      - runFlow:
          file: open-link.yaml
          env:
            LINK: "veloq://map?section=${SECTION}"
      - extendedWaitUntil:
          visible:
            id: "section-popup"
          timeout: 60000
      - tapOn:
          id: "section-popup-view-details"
      - waitForAnimationToEnd:
          timeout: 4000
      - assertNotVisible:
          id: "map-unavailable"
      - runFlow:
          file: open-link.yaml
          env:
            LINK: "veloq://"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 15000
      - runFlow:
          file: open-link.yaml
          env:
            LINK: "veloq://map?section=${SECTION_ALT}"
      - extendedWaitUntil:
          visible:
            id: "section-popup"
          timeout: 60000
      - tapOn:
          id: "section-popup-view-details"
      - waitForAnimationToEnd:
          timeout: 4000
      - assertNotVisible:
          id: "map-unavailable"
      - runFlow:
          file: open-link.yaml
          env:
            LINK: "veloq://"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 15000
