name: Setup Rust for iOS
description: Install the Rust toolchain for iOS targets and restore rust-cache

inputs:
  targets:
    description: 'Comma-separated Rust iOS targets (sim + optionally device)'
    required: false
    default: 'aarch64-apple-ios,aarch64-apple-ios-sim'
  cache-key:
    description: 'Extra cache-key suffix passed to Swatinem/rust-cache'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # rust-toolchain.toml at the repository root decides which compiler cargo runs
    # there, so the targets have to land on that release rather than on stable.
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@1d64bbcee8ef0c191a54710c227fd268a0d5014b # 1.95.0
      with:
        targets: ${{ inputs.targets }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: modules/veloqrs/rust
        key: ${{ inputs.cache-key }}
        # Pull requests read main's cache and write none, so they cannot evict it.
        save-if: ${{ github.ref == 'refs/heads/main' }}
