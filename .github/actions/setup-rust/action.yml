name: Setup Rust
description: Setup Rust toolchain with caching for veloqrs builds

inputs:
  targets:
    description: 'Space-separated list of Rust targets to install'
    required: false
    default: ''
  cache-key:
    description: 'Additional cache key suffix'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # rust-toolchain.toml at the repository root decides which compiler cargo runs
    # there, so the targets have to land on that release rather than on stable.
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@1.95.0
      with:
        targets: ${{ inputs.targets }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: modules/veloqrs/rust
        key: ${{ inputs.cache-key }}
        # Pull requests read main's cache and write none, so they cannot evict it.
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
