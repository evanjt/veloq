name: Setup Rust for Android
description: Install the Rust toolchain for Android targets, restore rust-cache, and install cargo-ndk

inputs:
  targets:
    description: 'Comma-separated Rust Android targets'
    required: false
    default: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android'
  cache-key:
    description: 'Extra cache-key suffix passed to Swatinem/rust-cache'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # rust-toolchain.toml at the repository root decides which compiler cargo runs
    # there, so the targets have to land on that release rather than on stable.
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@1.95.0
      with:
        targets: ${{ inputs.targets }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: modules/veloqrs/rust
        key: ${{ inputs.cache-key }}
        # Pull requests read main's cache and write none, so they cannot evict it.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install cargo-ndk
      shell: bash
      run: |
        # Pinned, because the install compiles with the pinned toolchain and a
        # newer cargo-ndk can demand a newer compiler than that.
        if ! command -v cargo-ndk &> /dev/null; then
          cargo install cargo-ndk --locked --version 4.1.2
        fi
