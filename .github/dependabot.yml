# Monthly, three open at most per ecosystem: Dependabot sent 372 of 484 pull
# request runs, and each one pays the full build.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      # Their own PRs: jest-expo and @react-native/* follow the Expo SDK, and a
      # bump inside the general group failed it for reasons unrelated to the rest.
      jest-expo:
        patterns: ["jest-expo"]
        update-types: ["minor", "patch"]
      react-native-tooling:
        patterns: ["@react-native/*"]
        update-types: ["minor", "patch"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Expo SDK pins these as a set. Group-bumping them individually breaks the
      # build (react/react-test-renderer must match exactly; react-native bumps
      # break SDK-pinned native libraries). Move them together with
      # `npx expo install --fix` at SDK upgrades instead.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "react-native"
      - dependency-name: "@types/react"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "@shopify/react-native-skia"

  - package-ecosystem: "npm"
    directory: "/oauth-proxy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      oauth-proxy-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/modules/veloqrs"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      veloqrs-npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/modules/veloqrs/rust"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # uniffi metadata format must match the pinned uniffi-bindgen-react-native
      # (1.93.0). A lone crate bump fails Verify Bindings; bump both together
      # with a bindings regen instead.
      - dependency-name: "uniffi"

  - package-ecosystem: "bundler"
    directory: "/config/fastlane"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      bundler-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      gha-all:
        patterns: ["*"]
    ignore:
      # The toolchain is pinned in rust-toolchain.toml, and a Jest test holds each
      # dtolnay/rust-toolchain step to it. Bump them together with a fresh
      # cargo fmt and bindings regeneration, not through a dependabot tag.
      - dependency-name: "dtolnay/rust-toolchain"
