# Monthly, three open at most per ecosystem: Dependabot sent 372 of 484 pull
# request runs, and each one pays the full build.
#
# Patch updates share one group per ecosystem, which the auto-merge workflow
# merges once it passes. Minors and majors open one pull request each and are
# never auto-merged: a group reports one member's update type, and one bad
# member holds back every other update in it.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      # jest-expo follows the Expo SDK and gets its own PR.
      jest-expo:
        patterns: ["jest-expo"]
        update-types: ["minor", "patch"]
      npm-patch:
        update-types: ["patch"]
    ignore:
      # Expo SDK and native peers pin these as a set. Group-bumping them breaks the
      # build (react/react-test-renderer must match exactly; react-native bumps
      # break SDK-pinned native libraries). Move them together with
      # `npx expo install --fix` at SDK upgrades instead.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "react-native"
      - dependency-name: "@types/react"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: "@react-native/*"
      - dependency-name: "react-native-svg"
      - dependency-name: "@react-native-community/slider"
      - dependency-name: "react-native-webview"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "react-native-nitro-modules"
      # react-native-iap peers on a nitro range, and legacy-peer-deps lets a lone
      # iap bump install past it. Move the two together.
      - dependency-name: "react-native-iap"
      # typescript-eslint peers typescript below 6.1, so a major fails lint.
      # Move it once typescript-eslint accepts the new major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # jest-expo depends on the Jest 29 packages, so a lone Jest major runs two
      # Jest versions side by side. Move both once jest-expo does.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # 14 renders through the separate test-renderer package rather than
      # react-test-renderer, so it is a migration of every component test, not
      # a version bump.
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/oauth-proxy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      oauth-proxy-patch:
        update-types: ["patch"]

  - package-ecosystem: "cargo"
    directory: "/modules/veloqrs/rust"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      cargo-patch:
        update-types: ["patch"]
    ignore:
      # uniffi metadata format must match uniffi-bindgen-react-native, whose
      # 0.31.x releases pin uniffi =0.31. A lone crate bump fails Verify
      # Bindings; bump both together with a bindings regen instead.
      - dependency-name: "uniffi"
      # jni 0.22 reworks the env type and the thread attach API, which the
      # basemap tile bridge and the push entries are written against. Host CI
      # never compiles the Android cfg, so a lone bump is only seen by the
      # Android build. Port both together with an NDK check instead.
      - dependency-name: "jni"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # 0.13 drops the `rustls-tls` feature, and every rustls path there pulls
      # rustls-platform-verifier, which on Android needs a Kotlin component, a
      # Proguard rule and a JNI init before the first request. Take it together
      # with the jni 0.22 move and that wiring, never through a Dependabot PR.
      # scripts/lint-tls-verifier-hold.mjs holds this ignore in place.
      - dependency-name: "reqwest"
        update-types: ["version-update:semver-minor"]
      # tracematch's geometry crates move detector output, so a bump needs a
      # bitwise before-and-after report signed off before it lands.
      - dependency-name: "geo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rstar"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "bundler"
    directory: "/config/fastlane"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      bundler-patch:
        update-types: ["patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      gha-patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      # The toolchain is pinned in rust-toolchain.toml, and a Jest test holds each
      # dtolnay/rust-toolchain step to it. Bump them together with a fresh
      # cargo fmt and bindings regeneration, not through a dependabot tag.
      - dependency-name: "dtolnay/rust-toolchain"
