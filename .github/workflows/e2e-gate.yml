name: E2E Gate

# E2E gate: runs the tier0+tier1 critical-path flows (the same set as
# `npm run maestro:gate`) after every push to main, which is where work lands:
# it arrives by local merge, and pull requests are almost all Dependabot, whose
# gate runs failed for reasons outside the diff. Heavier tiers run in the daily
# scheduled sweep in e2e.yml, which can also be dispatched by hand. The pack-map
# flows run here too, but only when a push changes a map surface: a screen, the
# tile store in the engine or the Android tile interceptor. They run on an iOS
# simulator as well when a push changes a map surface, the lockfile or a native
# module, since a dependency bump that breaks the iOS map changes nothing else.
#
# build.yml calls this workflow once its production builds finish, and the
# flows run on those apps, the ones that ship. Nothing here builds: a push
# builds each platform once. The flows take their app id from APP_ID, which
# this workflow sets to the production identity. Queued, not cancelled: build.yml
# lets a running push finish, and GitHub keeps one pending run per group, so a
# burst of pushes tests the first and the last.

on:
  workflow_call:
    inputs:
      android-artifact:
        description: "Name of the production APK artifact build-android.yml uploaded"
        required: true
        type: string
      ios-artifact:
        description: "Name of the production simulator app artifact build-ios.yml uploaded, empty when the iOS build did not finish"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  checks: write

env:
  # The production identity (scripts/lib/app-identity.js), which every Maestro
  # run in this workflow drives through `-e APP_ID`.
  APP_ID: com.veloq.app

jobs:
  # The map flows are the slowest and most GPU-sensitive in the suite, so they
  # run only when a push actually touches a map surface.
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      maps: ${{ steps.filter.outputs.maps }}
      ios-maps: ${{ steps.filter.outputs.ios-maps }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            maps: &maps
              - 'src/features/maps/**'
              - 'src/features/**/*Map*'
              - 'src/app/\(tabs\)/map.tsx'
              - 'src/app/map-settings.tsx'
              - 'src/features/routes/lib/tilePass.ts'
              - 'modules/veloqrs/rust/veloqrs/src/basemap/**'
              - 'modules/veloqrs/rust/veloqrs/src/objects/basemap.rs'
              - 'modules/veloqrs/rust/veloqrs/src/objects/tiles.rs'
              - 'modules/veloqrs/rust/veloqrs/src/tiles.rs'
              - 'modules/veloqrs/rust/veloqrs/src/persistence/tiles.rs'
              - 'modules/veloqrs/android/src/main/java/com/veloq/*Tile*'
            ios-maps:
              - *maps
              - 'package-lock.json'
              - 'modules/**'

  gate:
    name: Maestro Gate (tier0+tier1, shard ${{ matrix.shard }})
    strategy:
      # A failed shard must not cancel the others: a cancelled shard leaves no
      # report, and its flows read as never run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Hosted Ubuntu + KVM: the only GitHub-hosted runner that can hardware-
    # accelerate an Android emulator. Hosted macOS is a nested VM with no HVF,
    # so qemu-system-aarch64 fails with HV_UNSUPPORTED and never boots.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.android-artifact }}
          path: /tmp/apk

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        uses: ./.github/actions/install-maestro

      - name: Run gate flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
          # This shard's share of the tier0 and tier1 flows, dealt by run-suite.sh.
          MAESTRO_SHARD: ${{ matrix.shard }}/3
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # Real phone profile (1080x2400). The default AVD skin is 320x640,
          # which pushes below-the-fold controls off-screen and breaks flows.
          profile: pixel_6
          # The profile's own 2 GB is shared with system_server, Play services,
          # the launcher and Maestro's driver app, and under software GL the
          # driver is what gets squeezed out. Losing it reads as a dozen failed
          # flows rather than one dead device.
          ram-size: 6144
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          disable-animations: true
          # The action runs each script line as a separate `sh -c`, so no shell
          # state (vars, `export PATH`) survives between lines and `\` line
          # continuations break. Every line must stand alone.
          script: |
            # A launcher ANR dialog over the app fails every flow behind it as a missing screen
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb install "$(find /tmp/apk -name '*.apk' | head -1)"
            adb logcat -c
            # The whole run, streamed: the crash check reads it after the flows.
            nohup sh -c 'adb logcat -v threadtime > /tmp/logcat.txt 2>&1' &
            .maestro/run-suite.sh gate-report.xml /tmp/maestro-debug --include-tags=tier0,tier1 --exclude-tags=flaky || echo "MAESTRO_FAILED=true" >> "$GITHUB_ENV"
            [ "$MAESTRO_SHARD" != 1/3 ] || "$HOME/.maestro/bin/maestro" test -e "APP_ID=$APP_ID" .maestro/ --include-tags=flaky --debug-output /tmp/maestro-debug-flaky --format junit --output flaky-report.xml --no-ansi || true

      - name: Collect Maestro artifacts
        if: always()
        run: |
          mkdir -p /tmp/maestro-artifacts
          cp -r "$HOME/.maestro/tests" /tmp/maestro-artifacts/tests 2>/dev/null || true
          cp -r /tmp/maestro-debug /tmp/maestro-artifacts/debug 2>/dev/null || true
          cp -r /tmp/maestro-debug-flaky /tmp/maestro-artifacts/debug-flaky 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE"/screenshots/*.png /tmp/maestro-artifacts/ 2>/dev/null || true
          cp -f /tmp/logcat.txt /tmp/maestro-artifacts/ 2>/dev/null || true
          find /tmp/maestro-artifacts -name '*.png' | head -50 || true

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-gate-${{ matrix.shard }}-debug
          path: /tmp/maestro-artifacts
          retention-days: 7
          # Maestro writes under a hidden .maestro/ directory, which
          # upload-artifact skips by default. Without this the debug
          # artefact is empty and every failure screenshot is lost.
          include-hidden-files: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-gate-${{ matrix.shard }}-report
          path: |
            gate-report.xml
            flaky-report.xml
            retry-reports/
          # Ninety days, the most GitHub allows, because these few kilobytes are
          # the flake evidence: promotion out of the flaky lane needs twenty
          # runs and the gate runs about daily. The debug bundle above keeps
          # its week.
          retention-days: 90

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        with:
          report_paths: gate-report.xml
          check_name: E2E Gate Results (shard ${{ matrix.shard }})
          fail_on_failure: false

      # Non-blocking: surfaces the quarantined flaky flows' results as a separate
      # check without gating the PR. Promote a flow back to the core set once it
      # is reliably green here.
      - name: Publish flaky results (non-blocking)
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        with:
          report_paths: flaky-report.xml
          check_name: E2E Gate Flaky (non-blocking)
          fail_on_failure: false

      # The jobs hide system error dialogs so a launcher freeze cannot cover the
      # app, which would hide a freeze of our own too.
      - name: Fail on a freeze of our own app
        if: always()
        run: '! grep -F "ANR in com.veloq" /tmp/logcat.txt'

      - name: Fail on a crash of our own app
        if: always()
        run: node scripts/check-app-crashes.mjs --logcat /tmp/logcat.txt --package com.veloq.app

      # The failed flows, the last screenshot and the app's crash lines, on the
      # run page rather than in the artifact.
      - name: Summarise the failure
        if: always() && env.MAESTRO_FAILED == 'true'
        run: node scripts/maestro-failure-summary.mjs --report gate-report.xml --debug /tmp/maestro-debug --logcat /tmp/logcat.txt

      - name: Fail if tests failed
        if: always() && env.MAESTRO_FAILED == 'true'
        run: exit 1

  # Path-filtered companion to the gate, on the same production APK.
  map-gate:
    name: Maestro Map Suite
    needs: changes
    if: needs.changes.outputs.maps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.android-artifact }}
          path: /tmp/apk

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        uses: ./.github/actions/install-maestro

      - name: Run map flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # The profile's own 2 GB is shared with system_server, Play services,
          # the launcher and Maestro's driver app, and under software GL the
          # driver is what gets squeezed out. Losing it reads as a dozen failed
          # flows rather than one dead device.
          ram-size: 6144
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          disable-animations: true
          # One command per line: the action runs each line as a separate `sh -c`.
          script: |
            # A launcher ANR dialog over the app fails every flow behind it as a missing screen
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb install "$(find /tmp/apk -name '*.apk' | head -1)"
            adb logcat -c
            # The whole run, streamed: the crash check reads it after the flows.
            nohup sh -c 'adb logcat -v threadtime > /tmp/logcat.txt 2>&1' &
            .maestro/run-suite.sh map-report.xml /tmp/maestro-debug-map --include-tags=pack-map --exclude-tags=flaky || echo "MAESTRO_FAILED=true" >> "$GITHUB_ENV"

      - name: Collect Maestro artifacts
        if: always()
        run: |
          mkdir -p /tmp/maestro-map-artifacts
          cp -r "$HOME/.maestro/tests" /tmp/maestro-map-artifacts/tests 2>/dev/null || true
          cp -r /tmp/maestro-debug-map /tmp/maestro-map-artifacts/debug 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE"/screenshots/*.png /tmp/maestro-map-artifacts/ 2>/dev/null || true
          cp -f /tmp/logcat.txt /tmp/maestro-map-artifacts/ 2>/dev/null || true

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-map-debug
          path: /tmp/maestro-map-artifacts
          retention-days: 7
          # Maestro writes under a hidden .maestro/ directory, which
          # upload-artifact skips by default. Without this the debug
          # artefact is empty and every failure screenshot is lost.
          include-hidden-files: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-map-report
          path: |
            map-report.xml
            retry-reports/
          # Ninety days, the most GitHub allows, because these few kilobytes are
          # the flake evidence: promotion out of the flaky lane needs twenty
          # runs and the gate runs about daily. The debug bundle above keeps
          # its week.
          retention-days: 90

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        with:
          report_paths: map-report.xml
          check_name: E2E Map Suite Results
          fail_on_failure: false

      # The jobs hide system error dialogs so a launcher freeze cannot cover the
      # app, which would hide a freeze of our own too.
      - name: Fail on a freeze of our own app
        if: always()
        run: '! grep -F "ANR in com.veloq" /tmp/logcat.txt'

      - name: Fail on a crash of our own app
        if: always()
        run: node scripts/check-app-crashes.mjs --logcat /tmp/logcat.txt --package com.veloq.app

      # The failed flows, the last screenshot and the app's crash lines, on the
      # run page rather than in the artifact.
      - name: Summarise the failure
        if: always() && env.MAESTRO_FAILED == 'true'
        run: node scripts/maestro-failure-summary.mjs --report map-report.xml --debug /tmp/maestro-debug-map --logcat /tmp/logcat.txt

      - name: Fail if tests failed
        if: always() && env.MAESTRO_FAILED == 'true'
        run: exit 1

  # The map suite on an iOS simulator. The map renders in a WebView fed by the
  # engine's tile handler on iOS, and nothing else runs a map flow there before
  # the daily sweep.
  ios-map-gate:
    name: Maestro Map Suite (iOS)
    needs: changes
    if: needs.changes.outputs.ios-maps == 'true'
    runs-on: macos-26
    # Fourteen flows at the measured two minutes each, setup and a retry pass.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Maestro
        uses: ./.github/actions/install-maestro

      - name: Boot simulator with the production app
        uses: ./.github/actions/boot-ios-simulator
        with:
          artifact: ${{ inputs.ios-artifact }}

      - name: Run map flows on the simulator
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        run: |
          .maestro/run-suite.sh ios-map-report.xml /tmp/maestro-debug-ios-map --include-tags=pack-map --exclude-tags=flaky || echo "MAESTRO_FAILED=true" >> "$GITHUB_ENV"

      - name: Collect Maestro artifacts
        if: always()
        run: |
          mkdir -p /tmp/maestro-ios-map-artifacts
          cp -r "$HOME/.maestro/tests" /tmp/maestro-ios-map-artifacts/tests 2>/dev/null || true
          cp -r /tmp/maestro-debug-ios-map /tmp/maestro-ios-map-artifacts/debug 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE"/screenshots/*.png /tmp/maestro-ios-map-artifacts/ 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -name "Veloq*" -exec cp {} /tmp/maestro-ios-map-artifacts/ \; 2>/dev/null || true

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-ios-map-debug
          path: /tmp/maestro-ios-map-artifacts
          retention-days: 7
          # Maestro writes under a hidden .maestro/ directory, which
          # upload-artifact skips by default.
          include-hidden-files: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-ios-map-report
          path: |
            ios-map-report.xml
            retry-reports/
          # The flake evidence, kept as long as the gate's own.
          retention-days: 90

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        with:
          report_paths: ios-map-report.xml
          check_name: E2E Map Suite Results (iOS)
          fail_on_failure: false

      - name: Fail on a crash of our own app
        if: always()
        run: node scripts/check-app-crashes.mjs --ios-reports "$HOME/Library/Logs/DiagnosticReports" --process Veloq

      # The failed flows, the last screenshot and the app's crash lines, on the
      # run page rather than in the artifact.
      - name: Summarise the failure
        if: always() && env.MAESTRO_FAILED == 'true'
        run: node scripts/maestro-failure-summary.mjs --report ios-map-report.xml --debug /tmp/maestro-debug-ios-map

      - name: Fail if tests failed
        if: always() && env.MAESTRO_FAILED == 'true'
        run: exit 1

  # The one result to read. The map suite is path-filtered, and a skipped job
  # reports neutral, which GitHub renders as a passing check, so a run that
  # executed nothing would look identical to one that passed everything.
  gate-required:
    name: E2E Gate Required
    needs: [changes, gate, map-gate, ios-map-gate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check gate results
        env:
          CHANGES: ${{ needs.changes.result }}
          GATE: ${{ needs.gate.result }}
          MAP_GATE: ${{ needs.map-gate.result }}
          MAPS_CHANGED: ${{ needs.changes.outputs.maps }}
          IOS_MAP_GATE: ${{ needs.ios-map-gate.result }}
          IOS_MAPS_CHANGED: ${{ needs.changes.outputs.ios-maps }}
        run: |
          echo "changes=$CHANGES gate=$GATE map-gate=$MAP_GATE (maps changed: $MAPS_CHANGED)"
          echo "ios-map-gate=$IOS_MAP_GATE (iOS maps changed: $IOS_MAPS_CHANGED)"
          failed=0
          for result in "$CHANGES" "$GATE"; do
            [ "$result" = success ] || failed=1
          done
          # A path-filtered job may be skipped only when its filter says
          # nothing it covers changed.
          filtered() {
            changed="$1"
            shift
            for result in "$@"; do
              if [ "$changed" = true ]; then
                [ "$result" = success ] || failed=1
              elif [ "$result" != skipped ]; then
                [ "$result" = success ] || failed=1
              fi
            done
          }
          filtered "$MAPS_CHANGED" "$MAP_GATE"
          filtered "$IOS_MAPS_CHANGED" "$IOS_MAP_GATE"
          if [ "$failed" = 1 ]; then
            echo "::error::E2E gate did not pass. A skipped build or suite fails here rather than reporting green."
            exit 1
          fi
