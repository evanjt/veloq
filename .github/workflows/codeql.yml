name: CodeQL

# Code scanning for every language in the repository. Each analysis takes the
# category `/language:<lang>`, the one default setup reports under, so this
# workflow replaces those configurations rather than adding beside them.
# Kotlin is extracted only from a compile CodeQL traces, so java-kotlin builds:
# scripts/codeql-android-compile.sh compiles every library untraced first and
# then reruns only our own projects' compile tasks under the tracer. Nothing is
# packaged and no Rust is built. That compile is a native build of its own, so
# it runs on the weekly schedule and by dispatch only, never on a push to main
# or a pull request, which already build the app, and its Gradle cache is read
# only. What no analysis can scan is excluded in .github/codeql/codeql-config.yml.
# The weekly run scans an unchanged sha again with the query packs as they stand
# that week.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to main runs to the end, so its analysis is never left half-uploaded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: c-cpp
          - language: javascript-typescript
          - language: python
          - language: ruby
          - language: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyse
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  scan-java-kotlin:
    name: Scan java-kotlin
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    env:
      # The identity Expo configuration resolves to, read again by Gradle.
      APP_VARIANT: production
      JAVA_TOOL_OPTIONS: "-Dhttp.agent=Gradle -Dhttps.agent=Gradle"
      GRADLE_OPTS: "-Dhttp.agent=Gradle -Dhttps.agent=Gradle"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Write google-services.json
        uses: ./.github/actions/write-google-services-stub
        with:
          package-name: com.veloq.app
          allow-stub: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      # Reads the Gradle home the production build on main wrote and writes none.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: true
          cache-cleanup: on-success
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      # Generates android/ for the compile below, and nothing is packaged from it.
      - name: Generate Android native project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Install Gradle init script
        run: |
          mkdir -p ~/.gradle
          cp .github/ci-init.gradle ~/.gradle/init.gradle

      # Before the tracer starts, so every autolinked library is compiled and up
      # to date, and none of it is extracted.
      - name: Compile every library untraced
        run: scripts/codeql-android-compile.sh prepare

      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Compile our Kotlin and Java traced
        run: scripts/codeql-android-compile.sh trace

      - name: Analyse
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:java-kotlin
