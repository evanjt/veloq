name: Jest Coverage

# Weekly, not per push: instrumenting every file cost the per-push Jest run
# 46%, and the thresholds in config/jest.config.js move slowly enough that a
# week is soon enough to hear one has slipped. A dispatch runs it by hand.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          JEST_WORKERS: 2
