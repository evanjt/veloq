name: Build

on:
  push:
    branches: [main]
    # A release tag builds the store artifacts that release.yml publishes.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type override'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - preview
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only branch and PR re-runs auto-cancel; main and release tags run to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  # Whether this run builds natively. A pull request that reaches neither
  # native code nor the engine crate skips the Gradle and Xcode builds and runs
  # the bundle check below instead. push, dispatch and a Dependabot major
  # always build.
  # scripts/ci-required.mjs decides it from scripts/ci-areas.mjs, and Build
  # Required reads every build against the same answer.
  changes:
    name: Detect Native Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # fetch-metadata lists the pull request's commits.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.plan.outputs.native }}
    env:
      EVENT: ${{ github.event_name }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      # Two commits: a pull request checks out its merge commit, and the first
      # parent is the base the change is read against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A Dependabot major builds natively. The update type is read here, and a
      # read that fails leaves it empty, which ci-required.mjs counts as a major.
      - name: Fetch Dependabot metadata
        id: meta
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A lockfile bump is native only when the package ships native code,
      # which is read from the installed tree.
      - name: Install dependencies
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/npm-ci

      - name: Plan the builds
        id: plan
        run: node scripts/ci-required.mjs build-plan
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}

  # ============================================
  # Build Android
  # ============================================
  # On pull requests that reach native code too: the E2E gate runs after a push
  # to main, so this is the one build such a bump meets before it merges. A
  # failed plan leaves `native` empty, which builds.
  build-android:
    name: Build Android
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    uses: ./.github/workflows/build-android.yml
    with:
      variant: production
      release: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
      allow-stub: ${{ github.event_name == 'pull_request' }}
      build-type: ${{ inputs.build_type || 'auto' }}
    secrets: inherit

  # ============================================
  # Build iOS
  # ============================================
  build-ios:
    name: Build iOS
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    uses: ./.github/workflows/build-ios.yml
    with:
      variant: production
      release: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
      # Every build but a pull request's checks the App Store profiles.
      check-signing: ${{ github.event_name != 'pull_request' }}
      build-type: ${{ inputs.build_type || 'auto' }}
    secrets: inherit

  # ============================================
  # Bundle check, for a change that builds nothing native
  # ============================================
  # The Metro and Hermes bundle of the Android entry the release build embeds,
  # so a JavaScript change that breaks the import graph or the bytecode compile
  # still fails. Measured on 2026-10-17 on a loaded 60 GB workstation with a
  # cold Metro cache: 21 s twice, npm ci not counted.
  bundle-check:
    name: Bundle Check
    needs: changes
    if: needs.changes.outputs.native == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Bundle the Android entry
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/bundle"

  # ============================================
  # E2E Smoke, quick post-build sanity check
  # ============================================
  e2e-smoke:
    name: E2E Smoke
    needs: build-android
    if: github.event_name != 'pull_request'
    # Every push to main is smoke tested to the end. A smoke cancelled for a
    # newer push read as red in Build Required on a sha that was not broken.
    # Hosted Ubuntu with KVM, as in e2e-gate.yml. Hosted macOS has no HVF for the
    # emulator, and a self-hosted runner shares adb with whatever else is attached.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-android.outputs.apk-artifact }}
          path: /tmp/apk

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        uses: ./.github/actions/install-maestro

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 6144
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          disable-animations: true
          # Each line runs as its own `sh -c`, so every line must stand alone.
          script: |
            # A launcher ANR dialog over the app fails the flow as a missing screen
            adb shell settings put global hide_error_dialogs 1
            adb logcat -c
            adb install "$(find /tmp/apk -name '*.apk' | head -1)"
            adb shell pm list packages | grep veloq
            "$HOME/.maestro/bin/maestro" test .maestro/smoke-build.yaml --no-ansi --format junit --output smoke-report.xml; code=$?; adb logcat -d -v time > smoke-logcat.txt; exit $code

      - name: Fail on a freeze of our own app
        if: always()
        run: '! grep -F "ANR in com.veloq" smoke-logcat.txt'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-smoke-screenshots
          # The flow's own captures land in screenshots/ under the workspace.
          path: |
            screenshots/
            ~/.maestro/tests/*/screenshots/
          retention-days: 7
          include-hidden-files: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-smoke-report
          path: |
            smoke-report.xml
            smoke-logcat.txt
          retention-days: 7

  # The one job branch protection requires from this workflow.
  # scripts/ci-required.mjs judges it: both builds are required when the change
  # reaches native code and the bundle check when it does not, and E2E Smoke
  # is skipped on a pull request, where it never runs.
  build-required:
    name: Build Required
    needs: [changes, build-android, build-ios, bundle-check, e2e-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A Dependabot pull request's red jobs are read against main's latest
    # finished Build run, which needs the run history.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Check results
        env:
          EVENT: ${{ github.event_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          ANDROID: ${{ needs.build-android.result }}
          IOS: ${{ needs.build-ios.result }}
          BUNDLE: ${{ needs.bundle-check.result }}
          SMOKE: ${{ needs.e2e-smoke.result }}
        run: node scripts/ci-required.mjs build-check
