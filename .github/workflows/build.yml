name: Build

on:
  push:
    branches: [main]
    # A release tag builds the store artifacts that release.yml publishes.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type override"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - preview
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only branch and PR re-runs auto-cancel; main and release tags run to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  # A pull request pays for the iOS build only when something native can
  # change. The Android build is the app check for everything else. push and
  # dispatch skip this job and build unconditionally below.
  changes:
    name: Detect Native Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            native:
              - 'package.json'
              - 'package-lock.json'
              - 'app.json'
              - 'app.config.js'
              - 'src/plugins/**'
              - 'widget/**'
              - 'expo-modules/**'
              - 'modules/**'
              - 'ios/**'
              - '.github/workflows/build.yml'
              - '.github/workflows/build-ios.yml'
              - '.github/actions/**'

  # ============================================
  # Build Android
  # ============================================
  # On pull requests too: the E2E gate now runs after a push to main, so this is
  # the one build a Dependabot bump meets before it merges.
  build-android:
    name: Build Android
    uses: ./.github/workflows/build-android.yml
    with:
      variant: production
      release: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
      allow-stub: ${{ github.event_name == 'pull_request' }}
      build-type: ${{ inputs.build_type || 'auto' }}
    secrets: inherit

  # ============================================
  # Build iOS
  # ============================================
  build-ios:
    name: Build iOS
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.native == 'true') }}
    uses: ./.github/workflows/build-ios.yml
    with:
      variant: production
      release: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
      # Every build but a pull request's checks the App Store profiles.
      check-signing: ${{ github.event_name != 'pull_request' }}
      build-type: ${{ inputs.build_type || 'auto' }}
    secrets: inherit

  # ============================================
  # E2E Smoke, quick post-build sanity check
  # ============================================
  e2e-smoke:
    name: E2E Smoke
    needs: build-android
    if: github.event_name != 'pull_request'
    # Every push to main is smoke tested to the end. A smoke cancelled for a
    # newer push read as red in Build Required on a sha that was not broken.
    # Hosted Ubuntu with KVM, as in e2e-gate.yml. Hosted macOS has no HVF for the
    # emulator, and a self-hosted runner shares adb with whatever else is attached.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-android.outputs.apk-artifact }}
          path: /tmp/apk

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        uses: ./.github/actions/install-maestro

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 6144
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          disable-animations: true
          # Each line runs as its own `sh -c`, so every line must stand alone.
          script: |
            adb install "$(find /tmp/apk -name '*.apk' | head -1)"
            adb shell pm list packages | grep veloq
            "$HOME/.maestro/bin/maestro" test .maestro/smoke-build.yaml --no-ansi --format junit --output smoke-report.xml

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-smoke-screenshots
          # The flow's own captures land in screenshots/ under the workspace.
          path: |
            screenshots/
            ~/.maestro/tests/*/screenshots/
          retention-days: 7
          include-hidden-files: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-smoke-report
          path: smoke-report.xml
          retention-days: 7

  # The one job branch protection requires from this workflow. Build iOS may be
  # skipped only on a pull request that changes nothing native, and E2E Smoke
  # only on a pull request, where it never runs.
  build-required:
    name: Build Required
    needs: [changes, build-android, build-ios, e2e-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          ANDROID: ${{ needs.build-android.result }}
          IOS: ${{ needs.build-ios.result }}
          SMOKE: ${{ needs.e2e-smoke.result }}
        run: |
          echo "event=$EVENT changes=$CHANGES native=$NATIVE android=$ANDROID ios=$IOS smoke=$SMOKE"
          failed=0
          [ "$ANDROID" = success ] || failed=1
          # A failed filter leaves `native` empty, which would read as nothing native.
          if [ "$EVENT" = pull_request ]; then
            [ "$CHANGES" = success ] || failed=1
          fi
          if [ "$EVENT" = pull_request ] && [ "$NATIVE" != true ]; then
            [ "$IOS" = success ] || [ "$IOS" = skipped ] || failed=1
          else
            [ "$IOS" = success ] || failed=1
          fi
          if [ "$EVENT" = pull_request ]; then
            [ "$SMOKE" = skipped ] || [ "$SMOKE" = success ] || failed=1
          else
            [ "$SMOKE" = success ] || failed=1
          fi
          if [ "$failed" = 1 ]; then
            echo "::error::A required build did not pass."
            exit 1
          fi
