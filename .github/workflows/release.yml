name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  actions: read

jobs:
  # ============================================
  # Find and wait for the tag's build
  # ============================================
  find-and-wait:
    name: Find Tag Build
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Checkout (for the version check)
        uses: actions/checkout@v7

      # The store builds take their version name from app.json, so a tag that
      # names another version would publish binaries under the wrong release.
      - name: Check the tag names the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION=$(jq -r '.expo.version' app.json)
          if [ "$TAG" != "$APP_VERSION" ]; then
            echo "::error::Tag $TAG differs from app.json version $APP_VERSION."
            exit 1
          fi
          node scripts/check-module-version.mjs

      - name: Find or wait for the tag's build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          TAG="${{ github.ref_name }}"
          # The tag's Build signs the IPA and builds the AAB, which main's does not.
          MAX_WAIT=7200
          APPEAR_WAIT=600
          POLL_INTERVAL=30
          WAITED=0

          while [ $WAITED -lt $MAX_WAIT ]; do
            # The same commit also has main's push build, so the run is matched by tag.
            RESULT=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?head_sha=$COMMIT_SHA&event=push&branch=$TAG&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_branch == \"$TAG\")] | sort_by(.created_at) | reverse | (.[0] // empty) | {id, status, conclusion, html_url}")

            if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
              if [ $WAITED -ge $APPEAR_WAIT ]; then
                echo "::error::No Build run for tag $TAG at $COMMIT_SHA after ${APPEAR_WAIT}s."
                exit 1
              fi
              echo "No Build run for tag $TAG yet. Waiting ${POLL_INTERVAL}s..."
              sleep $POLL_INTERVAL
              WAITED=$((WAITED + POLL_INTERVAL))
              continue
            fi

            STATUS=$(echo "$RESULT" | jq -r '.status')
            CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion')
            RUN_ID=$(echo "$RESULT" | jq -r '.id')
            RUN_URL=$(echo "$RESULT" | jq -r '.html_url')
            echo "Matched push build: $RUN_URL (status=$STATUS, conclusion=$CONCLUSION)"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
                echo "✅ Found successful build: $RUN_ID"
                exit 0
              else
                echo "::error::Build $RUN_ID failed with conclusion: $CONCLUSION"
                exit 1
              fi
            fi

            echo "Build $RUN_ID still running ($STATUS). Waiting ${POLL_INTERVAL}s..."
            sleep $POLL_INTERVAL
            WAITED=$((WAITED + POLL_INTERVAL))
          done

          echo "::error::Timeout waiting for build to complete"
          exit 1

  # ============================================
  # Create Release
  # ============================================
  release:
    name: Create Release
    needs: find-and-wait
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      aab_path: ${{ steps.prepare.outputs.aab_path }}
      ipa_path: ${{ steps.prepare.outputs.ipa_path }}
    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifacts from the tag's build
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.find-and-wait.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Prepare release artifacts
        id: prepare
        run: |
          mkdir -p release
          VERSION="${{ steps.version.outputs.version }}"

          echo "=== Downloaded artifacts ==="
          find artifacts -type f
          echo "============================="

          # Find and rename APK (remove SHA suffix)
          APK=$(find artifacts -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "release/veloq-${VERSION}.apk"
            echo "✅ APK: veloq-${VERSION}.apk"
          else
            echo "::warning::No APK found in artifacts"
          fi

          # Find and copy AAB
          AAB=$(find artifacts -name "*.aab" | head -1)
          if [ -n "$AAB" ]; then
            AAB_DEST="release/veloq-${VERSION}.aab"
            cp "$AAB" "$AAB_DEST"
            echo "aab_path=$AAB_DEST" >> $GITHUB_OUTPUT
            echo "✅ AAB: veloq-${VERSION}.aab"
          else
            echo "::error::No AAB found in the tag's build. Play internal would get nothing." >&2
            exit 1
          fi

          # Find and rename iOS simulator artifact
          IOS=$(find artifacts -name "*-ios-simulator.zip" | head -1)
          if [ -n "$IOS" ]; then
            cp "$IOS" "release/veloq-${VERSION}-ios-simulator.zip"
            echo "✅ iOS Simulator: veloq-${VERSION}-ios-simulator.zip"
          else
            echo "::warning::No iOS simulator artifact found"
          fi

          # Find and copy IPA
          IPA=$(find artifacts -name "*.ipa" | head -1)
          if [ -n "$IPA" ]; then
            IPA_DEST="release/veloq-${VERSION}.ipa"
            cp "$IPA" "$IPA_DEST"
            echo "ipa_path=$IPA_DEST" >> $GITHUB_OUTPUT
            echo "✅ IPA: veloq-${VERSION}.ipa"
          else
            echo "::error::No IPA found in the tag's build (iOS signing may not be configured). TestFlight would get nothing." >&2
            exit 1
          fi

          echo ""
          echo "=== Release artifacts ==="
          ls -la release/

      - name: Read changelog
        id: changelog
        run: |
          VERSION_CODE=$(node -e 'const code = require("./app.json").expo?.android?.versionCode; if (!Number.isInteger(code) || code <= 0) { console.error("app.json has no valid expo.android.versionCode"); process.exit(1); } process.stdout.write(String(code));')
          CHANGELOG_FILE="config/fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ ! -s "$CHANGELOG_FILE" ]; then
            echo "::error::Missing changelog for Android versionCode $VERSION_CODE" >&2
            exit 1
          fi
          CHANGELOG=$(cat "$CHANGELOG_FILE")
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Veloq v${{ steps.version.outputs.version }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.content }}

            ## Downloads
            - **Android APK**: Direct install
            - **Android AAB**: For Play Store upload
            - **iOS Simulator**: For testing

            ---
            Built from commit: ${{ github.sha }}
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload AAB for deploy job (release/* gets cleaned up)
      - name: Upload AAB for deployment
        if: steps.prepare.outputs.aab_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: ${{ steps.prepare.outputs.aab_path }}
          retention-days: 1

      # Upload IPA for deploy job
      - name: Upload IPA for deployment
        if: steps.prepare.outputs.ipa_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-ipa
          path: ${{ steps.prepare.outputs.ipa_path }}
          retention-days: 1

  # ============================================
  # Deploy to Google Play (optional)
  # ============================================
  deploy-play-store:
    name: Deploy to Play Store
    needs: release
    runs-on: ubuntu-24.04
    # Fails when GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing, so a green run means Play has the build
    steps:
      - name: Check for Play Store credentials
        id: check_creds
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not configured, so nothing reaches Play internal." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup fastlane
        uses: ./.github/actions/setup-fastlane

      - name: Download AAB
        uses: actions/download-artifact@v8
        with:
          name: release-aab
          path: release/

      - name: Setup Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > play_store_credentials.json

      - name: Upload to Play Store (internal track)
        working-directory: config/fastlane
        env:
          SUPPLY_JSON_KEY: ${{ github.workspace }}/play_store_credentials.json
          AAB_PATH: ${{ github.workspace }}/release/veloq-${{ needs.release.outputs.version }}.aab
        run: |
          if [ ! -f "$AAB_PATH" ]; then
            echo "Error: AAB file not found at $AAB_PATH"
            echo "Contents of workspace/release:"
            ls -la "${{ github.workspace }}/release/" || echo "Directory not found"
            exit 1
          fi
          bundle exec fastlane android deploy track:internal aab:"$AAB_PATH"

      - name: Cleanup credentials
        if: always()
        run: rm -f play_store_credentials.json

      - name: Summary
        run: |
          echo "## Play Store Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Track:** internal" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To promote to production, go to [Google Play Console](https://play.google.com/console)." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Deploy to TestFlight
  # ============================================
  deploy-testflight:
    name: Deploy to TestFlight
    needs: release
    runs-on: macos-26
    # Fails when an ASC credential is missing, so a green run means TestFlight has the build
    steps:
      - name: Check for TestFlight credentials
        id: check_creds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY" ]; then
            echo "::error::An App Store Connect credential is not configured, so nothing reaches TestFlight." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup fastlane
        uses: ./.github/actions/setup-fastlane

      - name: Download IPA
        uses: actions/download-artifact@v8
        with:
          name: release-ipa
          path: release/

      - name: Upload to TestFlight
        working-directory: config/fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          IPA_PATH: ${{ github.workspace }}/release/veloq-${{ needs.release.outputs.version }}.ipa
        run: |
          if [ ! -f "$IPA_PATH" ]; then
            echo "Error: IPA file not found at $IPA_PATH"
            echo "Contents of workspace/release:"
            ls -la "${{ github.workspace }}/release/" || echo "Directory not found"
            exit 1
          fi
          bundle exec fastlane ios beta ipa:"$IPA_PATH"

      # continue-on-error is intentional: metadata upload needs an editable App
      # Store Connect version to exist. The TestFlight binary upload above is the
      # critical step; this one is safe to fail.
      - name: Upload App Store metadata
        continue-on-error: true
        working-directory: config/fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: bundle exec fastlane ios metadata app_version:${{ needs.release.outputs.version }}

      - name: Summary
        run: |
          echo "## TestFlight Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Track:** Internal TestFlight" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build will be available in [App Store Connect](https://appstoreconnect.apple.com) shortly." >> $GITHUB_STEP_SUMMARY
