name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The transform cache and haste map, which a cold run rebuilds for every
      # file. The lockfile is in the key because a dependency change
      # invalidates the transforms, and the sha so each main run saves a fresh
      # copy; a run restores the newest one under its lockfile. Pull requests
      # read main's cache and write none, so they cannot evict it.
      - name: Restore Jest cache
        uses: actions/cache/restore@v6
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run tests
        run: npm test
        env:
          JEST_WORKERS: 2

      - name: Save Jest cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    # The synthetic suite is 20 CPU-minutes with the dependencies optimised
    # (workspace Cargo.toml, `profile.dev.package`), about six on four cores,
    # plus the compile. A run past twenty minutes is a hang, not a slow suite.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # One toolchain across the three Rust jobs, the one
      # rust-toolchain.toml at the repository root names, so the caches share
      # content. A Jest test fails when a pin here drifts from that file.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/veloqrs/rust
          key: test
          # Pull requests read main's cache and write none, so they cannot evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # veloqrs only. tracematch runs its own suite, the GeoLife corpus and
      # the synthetic lane in its own CI on the pinned sha, so repeating them
      # here doubled the job for no coverage. One invocation with the
      # synthetic feature on: a second run without it relinked every test
      # binary and re-ran the non-synthetic targets a second time.
      # nextest runs every binary's tests through one scheduler with a
      # per-test timeout (`.config/nextest.toml`), where `cargo test` runs the
      # binaries one after another and waits on a hang forever. It does not
      # run doctests, so the `--doc` pass follows and reuses the build.
      # A target whose `required-features` the run does not enable compiles to an
      # empty binary: it prints `running 0 tests` and `ok`, so an exit code
      # cannot see it and the resume suite was red for days behind that. `list`
      # builds the same binaries the run reuses, so this costs the check alone.
      - name: Check no test target is empty
        run: node scripts/lint-empty-test-binaries.js -p veloqrs --features synthetic

      - name: Run Rust tests
        working-directory: modules/veloqrs/rust
        run: |
          cargo nextest run -p veloqrs --features synthetic --profile ci
          cargo test -p veloqrs --features synthetic --doc

      # Benches are a build target nothing else compiles: `cargo test` and the
      # merge gates skip them, so a bench rots silently behind any signature
      # change. Type-checked, not linked: `cargo bench --no-run` links under the
      # release profile's LTO and ran this job past its cap, and every bench
      # break so far was a compile error, which `check` sees.
      - name: Check Rust benches
        working-directory: modules/veloqrs/rust
        run: cargo check -p veloqrs --features synthetic --benches

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-report
          path: modules/veloqrs/rust/target/nextest/ci/junit.xml
          retention-days: 7

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Pinned to rust-toolchain.toml at the repository root, which is the
      # release the tree is formatted with. Bump both with a fresh `cargo fmt`.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/veloqrs/rust
          key: lint
          # Pull requests read main's cache and write none, so they cannot evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check formatting
        working-directory: modules/veloqrs/rust
        run: cargo fmt -p veloqrs --check

      # Every target and feature, so a test, bench or example is linted too.
      - name: Clippy
        working-directory: modules/veloqrs/rust
        run: cargo clippy -p veloqrs --all-targets --all-features -- -D warnings

  # Every check that needs only node_modules, behind one install. They were four
  # jobs across two workflows, each paying its own checkout and npm ci, and one
  # format drift failed two of them.
  js:
    name: JS Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Recursive: lint-detector-ordering.mjs and the tracematch-backed guards
      # read the submodule, and pass silently without it.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "npm"

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      # The same guards the pre-commit hook runs, so a PR can't merge past them
      # with --no-verify. See the `audit` script in package.json for the list.
      - name: Run guard scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run audit

      # The Jest suites over the scripts, hooks, workflows and the test tree,
      # which `npm test` in the Jest job leaves out. config/jest.tooling.js
      # holds the split.
      - name: Run tooling tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:tooling

      # Its own package, and Dependabot bumps it with nothing else checking it.
      - name: Type check the OAuth proxy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: oauth-proxy
        run: |
          npm ci
          npx tsc --noEmit -p .

      # A personal routes.db was purged from history. Fail if the blob is
      # reachable again from any ref the checkout can see.
      - name: Purged data tripwire
        if: ${{ !cancelled() }}
        run: |
          git fetch --quiet --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*'
          if git rev-list --objects --all | grep -q '^1c8f0e9a567179c76ac0bae7b9dfeff563b0c8dc'; then
            echo "The purged routes.db blob is reachable from a fetched ref."
            exit 1
          fi

  verify-bindings:
    name: Verify Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/veloqrs/rust
          key: verify-bindings
          # Pull requests read main's cache and write none, so they cannot evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Install dependencies
        run: npm ci

      - name: Regenerate bindings
        run: ./scripts/generate-bindings.sh

      - name: Check bindings match
        run: |
          if ! git diff --quiet modules/veloqrs/src/generated modules/veloqrs/cpp/generated; then
            echo "::error::Bindings out of sync with Rust source. Run ./scripts/generate-bindings.sh and commit."
            echo ""
            echo "=== Changed files ==="
            git diff --stat modules/veloqrs/src/generated modules/veloqrs/cpp/generated
            echo ""
            echo "=== Detailed diff (first 100 lines) ==="
            git diff modules/veloqrs/src/generated modules/veloqrs/cpp/generated | head -100
            exit 1
          fi
          echo "Bindings are in sync with Rust source"

  # The one job branch protection requires from this workflow. A job skipped or
  # cancelled upstream reports neutral, which GitHub renders as passing, so the
  # result of each is read here instead.
  ci-required:
    name: CI Required
    needs: [jest, rust, rust-lint, js, verify-bindings]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          JEST: ${{ needs.jest.result }}
          RUST: ${{ needs.rust.result }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          JS: ${{ needs.js.result }}
          VERIFY_BINDINGS: ${{ needs.verify-bindings.result }}
        run: |
          echo "jest=$JEST rust=$RUST rust-lint=$RUST_LINT js=$JS verify-bindings=$VERIFY_BINDINGS"
          for result in "$JEST" "$RUST" "$RUST_LINT" "$JS" "$VERIFY_BINDINGS"; do
            [ "$result" = success ] || { echo "::error::A required check did not pass."; exit 1; }
          done
