name: Test

on:
  push:
    # A ci/ branch runs the workflow before main does. Its caches are read-only:
    # every cache write is gated on main.
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only branch and PR re-runs auto-cancel. A push to main runs to the end, or
  # CI Required reads its cancelled jobs as red on a sha that is not broken.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Which jobs below this change has to run. Only a Dependabot patch or minor
  # skips any: a push to main, a Dependabot major and every other pull request
  # run them all.
  # scripts/ci-required.mjs holds the areas each job can see, and CI Required
  # reads a skipped job against the same areas.
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # fetch-metadata lists the pull request's commits.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      areas: ${{ steps.plan.outputs.areas }}
      run: ${{ steps.plan.outputs.run }}
      zones: ${{ steps.plan.outputs.zones }}
    env:
      EVENT: ${{ github.event_name }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      # Two commits: a pull request checks out its merge commit, and the first
      # parent is the base the change is read against.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A commit made in a hookless clone met no pre-commit hook, and every
      # other job here can be skipped, so this one judges every tracked path on
      # every push and pull request before anything else runs.
      - name: Private data
        run: bash scripts/check-no-private-data.sh --all

      # A Dependabot major runs every job. The update type is read here, and a
      # read that fails leaves it empty, which ci-required.mjs counts as a major.
      - name: Fetch Dependabot metadata
        id: meta
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether the run is scoped
        id: scope
        run: node scripts/ci-required.mjs scope
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}

      # A lockfile bump is native only when the package ships native code,
      # which is read from the installed tree.
      - name: Install dependencies
        if: steps.scope.outputs.scoped == 'true'
        uses: ./.github/actions/npm-ci

      - name: Plan the jobs
        id: plan
        run: node scripts/ci-required.mjs plan
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}

  jest:
    name: Jest (${{ matrix.tz }}, ${{ matrix.shard }}/2)
    needs: changes
    if: fromJSON(needs.changes.outputs.run).jest
    runs-on: ubuntu-24.04
    # Measured on GitHub runners on 2026-10-07 with a cold Jest cache, 1,115
    # suites: `npm test` took 6m16s on one runner and 9m07s on another, and a
    # third was still finishing suites steadily at 9m34s when the old
    # ten-minute cap cancelled it. Neither zone hangs, the runners differ. At
    # 742 suites in late September a cold run was 4m20s. The cap leaves about
    # five minutes over the slowest figure. A run past it needs its logs read
    # to tell a slow runner from a stuck suite. A cancelled run saves no Jest
    # cache, so a cap under the cold figure keeps every later run cold too.
    # At 1,816 suites a cold run passed 1,563 by the fifteen-minute cap, so
    # it needs about 18 minutes and the cap is 25.
    # Warm main runs in mid October still spent 9m16s to 15m15s in the test
    # step of each zone, against 10 to 13 minutes for every other job, so each
    # zone runs in two shards. Jest splits the suites by path, and each shard
    # keeps its own cache, since it transforms only the files its suites reach.
    timeout-minutes: 25
    # The app project runs under the zones furthest east and west of UTC, so a
    # formatter that mixes UTC and local fields fails here and not only for
    # athletes at those offsets. A Dependabot bump of a package with no native
    # code runs the first alone, since a library bump moves no app date code.
    strategy:
      fail-fast: false
      matrix:
        tz: ${{ fromJSON(needs.changes.outputs.zones) }}
        # The count in `--shard` below is the length of this list.
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      # The transform cache and haste map, which a cold run rebuilds for every
      # file. The lockfile is in the key because a dependency change
      # invalidates the transforms, and the sha so each main run saves a fresh
      # copy; a run restores the newest one under its lockfile. Pull requests
      # read main's cache and write none, so they cannot evict it.
      - name: Restore Jest cache
        uses: actions/cache/restore@v6
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-

      - name: Run tests
        run: npm test -- --shard=${{ matrix.shard }}/2
        env:
          JEST_WORKERS: 2
          TZ: ${{ matrix.tz }}

      - name: Save Jest cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.tz == 'Pacific/Kiritimati' }}
        uses: actions/cache/save@v6
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-${{ github.sha }}

  rust:
    name: Rust Tests (partition ${{ matrix.partition }}/3)
    needs: changes
    if: fromJSON(needs.changes.outputs.run).rust
    runs-on: ubuntu-24.04
    # One leg per nextest partition, so the job's wall time follows its
    # slowest leg and each leg runs a third of the tests. Every leg compiles
    # the whole test tree, since nextest builds every binary before it splits
    # them. The cap was measured on the single-job run of 2026-10-25 with 5501
    # tests: 6m34s to compile, 13m06s in nextest (all passing), then the
    # doctests and the bench check (1m38s on a cold cache), so 20m02s had
    # elapsed when the old 20 minute cap cancelled it. The cap applies to each
    # leg and has not been measured on a partitioned run, so remeasure it from
    # the first one. A run past the cap needs its logs read to tell a slow leg
    # from a stuck one.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The count in `--partition` below is the length of this list.
        partition: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # One toolchain across the three Rust jobs, the one
      # rust-toolchain.toml at the repository root names, so the caches share
      # content. A Jest test fails when a pin here drifts from that file.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0

      # Every leg restores the one cache. Only leg 1 saves it on main, so the
      # three legs do not write the same key in a race.
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: modules/veloqrs/rust
          key: test
          # Pull requests read main's cache and write none, so they cannot evict it.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 1 }}
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: nextest

      # veloqrs only. tracematch runs its own suite, the GeoLife corpus and
      # the synthetic lane in its own CI on the pinned sha, so repeating them
      # here doubled the job for no coverage. Each leg runs one partition of
      # one invocation with the synthetic feature on. A second run without the
      # feature relinked every test binary and re-ran the non-synthetic
      # targets a second time.
      # nextest runs every binary's tests through one scheduler with a
      # per-test timeout (`.config/nextest.toml`), where `cargo test` runs the
      # binaries one after another and waits on a hang forever.
      # A target whose `required-features` the run does not enable compiles to an
      # empty binary: it prints `running 0 tests` and `ok`, so an exit code
      # cannot see it and the resume suite was red for days behind that. Only
      # leg 1 runs this check. `list` builds the same binaries the run reuses,
      # so the other legs compile nothing extra for it.
      - name: Check no test target is empty
        if: matrix.partition == 1
        run: node scripts/lint-empty-test-binaries.js -p veloqrs --features synthetic

      - name: Run Rust tests
        working-directory: modules/veloqrs/rust
        run: cargo nextest run -p veloqrs --features synthetic --profile ci --partition hash:${{ matrix.partition }}/3

      # Doctests are not partitioned by nextest, so only leg 1 runs them.
      - name: Run doctests
        if: matrix.partition == 1
        working-directory: modules/veloqrs/rust
        run: cargo test -p veloqrs --features synthetic --doc

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-test-report-${{ matrix.partition }}
          path: modules/veloqrs/rust/target/nextest/ci/junit.xml
          retention-days: 7

  rust-lint:
    name: Rust Lint
    needs: changes
    if: fromJSON(needs.changes.outputs.run).rust-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Pinned to rust-toolchain.toml at the repository root, which is the
      # release the tree is formatted with. Bump both with a fresh `cargo fmt`.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: modules/veloqrs/rust
          key: lint
          # Pull requests read main's cache and write none, so they cannot evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check formatting
        working-directory: modules/veloqrs/rust
        run: cargo fmt -p veloqrs --check

      # Every target and feature, so a test, bench or example is linted too.
      # This is also the bench type-check: clippy over all targets compiles
      # every bench without linking it, which `cargo check --benches` did.
      - name: Clippy
        working-directory: modules/veloqrs/rust
        run: cargo clippy -p veloqrs --all-targets --all-features -- -D warnings

  # Every check that needs only node_modules, behind one install. They were four
  # jobs across two workflows, each paying its own checkout and npm ci, and one
  # format drift failed two of them.
  js:
    name: JS Checks
    needs: changes
    if: fromJSON(needs.changes.outputs.run).js
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Recursive: lint-detector-ordering.mjs and the tracematch-backed guards
      # read the submodule, and pass silently without it.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        id: install
        uses: ./.github/actions/npm-ci

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc -b

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      # The Jest suites over the scripts, hooks, workflows and the test tree,
      # which `npm test` in the Jest job leaves out. config/jest.tooling.js
      # holds the split.
      - name: Run tooling tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:tooling

      # The three map pages, built as the app builds them, drawn in a headless
      # Chromium with SwiftShader on the runner's own Chrome. The renderer is
      # bundled outside npm, so no dependency update reaches it, and this is
      # the one check that runs it.
      - name: Smoke the map pages in Chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:map-pages

      # A personal routes.db was purged from history. Fail if the blob is
      # reachable again from any ref the checkout can see.
      - name: Purged data tripwire
        if: ${{ !cancelled() }}
        run: |
          git fetch --quiet --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*'
          if git rev-list --objects --all | grep -q '^1c8f0e9a567179c76ac0bae7b9dfeff563b0c8dc'; then
            echo "The purged routes.db blob is reachable from a fetched ref."
            exit 1
          fi

  verify-bindings:
    name: Verify Bindings
    needs: changes
    if: fromJSON(needs.changes.outputs.run).verify-bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: modules/veloqrs/rust
          key: verify-bindings
          # Pull requests read main's cache and write none, so they cannot evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-format

      # Its own package, and Dependabot bumps it with nothing else checking it.
      # The guards typecheck it with its own compiler and Workers types.
      - name: Install the OAuth proxy dependencies
        working-directory: oauth-proxy
        run: npm ci

      - name: Run guard scripts and verify bindings
        run: npm run audit
        env:
          GUARD_WORKERS: 2

  rust-advisories:
    needs: changes
    if: fromJSON(needs.changes.outputs.run).rust-advisories
    uses: ./.github/workflows/rust-advisories.yml

  # The one job branch protection requires from this workflow. A job skipped or
  # cancelled upstream reports neutral, which GitHub renders as passing, so the
  # result of each is read here instead, a skip against the areas the change
  # reaches.
  ci-required:
    name: CI Required
    needs: [changes, jest, rust, rust-lint, rust-advisories, js, verify-bindings]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A Dependabot pull request's red jobs are read against main's latest
    # finished Test run, which needs the run history.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check results
        env:
          EVENT: ${{ github.event_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CHANGES: ${{ needs.changes.result }}
          AREAS: ${{ needs.changes.outputs.areas }}
          JEST: ${{ needs.jest.result }}
          RUST: ${{ needs.rust.result }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          RUST_ADVISORIES: ${{ needs.rust-advisories.result }}
          JS: ${{ needs.js.result }}
          VERIFY_BINDINGS: ${{ needs.verify-bindings.result }}
        run: node scripts/ci-required.mjs check
