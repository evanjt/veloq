name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/connect/**"
      - "package-lock.json"
      - "scripts/build-connect-page.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      # Older pages named in web/connect/kept.json are built from their commits.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      # docs/connect/ is built from web/connect/ and is not tracked.
      - name: Build the connect page
        run: npm run build:connect

      - name: Check the connect page loads only its own files
        run: npm run check:connect-page-local

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
