name: E2E

on:
  # Daily, on the default branch head the run starts on. github.sha is fixed for
  # the run, so every build and test job checks out the same commit. A build
  # restores the Dev app finished from the same input hash, and compiles only
  # when no such app exists, so unchanged inputs run the suite with no native
  # build. The cache is exact-key: nothing stands in for a changed app.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Test tier tags"
        required: false
        default: "tier0,tier1,tier2,tier3"
        type: string

permissions:
  contents: read
  checks: write

jobs:
  # ============================================
  # Build the Dev variant through the shared definitions
  # ============================================
  build-android-dev:
    name: Build Android Dev
    uses: ./.github/workflows/build-android.yml
    with:
      variant: dev
      abis: arm64-v8a,x86_64
      allow-stub: true
      widget-captures: true
      retention-days: 7

  build-ios-dev:
    name: Build iOS Dev
    uses: ./.github/workflows/build-ios.yml
    with:
      variant: dev
      retention-days: 7

  # ============================================
  # E2E Tests - Android with Maestro
  # ============================================
  e2e-android:
    needs: build-android-dev

    name: E2E Android (Maestro)
    # Hosted Ubuntu + KVM (see e2e-gate.yml): hosted macOS can't boot an Android
    # emulator (nested VM, no HVF -> qemu fails with HV_UNSUPPORTED).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-android-dev.outputs.apk-artifact }}
          path: /tmp/android-artifact

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        uses: ./.github/actions/install-maestro

      - name: Run Maestro tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
          TIERS: ${{ inputs.tier || 'tier0,tier1,tier2,tier3' }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # Real phone profile (1080x2400). The default AVD skin is 320x640,
          # which pushes below-the-fold controls off-screen and breaks flows.
          profile: pixel_6
          # The profile's own 2 GB is shared with system_server, Play services,
          # the launcher and Maestro's driver app, and under software GL the
          # driver is what gets squeezed out. Losing it reads as a dozen failed
          # flows rather than one dead device.
          ram-size: 6144
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          disable-animations: true
          # The action runs each script line as a separate `sh -c`, so no shell
          # state (vars, `export PATH`) survives between lines and `\` line
          # continuations break. Every line must stand alone.
          script: |
            adb install "$(find /tmp/android-artifact -name '*.apk' | head -1)"
            adb logcat -c
            # Stream logcat for the whole suite. A single `-d` dump at the end
            # only holds the last few minutes (ring buffer) and returns nothing
            # if the emulator dies mid-suite, which is the failure being chased.
            nohup sh -c 'adb logcat -v threadtime > /tmp/logcat.txt 2>&1' &
            # Through run-suite.sh, as the gate runs it: under software GL a
            # MapLibre surface starves the driver, and every flow queued behind
            # that death reports in milliseconds. Bare, the sweep called those
            # failures: 78 of 85 on 2026-09-13, 103 of 103 on 08-23. The script
            # tells a death from a failed step, restarts the device once and
            # gives those flows a clean shot.
            .maestro/run-suite.sh maestro-report.xml /tmp/maestro-debug --include-tags="$TIERS" || echo "MAESTRO_FAILED=true" >> "$GITHUB_ENV"
            adb devices -l > /tmp/device-state.txt 2>&1 || true
            pgrep -af qemu >> /tmp/device-state.txt 2>&1 || true

      - name: Filter diagnostic logs
        if: always()
        run: |
          grep -E "(FATAL|veloqrs|ReactNative|AndroidRuntime|Process:|Signal|crash|panic)" /tmp/logcat.txt > /tmp/logcat-filtered.txt 2>/dev/null || true

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots-flat
          # The flows capture to screenshots/, which Maestro resolves against the
          # workspace, and its own failure dumps go under ~/.maestro.
          find "$GITHUB_WORKSPACE"/screenshots ~/.maestro /tmp/maestro-debug -name "*.png" -exec cp {} screenshots-flat/ \; 2>/dev/null || true
          for f in screenshots-flat/*.png; do
            [ -f "$f" ] && mv "$f" "${f%.png}-android.png" 2>/dev/null || true
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-android
          path: screenshots-flat/
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-report
          path: |
            maestro-report.xml
            retry-reports/
          retention-days: 7

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-logcat
          path: |
            /tmp/logcat.txt
            /tmp/logcat-filtered.txt
            /tmp/device-state.txt
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        with:
          report_paths: maestro-report.xml
          check_name: E2E Android Results
          fail_on_failure: false

      - name: Fail if tests failed
        if: always() && env.MAESTRO_FAILED == 'true'
        run: exit 1

  # ============================================
  # Widget captures - Android
  # ============================================
  # Every widget at every size its provider allows, light and dark, from the
  # sample and the long-text fixtures, failing on any cut-off line, from the
  # engine module's test APK the Dev build makes beside the app.
  widget-captures-android:
    needs: build-android-dev
    name: Widget captures (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download widget capture test
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-android-dev.outputs.widget-captures-artifact }}
          path: modules/veloqrs/android/build/outputs/apk/androidTest/debug

      - name: Capture the widgets on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          disable-animations: true
          # One `sh -c` per line, so the verdict goes through the environment.
          script: |
            scripts/widget-captures-android.sh widget-captures || echo "WIDGET_CAPTURES_FAILED=true" >> "$GITHUB_ENV"

      - name: Upload widget captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: widget-captures-android
          path: widget-captures/
          retention-days: 14

      - name: Fail on cut-off text
        if: always() && env.WIDGET_CAPTURES_FAILED == 'true'
        run: exit 1

  # ============================================
  # E2E Tests - iOS with Maestro
  # ============================================
  e2e-ios:
    needs: build-ios-dev

    name: E2E iOS (Maestro, ${{ matrix.shard.name }})
    runs-on: macos-26
    # One job ran every flow and was cancelled at 120 minutes and again at 180,
    # so no iOS report was ever seen. Each shard is a set of packs, narrowed by
    # tier where one pack alone is too slow, and holds the flows whose measured
    # time, plus setup and a retry pass for half of them, fits inside the hour.
    # src/__tests__/bugs/e2eIosSweepFinishes.test.ts holds the measurements and
    # refuses a shard that outgrows its timeout or a flow no shard runs.
    timeout-minutes: 60
    strategy:
      # A failed shard must not cancel the others, since a cancelled shard
      # leaves no report.
      fail-fast: false
      matrix:
        shard:
          - name: map
            packs: pack-map
            tiers: tier0,tier1,tier2,tier3
          - name: routes
            packs: pack-routes
            tiers: tier2,tier3
          - name: settings
            packs: pack-settings
            tiers: tier2,tier3
          - name: routes-settings-core
            packs: pack-routes,pack-settings
            tiers: tier0,tier1
          - name: recording
            packs: pack-recording
            tiers: tier0,tier1,tier2,tier3
          - name: activity-data
            packs: pack-activity,pack-data
            tiers: tier0,tier1,tier2,tier3
          - name: nav-auth-home
            packs: pack-nav,pack-auth,pack-home,pack-training
            tiers: tier0,tier1,tier2,tier3
          - name: fitness-stress
            packs: pack-fitness,pack-stress
            tiers: tier0,tier1,tier2,tier3
    steps:
      - uses: actions/checkout@v7

      - name: Install Maestro
        uses: ./.github/actions/install-maestro

      - name: Boot simulator with the Dev app
        id: simulator
        uses: ./.github/actions/boot-ios-simulator
        with:
          artifact: ${{ needs.build-ios-dev.outputs.simulator-artifact }}

      # Maestro includes a flow carrying any included tag, so the packs go in
      # --include-tags and the tiers this shard does not hold, or the dispatch
      # did not ask for, go in --exclude-tags. A shard left with no tier runs
      # nothing and writes no report.
      - name: Run Maestro tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
          PACKS: ${{ matrix.shard.packs }}
          SHARD_TIERS: ${{ matrix.shard.tiers }}
          TIERS: ${{ inputs.tier || 'tier0,tier1,tier2,tier3' }}
        run: |
          exclude=""
          held=""
          for tier in tier0 tier1 tier2 tier3; do
            case ",$TIERS," in *",$tier,"*) asked=1 ;; *) asked=0 ;; esac
            case ",$SHARD_TIERS," in *",$tier,"*) mine=1 ;; *) mine=0 ;; esac
            if [ "$asked" = 1 ] && [ "$mine" = 1 ]; then
              held=1
            else
              exclude="$exclude${exclude:+,}$tier"
            fi
          done
          case ",$TIERS," in *",tier4,"* | *",tier5,"*) echo "::warning::Flows past tier3 carry no pack, so no iOS shard runs them." ;; esac
          if [ -z "$held" ]; then
            echo "This shard holds none of the tiers asked for ($TIERS)."
            exit 0
          fi
          args=(--include-tags="$PACKS")
          [ -z "$exclude" ] || args+=(--exclude-tags="$exclude")
          .maestro/run-suite.sh maestro-report.xml /tmp/maestro-debug "${args[@]}" || echo "MAESTRO_FAILED=true" >> "$GITHUB_ENV"

      - name: Capture diagnostic logs
        if: always()
        run: |
          xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" log show --last 60m --predicate 'process == "VeloqDev" OR processImagePath CONTAINS "VeloqDev"' > /tmp/ios-sim-log.txt 2>&1 || true
          find ~/Library/Logs/DiagnosticReports -name "VeloqDev*" -exec cp {} /tmp/ \; 2>/dev/null || true

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots-flat
          find "$GITHUB_WORKSPACE"/screenshots ~/.maestro /tmp/maestro-debug -name "*.png" -exec cp {} screenshots-flat/ \; 2>/dev/null || true
          for f in screenshots-flat/*.png; do
            [ -f "$f" ] && mv "$f" "${f%.png}-ios.png" 2>/dev/null || true
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-ios-${{ matrix.shard.name }}
          path: screenshots-flat/
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-logs-${{ matrix.shard.name }}
          path: |
            /tmp/ios-sim-log.txt
            /tmp/VeloqDev*
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-report-${{ matrix.shard.name }}
          path: |
            maestro-report.xml
            retry-reports/
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        with:
          report_paths: maestro-report.xml
          check_name: E2E iOS Results (${{ matrix.shard.name }})
          fail_on_failure: false

      - name: Fail if tests failed
        if: always() && env.MAESTRO_FAILED == 'true'
        run: exit 1

  # ============================================
  # Widget captures - iOS
  # ============================================
  # Every widget at every family it supports, in the smallest and the largest
  # iPhone box, light and dark, from the sample and the long-text fixtures,
  # failing on any cut-off text, from a Swift package of the extension's own
  # sources on a simulator. It needs no app build.
  widget-captures-ios:
    name: Widget captures (iOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Capture the widgets on a simulator
        run: |
          scripts/widget-captures-ios.sh widget-captures-ios || echo "WIDGET_CAPTURES_FAILED=true" >> "$GITHUB_ENV"

      - name: Upload widget captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: widget-captures-ios
          path: widget-captures-ios/
          retention-days: 14

      - name: Fail on cut-off text
        if: always() && env.WIDGET_CAPTURES_FAILED == 'true'
        run: exit 1

  # ============================================
  # E2E Summary
  # ============================================
  e2e-summary:
    needs: [build-android-dev, build-ios-dev, e2e-ios, e2e-android, widget-captures-android, widget-captures-ios]
    if: ${{ always() && (needs.e2e-ios.result != 'skipped' || needs.e2e-android.result != 'skipped') }}
    name: E2E Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # continue-on-error is intentional on both report downloads: the summary must
      # still render when one platform job died before uploading its report. The
      # summary step below emits an explicit failure row for a missing report.
      # One report per shard, each in its own directory under the pattern.
      - name: Download iOS reports
        uses: actions/download-artifact@v8
        with:
          pattern: maestro-ios-report-*
          path: /tmp/reports/ios
        continue-on-error: true

      - name: Download Android report
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-report
          path: /tmp/reports/android
        continue-on-error: true

      - name: Generate summary
        env:
          IOS_RESULT: ${{ needs.e2e-ios.result }}
          TESTED_SHA: ${{ github.sha }}
          ANDROID_SOURCE_HASH: ${{ needs.build-android-dev.outputs.source_hash }}
          IOS_SOURCE_HASH: ${{ needs.build-ios-dev.outputs.source_hash }}
          TESTED_COMMIT: ${{ github.sha }}
          ANDROID_PRODUCER: ${{ needs.build-android-dev.outputs.producer_commit }}
          IOS_PRODUCER: ${{ needs.build-ios-dev.outputs.producer_commit }}
        run: |
          {
            echo "## E2E Test Results"
            echo ""
            echo "Tested commit: $TESTED_SHA. Dev app input hash: Android $ANDROID_SOURCE_HASH, iOS $IOS_SOURCE_HASH."
            echo ""
            echo "| Platform | Result | Status |"
            echo "|----------|--------|--------|"
            row() {
              label="$1"
              report="$2"
              if [ -f "$report" ]; then
                tests=$(grep -oP 'tests="\K[0-9]+' "$report" | head -1 || echo "0")
                failures=$(grep -oP 'failures="\K[0-9]+' "$report" | head -1 || echo "0")
                if [ "$failures" = "0" ] || [ -z "$failures" ]; then
                  echo "| $label | ${tests:-0} passed | :white_check_mark: |"
                else
                  passed=$((tests - failures))
                  echo "| $label | $passed/$tests passed ($failures failed) | :x: |"
                fi
              else
                echo "| $label | Report missing: platform job failed or did not upload | :x: |"
              fi
            }
            for dir in /tmp/reports/ios/maestro-ios-report-*; do
              [ -d "$dir" ] || continue
              row "ios ${dir##*/maestro-ios-report-}" "$dir/maestro-report.xml"
            done
            # A cancelled shard uploads nothing, so the shards above are only
            # those that wrote a report, and the job result is what says the
            # rest did not finish.
            if [ "$IOS_RESULT" != "success" ]; then
              echo "| ios | Shards ended $IOS_RESULT: a shard missing above did not finish | :x: |"
            fi
            row android /tmp/reports/android/maestro-report.xml
            for platform in ios android; do
              case "$platform" in
                ios) producer="$IOS_PRODUCER" ;;
                android) producer="$ANDROID_PRODUCER" ;;
              esac
              if [ -n "$producer" ] && [ "$producer" != "$TESTED_COMMIT" ]; then
                echo ""
                echo "The $platform app under test was reused from a build of ${producer:0:9}, not the tested commit ${TESTED_COMMIT:0:9}."
              fi
            done
            echo ""
            echo "_See check annotations and artifacts for details_"
          } > summary.md
          cat summary.md >> $GITHUB_STEP_SUMMARY

      # A platform job that was cancelled on its timeout is neither `failure`
      # nor `skipped`, and the summary used to exit 0 through it, so a sweep in
      # which iOS never finished read as an Android-only failure.
      - name: Fail unless every platform job succeeded
        if: always()
        env:
          IOS_RESULT: ${{ needs.e2e-ios.result }}
          ANDROID_RESULT: ${{ needs.e2e-android.result }}
          WIDGETS_RESULT: ${{ needs.widget-captures-android.result }}
          WIDGETS_IOS_RESULT: ${{ needs.widget-captures-ios.result }}
        run: |
          red=0
          for platform in ios android widgets widgets-ios; do
            case "$platform" in
              ios) result="$IOS_RESULT" ;;
              android) result="$ANDROID_RESULT" ;;
              widgets) result="$WIDGETS_RESULT" ;;
              widgets-ios) result="$WIDGETS_IOS_RESULT" ;;
            esac
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "E2E $platform: $result"
              red=1
            fi
          done
          [ "$red" = "0" ] || exit 1
