name = "veloq-link-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Same hostname as the OAuth proxy, by path, so the app and the page reach
# one domain.
routes = [{ pattern = "auth.veloq.fit/link/*", zone_name = "veloq.fit" }]

# The relay keeps no records: no request logs, no traces. A guard holds this
# off, so the relay never keeps who connected and when.
[observability]
enabled = false

# Caps how many rooms one address opens a minute, before a room is billed. The
# limiter counts per address and keeps nothing else.
[[ratelimits]]
name = "LINK_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "LinkRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LinkRoom"]
