plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.veloq.widget'
version = '0.1.0'

android {
  namespace "com.veloq.widget"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // The snapshot file has one writer, in the engine module, which the native
  // workers share. The app autolinks that module, so this one only compiles
  // against it.
  compileOnly project(':veloqrs')
  testImplementation "junit:junit:4.13.2"
}
