// Generated by uniffi-bindgen-react-native

buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["DummyLibForAndroid_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

// What the Rust build is asked for. The profile defaults to release, which is
// what every build has shipped. Local profile and features come from a Gradle
// property first, then the environment. Each
// selection has its own output directory, outside Gradle's build directory so
// a CI cache restore is not taken for a stale output and deleted.
def rustAbis = reactNativeArchitectures().collect { it.trim() }.findAll { it }.unique().sort()
def releaseRustBuild = System.getenv("APP_VARIANT") == "production" ||
  gradle.startParameter.taskNames.any { it =~ /(?i)(assemble|bundle).*release/ }
def rustProfile = (releaseRustBuild ? "release" :
  (rootProject.findProperty("veloqrsRustProfile") ?: System.getenv("VELOQRS_RUST_PROFILE") ?: "release")).toString()
def rustFeatures = (rootProject.findProperty("veloqrsCargoFeatures") ?: System.getenv("VELOQRS_CARGO_FEATURES") ?: "")
  .toString().split(/[\s,]+/).findAll { it }.unique().sort()
def rustApiLevel = 24
def rustOutDir = file("${projectDir}/../build/rust/android/" +
  ([rustProfile, rustAbis.join("_")] + (rustFeatures ? [rustFeatures.join("_")] : [])).join("-"))

// Where the widget capture test's sources are written, see writeWidgetCaptureSources.
def widgetCaptureDir = "${buildDir}/generated/widgetCapture"

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["Veloqrs_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Veloqrs_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.veloq"
  }

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    consumerProguardFiles 'proguard-rules.pro'

    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared', "-DVELOQRS_RUST_LIB_DIR=${rustOutDir}/jniLibs"
        abiFilters (*reactNativeArchitectures())
      }
    }
    ndk {
      abiFilters (*reactNativeArchitectures())
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    prefab true
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  // Handle duplicate libveloqrs.so from jniLibs and CMake IMPORTED target
  // The Rust library is in jniLibs, CMake imports it for linking, both get picked up
  // Using new packaging DSL (AGP 8.0+) for library module native lib merging
  packaging {
    jniLibs {
      // pickFirst resolves the duplicate by using the first one found
      pickFirsts += ["**/libveloqrs.so"]
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      // The sprite and glyphs the tile interceptor serves as `veloq-asset/`.
      assets.srcDirs += ["../assets"]
      jniLibs.srcDirs = ["${rustOutDir}/jniLibs"]
      if (isNewArchitectureEnabled()) {
          java.srcDirs += [
            "generated/java",
            "generated/jni"
          ]
      }
    }
    // The widget sources the app ships, with the package placeholder filled, so a
    // JVM test runs the production decisions rather than a copy of them.
    test {
      java.srcDirs += [layout.buildDirectory.dir("generated/widgetTestSources")]
    }
    // The widget capture test draws every provider on a device: the widget Kotlin
    // and resources as the plugin writes them for the app, and the snapshot
    // fixtures the engine composes.
    androidTest {
      java.srcDirs += ["${widgetCaptureDir}/app/src/main/java"]
      res.srcDirs += ["${widgetCaptureDir}/app/src/main/res"]
      assets.srcDirs += ["../../../widget/fixtures"]
    }
  }
}

// The test APK's own package, which the widget sources are written for so that
// their `R` is the one the test's resources are merged into.
def widgetCaptureSources = tasks.register("writeWidgetCaptureSources", Exec) {
  def repo = file("../../..")
  inputs.dir(new File(repo, "widget/android")).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir(new File(repo, "src/i18n/locales")).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir(new File(repo, "src/plugins")).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(new File(repo, "scripts/write-widget-test-sources.mjs")).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(widgetCaptureDir)
  workingDir repo
  commandLine "node", "scripts/write-widget-test-sources.mjs", "--out", widgetCaptureDir, "--pkg", "com.veloq.test"
}
tasks.configureEach { task ->
  if (task.name.contains("AndroidTest") && task.name != "writeWidgetCaptureSources") {
    task.dependsOn(widgetCaptureSources)
  }
}

// A Sync, not a Copy, so a source removed from the list or from widget/ leaves the
// test sources too rather than compiling on from an earlier run.
def widgetTestSources = tasks.register("generateWidgetTestSources", Sync) {
  from("../../../widget/android/java") {
    include "ChartText.kt", "ChartStroke.kt", "TileLaunch.kt", "RecordTile.kt", "WidgetSnapshot.kt", "SummaryWidgetModel.kt", "SnapshotAge.kt", "InsightsWidgetModel.kt", "LastActivityWidgetModel.kt", "BodyOutline.kt", "StrengthWidgetModel.kt", "WidgetSizes.kt", "WidgetIdRemap.kt"
    filter { line -> line.replace("__PKG__", "com.veloq") }
  }
  into(layout.buildDirectory.dir("generated/widgetTestSources/com/veloq/widget"))
}
tasks.configureEach { task ->
  if (task.name.startsWith("compile") && task.name.contains("UnitTestKotlin")) {
    task.dependsOn(widgetTestSources)
  }
}

// The instrumentation APK merges this module's jniLibs with React Native's,
// and both carry `libc++_shared.so`. Scoped to the test variant on purpose: the
// artifact the app ships keeps the packaging it has.
androidComponents {
  onVariants(selector().all()) { variant ->
    variant.androidTest?.packaging?.jniLibs?.pickFirsts?.addAll([
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libreactnative.so",
      "**/libjsi.so",
    ])
  }
}

repositories {
  mavenCentral()
  google()
  // `expo-secure-store` ships prebuilt rather than as a Gradle project, and
  // `:expo`, which carries it for the app, depends on this module: a project
  // dependency on it is a cycle. The artifact in its own package is the same
  // classes, and the version is whatever is installed rather than a number
  // pinned here.
  maven {
    url = file("${projectDir}/../../../node_modules/expo-secure-store/local-maven-repo")
  }
  maven {
    url = file("${projectDir}/../../../node_modules/expo-notifications/local-maven-repo")
  }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  // The map's tile interceptor extends the library's own client and manager,
  // so this module compiles against them. The app autolinks the library, so
  // compileOnly keeps a second copy out of this module's artifact.
  compileOnly project(':react-native-webview')
  // The push worker reads the credential `expo-secure-store` wrote, through
  // that module's own encryptor rather than a second copy of the format. The
  // app autolinks every expo module under `:expo`, so this module compiles
  // against it and ships no copy.
  compileOnly "host.exp.exponent:expo.modules.securestore:+"
  compileOnly project(':expo-modules-core')
  androidTestImplementation "host.exp.exponent:expo.modules.securestore:+"
  androidTestImplementation project(':expo-modules-core')
  // The push worker reads the credential `expo-secure-store` wrote, using that
  // module's own encryptor rather than a second copy of the format. Both are
  // autolinked by the app, so this module only compiles against them.
  androidTestImplementation "androidx.test:runner:1.5.2"
  androidTestImplementation "androidx.test.ext:junit:1.1.5"
  // The widget capture test compiles every widget source the app ships, the
  // pickers among them, and those are Material components under a Material 3
  // theme. The same version the widget plugin adds to the app.
  androidTestImplementation "com.google.android.material:material:1.13.0"
  // The push service subclasses Expo's, which the app autolinks under `:expo`,
  // and reads the FCM message that module's own dependency delivers. Neither
  // ships in this module's artifact.
  compileOnly "host.exp.exponent:expo.modules.notifications:+"
  compileOnly "com.google.firebase:firebase-messaging:25.0.1"
  // The push worker and the notification it posts.
  implementation "androidx.work:work-runtime:2.10.2"
  implementation "androidx.core:core:1.13.1"
  // The JVM tests read the same FCM data map the service does, which is
  // `org.json`, and the Android stub of it answers nothing.
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20180813"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "Veloqrs"
    codegenJavaPackageName = "com.veloq"
  }
}

// The Rust library comes from modules/veloqrs/scripts/build-rust.js, the one
// builder Gradle, the iOS scripts and CI share. This task declares the known
// inputs, but the builder fingerprints all inputs and decides whether Cargo
// runs. A failed compile fails the task and leaves no library behind.
def rustTreeDir = file("${projectDir}/../rust")
def rustBuilder = file("${projectDir}/../scripts/build-rust.js")
def rustTask = tasks.register("buildRustLibrary") {
  group = "build"
  description = "Builds the Rust library for ${rustAbis.join(', ')} (${rustProfile}) through build-rust.js"
  inputs.files(fileTree(rustTreeDir) {
    exclude "target/**", "**/target/**"
  }).withPropertyName("rustTree").withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.files(rustBuilder, file("${projectDir}/../scripts/rust-inputs.js"), file("${projectDir}/../../../rust-toolchain.toml"))
    .withPropertyName("builder").withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.property("abis", rustAbis)
  inputs.property("profile", rustProfile)
  inputs.property("features", rustFeatures)
  inputs.property("api", rustApiLevel)
  inputs.property("ndkVersion", android.ndkVersion ?: "")
  // The builder judges which of these change the compiled output; declaring
  // the family here only decides when Gradle hands it the question.
  inputs.property("environment", System.getenv().findAll { name, value ->
    name ==~ /(RUSTC?|RUSTFLAGS|CARGO_(ENCODED_RUSTFLAGS|BUILD_.*|PROFILE_.*|TARGET_.*)|(CC|CXX|AR|CFLAGS|CXXFLAGS|TARGET_CC|TARGET_CFLAGS|TARGET_CXXFLAGS)(_.*)?|LIBSQLITE3_FLAGS)/
  }.sort())
  outputs.dir(rustOutDir)
  outputs.upToDateWhen { false }

  doLast {
    def command = ["node", rustBuilder.absolutePath, "android", "--out", rustOutDir.absolutePath,
                   "--profile", rustProfile, "--api", rustApiLevel.toString(),
                   "--features", rustFeatures.join(",")]
    rustAbis.each { command += ["--abi", it] }
    def ndk = android.ndkDirectory
    if (ndk != null && ndk.exists()) {
      command += ["--ndk", ndk.absolutePath]
    }
    // ProcessBuilder rather than Gradle's exec {}: Gradle 9 removed
    // Project.exec from the task-action context. A Gradle daemon's own output
    // goes to /dev/null, so the builder's and Cargo's lines, a compile error
    // among them, are passed through Gradle's logger to the console.
    def process = new ProcessBuilder(command).redirectErrorStream(true).start()
    process.outputStream.close()
    process.inputStream.eachLine { line -> logger.lifecycle(line) }
    def code = process.waitFor()
    if (code != 0) {
      throw new GradleException("The Rust build failed with exit code ${code}; nothing was packaged from it")
    }
  }
}

// The library must exist before CMake links against it and before the
// native libraries are merged into the package.
tasks.matching { it.name.startsWith("buildCMake") || it.name.startsWith("configureCMake") }.configureEach {
  dependsOn rustTask
}
tasks.matching { it.name.matches("merge.*JniLibFolders") || it.name.matches("merge.*NativeLibs") }.configureEach {
  dependsOn rustTask
}

// Fix duplicate libveloqrs.so: AGP copies jniLibs into CMake output directory,
// causing conflict with the original in jniLibs. Remove the CMake copy before merging.
// The Rust library should only come from jniLibs, which the Rust build fills.
tasks.configureEach { task ->
  if (task.name == "mergeReleaseNativeLibs" || task.name == "mergeDebugNativeLibs") {
    task.doFirst {
      // Delete libveloqrs.so from CMake intermediates (keep only jniLibs copy)
      fileTree(dir: "${buildDir}/intermediates/cxx", includes: ["**/libveloqrs.so"]).each { file ->
        println "[veloqrs] Removing duplicate from CMake output: ${file}"
        file.delete()
      }
    }
  }
}
