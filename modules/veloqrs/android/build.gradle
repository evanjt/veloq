    main {
      if (isNewArchitectureEnabled()) {
          java.srcDirs += [
            "generated/java",
            "generated/jni"
          ]
      }
    }
  }
}

// The instrumentation APK merges this module's jniLibs with React Native's,
// and both carry `libc++_shared.so`. Scoped to the test variant on purpose: the
// artifact the app ships keeps the packaging it has.
androidComponents {
  onVariants(selector().all()) { variant ->
    variant.androidTest?.packaging?.jniLibs?.pickFirsts?.addAll([
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libreactnative.so",
      "**/libjsi.so",
    ])
  }
}

repositories {
  mavenCentral()
  google()
  // `expo-secure-store` ships prebuilt rather than as a Gradle project, and
  // `:expo`, which carries it for the app, depends on this module: a project
  // dependency on it is a cycle. The artifact in its own package is the same
  // classes, and the version is whatever is installed rather than a number
  // pinned here.
  maven {
    url = file("${projectDir}/../../../node_modules/expo-secure-store/local-maven-repo")
  }
  maven {
    url = file("${projectDir}/../../../node_modules/expo-notifications/local-maven-repo")
  }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  // The map's tile interceptor extends the library's own client and manager,
  // so this module compiles against them. The app autolinks the library, so
  // compileOnly keeps a second copy out of this module's artifact.
  compileOnly project(':react-native-webview')
  // The push worker reads the credential `expo-secure-store` wrote, through
  // that module's own encryptor rather than a second copy of the format. The
  // app autolinks every expo module under `:expo`, so this module compiles
  // against it and ships no copy.
  compileOnly "host.exp.exponent:expo.modules.securestore:+"
  compileOnly project(':expo-modules-core')
  androidTestImplementation "host.exp.exponent:expo.modules.securestore:+"
  androidTestImplementation project(':expo-modules-core')
  // The push worker reads the credential `expo-secure-store` wrote, using that
  // module's own encryptor rather than a second copy of the format. Both are
  // autolinked by the app, so this module only compiles against them.
  androidTestImplementation "androidx.test:runner:1.5.2"
  androidTestImplementation "androidx.test.ext:junit:1.1.5"
  // The push service subclasses Expo's, which the app autolinks under `:expo`,
  // and reads the FCM message that module's own dependency delivers. Neither
  // ships in this module's artifact.
  compileOnly "host.exp.exponent:expo.modules.notifications:+"
  compileOnly "com.google.firebase:firebase-messaging:25.0.1"
  // The push worker and the notification it posts.
  implementation "androidx.work:work-runtime:2.10.2"
  implementation "androidx.core:core:1.13.1"
  // The JVM tests read the same FCM data map the service does, which is
  // `org.json`, and the Android stub of it answers nothing.
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20180813"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "Veloqrs"
    codegenJavaPackageName = "com.veloq"
  }
}

// Build Rust library for each requested architecture (local development)
// In CI, the library is pre-built by a separate workflow step.
// Locally, rebuild architectures whose .so is missing OR older than any
// `.rs` source under rust/. Previously the task short-circuited as long as
// the .so existed at all, so a submodule bump silently kept the stale
// binary in the APK, and the user saw "old algorithm" behavior after
// `npx expo run:android` reported success.
task buildRustLibrary {
  def jniLibsDir = file("${projectDir}/src/main/jniLibs")
  def rustDir = file("${projectDir}/../rust/veloqrs")
  def rustRoot = file("${projectDir}/../rust")
  def architectures = reactNativeArchitectures()
  def hashFile = file("${jniLibsDir}/.rust-source-hash")

  architectures.each { arch ->
    outputs.file(file("${jniLibsDir}/${arch}/libveloqrs.so"))
  }
  // The .so depends on Rust *content*, not file mtime. A git checkout, branch
  // switch, or submodule update changes content while leaving mtimes that fool
  // both Cargo and Gradle's timestamp checks, the cause of stale .so shipping
  // in the APK. So always run the action and gate on a content hash of the
  // Rust tree; Cargo's own incremental cache makes a no-op invocation fast.
  outputs.upToDateWhen { false }

  doLast {
    def md = java.security.MessageDigest.getInstance("SHA-256")
    fileTree(dir: rustRoot,
             includes: ["**/*.rs", "**/Cargo.toml", "**/Cargo.lock", "**/.cargo/config.toml"],
             excludes: ["**/target/**"])
      .files.toSorted { a, b -> a.path <=> b.path }.each { f ->
        md.update(f.path.bytes)
        md.update(f.bytes)
      }
    def currentHash = md.digest().encodeHex().toString()
    def storedHash = hashFile.exists() ? hashFile.text.trim() : null
    def missing = architectures.findAll { !file("${jniLibsDir}/${it}/libveloqrs.so").exists() }
    def ci = System.getenv("CI") || System.getenv("GITHUB_ACTIONS")

    if (missing.isEmpty() && storedHash == currentHash) {
      println "[veloqrs] Rust libraries up to date (source hash unchanged)"
      return
    }
    if (missing.isEmpty() && storedHash == null && ci) {
      // CI pre-builds the .so in a separate workflow step. Adopt it and record
      // the hash so Gradle doesn't recompile (which would defeat the CI cache).
      jniLibsDir.mkdirs()
      hashFile.text = currentHash
      println "[veloqrs] Adopting CI-prebuilt Rust library (source hash recorded)"
      return
    }

    println "[veloqrs] Building Rust library (source changed or .so missing) for: ${architectures.join(', ')}..."
    def args = []
    architectures.each { arch -> args.addAll(["-t", arch]) }
    // ProcessBuilder rather than Gradle's exec {}: Gradle 9 (Expo SDK 56)
    // removed Project.exec from the task-action context.
    def cmd = ["cargo", "ndk"] + args + ["--platform", "24",
               "-o", jniLibsDir.absolutePath, "build", "--release", "-p", "veloqrs"]
    // Measurement features such as lock-trace ride in by environment, so a
    // one-off instrumented build needs no edit to Cargo.toml.
    def features = System.getenv("VELOQRS_CARGO_FEATURES")
    if (features) {
      cmd += ["--features", features]
      println "[veloqrs] Cargo features: ${features}"
    }
    def proc = new ProcessBuilder(cmd).directory(rustDir).inheritIO().start()
    def code = proc.waitFor()
    if (code != 0) {
      throw new GradleException("cargo ndk failed with exit code ${code}")
    }
    jniLibsDir.mkdirs()
    hashFile.text = currentHash
    println "[veloqrs] Rust libraries built for: ${architectures.join(', ')}"
  }
}

// Make CMake and JniLibs tasks depend on Rust library
tasks.matching { it.name.startsWith("buildCMake") }.configureEach {
  dependsOn buildRustLibrary
}
tasks.matching { it.name.matches("merge.*JniLibFolders") }.configureEach {
  dependsOn buildRustLibrary
}

// Fix duplicate libveloqrs.so: AGP copies jniLibs into CMake output directory,
// causing conflict with the original in jniLibs. Remove the CMake copy before merging.
// The Rust library should only come from jniLibs (pre-built by cargo-ndk).
tasks.configureEach { task ->
  if (task.name == "mergeReleaseNativeLibs" || task.name == "mergeDebugNativeLibs") {
    task.doFirst {
      // Delete libveloqrs.so from CMake intermediates (keep only jniLibs copy)
      fileTree(dir: "${buildDir}/intermediates/cxx", includes: ["**/libveloqrs.so"]).each { file ->
        println "[veloqrs] Removing duplicate from CMake output: ${file}"
        file.delete()
      }
    }
  }
}
