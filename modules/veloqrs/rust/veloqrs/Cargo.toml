[package]
name = "veloqrs"
version = "0.0.10"
edition = "2024"
authors = ["Evan Thomas <evan@evanjt.com>"]
license = "Apache-2.0"
publish = false

[lib]
name = "veloqrs"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
synthetic = ["tracematch/synthetic"]
# Targets that read the owner's private GPX corpora. The traces never enter the
# repository, so a machine without them must not build these at all.
real-corpus = []
# Times every engine lock take per caller and prints the table to the log.
# Measurement only, never on by default.
lock-trace = []

[dependencies]
# Core algorithm library
tracematch = { path = "../tracematch" }

# FFI bindings
uniffi = { version = "0.31", features = ["cli"] }

# Persistence
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
rusqlite_migration = "1.2"
rmp-serde = "1.1"
postcard = { version = "1", features = ["alloc"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream", "gzip"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
base64 = "0.22"

# Error handling
thiserror = "2"

# FIT file parsing
fitparser = "0.11"

# Common
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
once_cell = "1.21"
lru = "0.18"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
rstar = "0.12"
geo = "0.29"
polyline = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

[dev-dependencies]
tempfile = "3.27"
# The commit hook counts transactions, which is how a page write proves it
# is one commit and not one per row.
rusqlite = { version = "0.31", features = ["hooks"] }
env_logger = "0.11"
criterion = { version = "0.5", features = ["html_reports"] }
sha2 = "0.11"
# Local mock HTTP server for request-path / endpoint tests (services mocked).
httpmock = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

