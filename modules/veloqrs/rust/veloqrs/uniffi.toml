# Generator settings for the TypeScript bindings.
#
# `ubrn.config.yaml` describes where the generated files go; this describes what
# they contain, and uniffi reads it per crate.
[bindings.typescript]
# Omits the generated files' blanket `@ts-nocheck`, so `tsconfig.generated.json`
# typechecks them with the app. That project turns off
# `exactOptionalPropertyTypes` and `noImplicitOverride`, which the generated
# record factories and error classes do not satisfy and which nobody can fix by
# hand in a file rewritten whole on every regeneration.
strictTypeChecking = true
