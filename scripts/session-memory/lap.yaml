# One lap: scroll the feed SCROLLS cards further, open the activity at CARD,
# go back, then visit each tab through the tab bar and return to the feed. Tab
# taps, never deep links, so the stack stays what a person would build.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 20000
- repeat:
    times: ${SCROLLS}
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 30%
          duration: 500
- tapOn:
    id: 'activity-card-demo-(test-[0-9]+|[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+)'
    index: ${CARD}
- extendedWaitUntil:
    visible:
      id: 'activity-detail-screen'
    timeout: 20000
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- back
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 20000
- tapOn: 'Fitness'
- extendedWaitUntil:
    visible:
      id: 'fitness-screen'
    timeout: 20000
- tapOn: 'Map'
- extendedWaitUntil:
    visible:
      id: 'map-screen'
    timeout: 20000
- tapOn: 'Insights'
- extendedWaitUntil:
    visible:
      id: 'routes-screen'
    timeout: 20000
- tapOn: 'Health'
- extendedWaitUntil:
    visible:
      id: 'training-screen'
    timeout: 20000
- tapOn: 'Feed'
- extendedWaitUntil:
    visible:
      id: 'activity-card-demo-(test-[0-9]+|[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+)'
    timeout: 30000
