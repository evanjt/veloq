# Launch the app and enter demo mode, dismissing whatever opens on top.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: 'login-screen'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'login-screen'
    commands:
      - tapOn:
          id: 'login-demo-button'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- runFlow:
    when:
      visible: 'Done'
    commands:
      - tapOn: 'Done'
- runFlow:
    when:
      visible: 'Skip'
    commands:
      - tapOn: 'Skip'
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn: 'Close'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000
- assertVisible:
    id: 'demo-mode-banner'
