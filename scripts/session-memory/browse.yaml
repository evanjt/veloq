# Rapid browsing: scroll the feed to load further pages, open the activity at
# CARD, then switch tabs without waiting for each screen to settle.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 20000
- repeat:
    times: ${SCROLLS}
    commands:
      - swipe:
          direction: UP
          duration: 150
- tapOn:
    id: 'activity-card-demo-(test-[0-9]+|[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+)'
    index: ${CARD}
- extendedWaitUntil:
    visible:
      id: 'activity-detail-screen'
    timeout: 20000
- swipe:
    direction: UP
    duration: 300
- back
- tapOn: 'Map'
- tapOn: 'Fitness'
- tapOn: 'Insights'
- tapOn: 'Map'
- tapOn: 'Health'
- tapOn: 'Fitness'
- tapOn: 'Map'
- tapOn: 'Insights'
- tapOn: 'Feed'
- extendedWaitUntil:
    visible:
      id: 'activity-card-demo-(test-[0-9]+|[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+)'
    timeout: 30000
