# Enter demo mode in an app already opened by adb, dismissing whatever opens on
# top. Some handsets time out Maestro's launchApp for the release id, so a run opens
# the feed first with `am start -a android.intent.action.VIEW -d veloq://` and
# then runs this. Same steps as enter-demo.yaml from the login screen on.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: 'login-screen'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: 'login-screen'
    commands:
      - tapOn:
          id: 'login-demo-button'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- runFlow:
    when:
      visible: 'Done'
    commands:
      - tapOn: 'Done'
- runFlow:
    when:
      visible: 'Skip'
    commands:
      - tapOn: 'Skip'
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn: 'Close'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000
- assertVisible:
    id: 'demo-mode-banner'
