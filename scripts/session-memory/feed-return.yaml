# The gap between tapping the feed tab and its first card being on screen,
# read from this flow's command durations.
appId: ${APP_ID}
---
- tapOn: 'Map'
- extendedWaitUntil:
    visible:
      id: 'map-screen'
    timeout: 20000
- tapOn: 'Feed'
- extendedWaitUntil:
    visible:
      id: 'activity-card-demo-(test-[0-9]+|[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+)'
    timeout: 30000
